<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anabolismo · simulador 3D</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0;background:#06090d}
a{color:#9fd36b}a:hover{color:#c3eaa0}
.mt-app{height:100vh;min-height:640px;display:flex;flex-direction:column;overflow:hidden}
.mt-body{flex:1;min-height:0;display:flex}
.mt-nav{flex:0 0 214px;display:flex;flex-direction:column;gap:2px;padding:14px 10px;overflow-y:auto;border-right:1px solid rgba(255,255,255,.07);background:#080c11}
.mt-stage{flex:1 1 auto;min-width:0;position:relative;overflow:hidden;background:#05080c}
.mt-side{flex:0 0 372px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.07);background:#0a0e13}
.mt-scn{display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:0;color:#a9b4bf;padding:8px 10px;border-radius:8px;font:500 13.5px/1.25 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer;min-height:44px;flex:none}
.mt-scn:hover{background:rgba(255,255,255,.05);color:#fff}
.mt-scn.on{background:rgba(159,211,107,.11);color:#fff;box-shadow:inset 0 0 0 1px rgba(159,211,107,.38)}
.mt-scn .n{font:500 11px/1 'IBM Plex Mono',monospace;color:#7f8a96;min-width:18px}
.mt-scn.on .n{color:#9fd36b}
.mt-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:19px;background:rgba(9,13,19,.78);border:1px solid rgba(255,255,255,.15);color:#e6ebf0;font:500 12.5px/1 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(6px);pointer-events:auto}
.mt-btn:hover{border-color:rgba(255,255,255,.35)}
.mt-btn.on{border-color:rgba(159,211,107,.7);color:#c3eaa0}
.mt-btn.sm{padding:0 10px;font-family:'IBM Plex Mono',monospace}
.mt-stg{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:8px 10px;border-radius:8px;color:#8f9aa6}
.mt-stg .k{font:500 11px/20px 'IBM Plex Mono',monospace;text-align:center;border-radius:6px;background:rgba(255,255,255,.06);height:20px}
.mt-stg.on{background:rgba(255,255,255,.05);color:#f1f4f7}
.mt-stg.on .k{background:#9fd36b;color:#0f1a08}
.mt-tg{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;color:#c9d2db;cursor:pointer;font:400 13px/1.35 'IBM Plex Sans',system-ui,sans-serif;min-height:44px}
.mt-tg:hover{border-color:rgba(255,255,255,.22)}
.mt-tg .sw{flex:none;width:32px;height:18px;border-radius:9px;background:#2a323c;position:relative;margin-top:1px;transition:background .2s}
.mt-tg .sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:#c9d2db;transition:left .2s}
.mt-tg.on{border-color:rgba(255,120,90,.55);background:rgba(255,120,90,.07)}
.mt-tg.on .sw{background:#e2674a}
.mt-tg.on .sw::after{left:16px;background:#fff}
.mt-chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#c9d2db;font:500 12.5px/1 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer}
.mt-chip:hover{border-color:rgba(255,255,255,.35)}
.mt-chip.on{background:#9fd36b;border-color:#9fd36b;color:#0f1a08}
.mt-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font:400 13px/1.4 'IBM Plex Sans',system-ui,sans-serif;color:#c3ccd5}
.mt-row span:last-child{font-family:'IBM Plex Mono',monospace;color:#f1f4f7;text-align:right}
.mt-row.tot{border-bottom:0;color:#fff;font-weight:600}
.mt-row.tot span:last-child{color:#9fd36b}
.mt-range{width:100%;accent-color:#9fd36b}
.mt-h{margin:0;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#7f8a96}
.mt-hint{pointer-events:none}
@media (max-width:1100px){.mt-side{flex-basis:320px}.mt-nav{flex-basis:186px}}
@media (max-width:820px){.mt-app{height:auto;overflow:visible}.mt-body{flex-direction:column}.mt-nav{flex:none;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid rgba(255,255,255,.07)}.mt-stage{height:64vh;min-height:400px;flex:none}.mt-side{flex:none;border-left:0}.mt-hint{display:none}}
</style>

</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div class="mt-app" style="background:#06090d;color:#e6ebf0;font-family:'IBM Plex Sans',system-ui,sans-serif">
  <header style="display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap">
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
      <span style="font-family:'Instrument Serif',serif;font-size:30px;line-height:1;color:#f4f1ea">Metabolismo celular</span>
      <span style="font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#9fd36b">Simulador 3D · Anabolismo</span>
    </div>
    <nav style="margin-left:auto;display:flex;gap:8px;align-items:center" aria-label="Simuladores">
      <a href="catabolismo.html" class="mt-btn" style="text-decoration:none">← Catabolismo</a>
      <span class="mt-btn on" style="cursor:default">Anabolismo</span>
    </nav>
  </header>
  <div class="mt-body">
    <nav class="mt-nav" aria-label="Escenas">
      <sc-for list="{{scenes}}" as="s" hint-placeholder-count="8">
        <button class="{{s.cls}}" onClick="{{s.go}}"><span class="n">{{s.num}}</span><span>{{s.name}}</span></button>
      </sc-for>
    </nav>
    <main class="mt-stage">
      <canvas data-mt="gl" ref="{{glRef}}" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
      <canvas data-mt="ov" ref="{{ovRef}}" style="position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab"></canvas>
      <div style="position:absolute;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:flex-start;pointer-events:none;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:20px;background:rgba(9,13,19,.78);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);max-width:520px">
          <span style="font:600 11px/22px 'IBM Plex Mono',monospace;background:#9fd36b;color:#0f1a08;border-radius:11px;min-width:22px;text-align:center">{{stageNum}}</span>
          <span style="font-size:13.5px;color:#f1f4f7">{{stageNow}}</span>
        </div>
        <sc-if value="{{hasSub}}" hint-placeholder-val="{{false}}">
          <div style="padding:9px 14px;border-radius:12px;background:rgba(80,20,14,.82);border:1px solid rgba(255,120,90,.5);font-size:13px;line-height:1.4;color:#ffd9cf;max-width:460px">{{sub}}</div>
        </sc-if>
      </div>
      <sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
        <div style="position:absolute;top:64px;right:14px;width:300px;max-width:calc(100% - 28px);padding:14px 16px;border-radius:12px;background:rgba(9,13,19,.9);border:1px solid rgba(159,211,107,.4);backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;gap:8px;align-items:flex-start">
            <span style="flex:1;font:400 22px/1.1 'Instrument Serif',serif;color:#f4f1ea">{{selTitle}}</span>
            <button class="mt-btn" style="height:32px;width:32px;padding:0;justify-content:center" onClick="{{closeSel}}" aria-label="Cerrar">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l10 10M11 1L1 11"></path></svg>
            </button>
          </div>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#c9d2db">{{selText}}</p>
          <sc-if value="{{hasSelGo}}" hint-placeholder-val="{{false}}">
            <button class="mt-btn on" style="align-self:flex-start" onClick="{{selGo}}">{{selGoLabel}}</button>
          </sc-if>
        </div>
      </sc-if>
      <sc-if value="{{noGL}}" hint-placeholder-val="{{false}}">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#c9d2db">Este navegador no admite WebGL 2, necesario para el simulador 3D.</div>
      </sc-if>
      <div style="position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none">
        <button class="mt-btn" onClick="{{togglePlay}}" aria-label="Reproducir o pausar">
          <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="1.5" y="1" width="3" height="10" rx="1"></rect><rect x="7.5" y="1" width="3" height="10" rx="1"></rect></svg><span>Pausa</span></sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M2 1l9 5-9 5z"></path></svg><span>Reproducir</span></sc-if>
        </button>
        <button class="mt-btn" onClick="{{step}}">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M1 1l7 5-7 5z"></path><rect x="9" y="1" width="2" height="10" rx="1"></rect></svg><span>Siguiente fase</span>
        </button>
        <div style="display:flex;gap:4px;pointer-events:auto">
          <sc-for list="{{speeds}}" as="v" hint-placeholder-count="3">
            <button class="{{v.cls}}" onClick="{{v.pick}}">{{v.label}}</button>
          </sc-for>
        </div>
        <button class="{{labelsCls}}" onClick="{{toggleLabels}}">Etiquetas</button>
        <button class="mt-btn" onClick="{{recenter}}">Recentrar</button>
        <span class="mt-hint" style="margin-left:auto;font:400 12px/1.4 'IBM Plex Sans',system-ui,sans-serif;color:#8e99a5;text-align:right">Arrastra para girar · rueda o pellizco para acercar · Mayús + arrastrar para desplazar · clic en una estructura para ver qué es</span>
      </div>
    </main>
    <aside class="mt-side" style="padding:22px 22px 32px;display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;flex-direction:column;gap:8px">
        <span class="mt-h" style="color:#9fd36b">{{kicker}}</span>
        <h1 style="margin:0;font:400 34px/1.05 'Instrument Serif',serif;color:#f4f1ea">{{title}}</h1>
        <p style="margin:0;font-size:14px;line-height:1.55;color:#b9c3cd;text-wrap:pretty">{{lead}}</p>
      </div>
      <sc-if value="{{hasEq}}" hint-placeholder-val="{{true}}">
        <div style="font:500 12.5px/1.6 'IBM Plex Mono',monospace;color:#efe7d6;padding:11px 13px;border-radius:10px;background:rgba(159,211,107,.07);border:1px solid rgba(159,211,107,.28);white-space:pre-line">{{eq}}</div>
      </sc-if>
      <sc-if value="{{hasCounters}}" hint-placeholder-val="{{false}}">
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
          <sc-for list="{{counters}}" as="c" hint-placeholder-count="4">
            <div style="padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:6px">
              <span style="display:flex;align-items:center;gap:7px;font-size:11.5px;color:#9aa5b1"><span style="width:8px;height:8px;border-radius:4px;flex:none;{{c.dot}}"></span>{{c.label}}</span>
              <span style="font:500 20px/1 'IBM Plex Mono',monospace;color:#f4f6f8">{{c.value}}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{hasChips}}" hint-placeholder-val="{{false}}">
        <sc-for list="{{chips}}" as="cg" hint-placeholder-count="1">
          <div style="display:flex;flex-direction:column;gap:10px">
            <p class="mt-h">{{cg.label}}</p>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <sc-for list="{{cg.opts}}" as="op" hint-placeholder-count="3">
                <button class="{{op.cls}}" onClick="{{op.pick}}">{{op.label}}</button>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{hasToggles}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;flex-direction:column;gap:8px">
          <p class="mt-h">Experimenta</p>
          <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
            <button class="{{t.cls}}" onClick="{{t.toggle}}" aria-pressed="{{t.on}}"><span class="sw"></span><span style="display:flex;flex-direction:column;gap:2px"><b style="font-weight:600;color:#f1f4f7">{{t.label}}</b><span style="font-size:12px;color:#9aa5b1">{{t.desc}}</span></span></button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{hasRanges}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;flex-direction:column;gap:12px">
          <p class="mt-h">Condiciones</p>
          <sc-for list="{{ranges}}" as="rg" hint-placeholder-count="2">
            <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#c9d2db">
              <span style="display:flex;justify-content:space-between;gap:10px"><span>{{rg.label}}</span><span style="font-family:'IBM Plex Mono',monospace;color:#f1f4f7">{{rg.disp}}</span></span>
              <input class="mt-range" type="range" min="{{rg.min}}" max="{{rg.max}}" step="{{rg.step}}" value="{{rg.value}}" onChange="{{rg.onChange}}">
            </label>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{hasCharts}}" hint-placeholder-val="{{false}}">
        <sc-for list="{{charts}}" as="ch" hint-placeholder-count="1">
          <div style="display:flex;flex-direction:column;gap:8px">
            <p class="mt-h">{{ch.title}}</p>
            <div style="position:relative">
              <svg viewBox="0 0 300 170" width="100%" style="display:block;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px" role="img" aria-label="{{ch.title}}">
                <path d="M24 150 L292 150 M24 150 L24 10" stroke="rgba(255,255,255,.35)" stroke-width="1" fill="none"></path>
                <path d="{{ch.p1.d}}" stroke="{{ch.p1.c}}" stroke-width="{{ch.p1.w}}" stroke-dasharray="{{ch.p1.dash}}" fill="none" stroke-linejoin="round"></path>
                <path d="{{ch.p2.d}}" stroke="{{ch.p2.c}}" stroke-width="{{ch.p2.w}}" stroke-dasharray="{{ch.p2.dash}}" fill="none" stroke-linejoin="round"></path>
                <path d="{{ch.p3.d}}" stroke="{{ch.p3.c}}" stroke-width="{{ch.p3.w}}" stroke-dasharray="{{ch.p3.dash}}" fill="none" stroke-linejoin="round"></path>
                <path d="{{ch.p4.d}}" stroke="{{ch.p4.c}}" stroke-width="{{ch.p4.w}}" stroke-dasharray="{{ch.p4.dash}}" fill="none" stroke-linejoin="round"></path>
                <path d="{{ch.p5.d}}" stroke="{{ch.p5.c}}" stroke-width="{{ch.p5.w}}" stroke-dasharray="{{ch.p5.dash}}" fill="none" stroke-linejoin="round"></path>
                <circle cx="{{ch.d1.x}}" cy="{{ch.d1.y}}" r="{{ch.d1.r}}" fill="{{ch.d1.c}}" stroke="#0a0e13" stroke-width="2"></circle>
                <circle cx="{{ch.d2.x}}" cy="{{ch.d2.y}}" r="{{ch.d2.r}}" fill="{{ch.d2.c}}" stroke="#0a0e13" stroke-width="2"></circle>
                <circle cx="{{ch.d3.x}}" cy="{{ch.d3.y}}" r="{{ch.d3.r}}" fill="{{ch.d3.c}}" stroke="#0a0e13" stroke-width="2"></circle>
                <text x="292" y="164" text-anchor="end" fill="#9aa5b1" font-size="10" font-family="IBM Plex Sans, sans-serif">{{ch.xl}}</text>
                <text x="28" y="9" fill="#9aa5b1" font-size="10" font-family="IBM Plex Sans, sans-serif">{{ch.yl}}</text>
              </svg>
              <sc-for list="{{ch.labels}}" as="lb" hint-placeholder-count="0">
                <span style="position:absolute;font:500 10px/1.1 'IBM Plex Sans',system-ui,sans-serif;white-space:nowrap;pointer-events:none;{{lb.st}}">{{lb.t}}</span>
              </sc-for>
            </div>
            <sc-if value="{{ch.hasLegend}}" hint-placeholder-val="{{false}}">
              <div style="display:flex;gap:12px;flex-wrap:wrap">
                <sc-for list="{{ch.legend}}" as="lg" hint-placeholder-count="2">
                  <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#c9d2db"><span style="width:14px;height:3px;border-radius:2px;{{lg.dot}}"></span>{{lg.t}}</span>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </sc-if>
      <div style="display:flex;flex-direction:column;gap:4px">
        <p class="mt-h" style="margin-bottom:6px">Fases</p>
        <sc-for list="{{stages}}" as="st" hint-placeholder-count="5">
          <div class="{{st.cls}}">
            <span class="k">{{st.n}}</span>
            <div style="display:flex;flex-direction:column;gap:4px">
              <span style="font-size:13.5px;font-weight:500">{{st.t}}</span>
              <sc-if value="{{st.on}}" hint-placeholder-val="{{false}}"><span style="font-size:12.5px;line-height:1.5;color:#b9c3cd">{{st.d}}</span></sc-if>
            </div>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{hasRows}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;flex-direction:column">
          <p class="mt-h" style="margin-bottom:6px">{{rowsTitle}}</p>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
            <div class="{{r.cls}}"><span>{{r.a}}</span><span>{{r.b}}</span></div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{hasNotes}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;flex-direction:column;gap:12px">
          <sc-for list="{{notes}}" as="nt" hint-placeholder-count="2">
            <div style="display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07)">
              <span style="font:400 19px/1.2 'Instrument Serif',serif;color:#f4f1ea">{{nt.t}}</span>
              <span style="font-size:13px;line-height:1.55;color:#aeb8c3">{{nt.d}}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </aside>
  </div>
</div>
</template>

/* ---- 3. Ciclo de Calvin ---- */

  for(let k=0;k<8;k++){const a=(k%4)*TAU/4+TAU/8,y=k<4?1.55:-1.55;rub.add(blob(E,{p:[.95*Math.cos(a),y,.95*Math.sin(a)],size:[.42,.32,.42],col:'#86c79f',seed:210+k,n:8}));}root.add(rub);
  const pgk=blob(E,{p:v3.add(RED,[-1.4,0,-1.6]),size:[1,1,1],col:'#d0954f',seed:220,n:30,pick:{t:'Fosfoglicerato quinasa',d:'Fosforila el 3-fosfoglicerato con ATP de la fase luminosa: se forma 1,3-bisfosfoglicerato.'},label:{t:'Fosfoglicerato quinasa',dy:-60}});
  const gap=blob(E,{p:v3.add(RED,[1.4,0,-1.6]),size:[1,1,1],col:'#4b9cc9',seed:221,n:30,pick:{t:'Gliceraldehído-3-P deshidrogenasa',d:'Reduce el 1,3-bisfosfoglicerato con NADPH: se forma gliceraldehído-3-fosfato (G3P), la primera triosa del ciclo.'},label:{t:'G3P deshidrogenasa',dy:60}});root.add(pgk);root.add(gap);
  const regG=new N3({p:REG,pick:{t:'Enzimas de la regeneración',d:'Un conjunto de enzimas (aldolasa, transcetolasa, fosfatasas…) reorganiza 5 moléculas de G3P (15 C) en 3 de ribulosa-5-fosfato (15 C). La fosforribuloquinasa gasta 3 ATP para formar 3 RuBP.'},pickR:2.4,label:{t:'Regeneración de la RuBP',dy:-90}});
  for(let k=0;k<6;k++){const a=k*TAU/6;regG.add(blob(E,{p:[1.5*Math.cos(a),(k%2-.5)*.6,1.5*Math.sin(a)-1.4],size:[.6,.55,.6],col:['#8f74c0','#5fa679','#c9a24b','#6aa0a0','#b47aa6','#7f8fb8'][k],seed:230+k,n:12}));}root.add(regG);
  const gran=new N3({p:LUM,pick:{t:'Tilacoides (fase luminosa)',d:'Proporcionan el ATP y el NADPH que consume el ciclo, y reciben de vuelta ADP, Pi y NADP⁺.',go:1},pickR:2.4,label:{t:'Tilacoides · fase luminosa',dy:-110}});for(let k=0;k<9;k++)gran.add(new N3({geo:E.g.cyl,p:[0,(k-4)*.26,0],s:[1.8,.16,1.8],col:k%2?'#2e7a30':'#2a722c',rim:.5,tex:.3}));root.add(gran);
  const starch=new N3({geo:E.g.sphere,p:SUG,s:[.6,.4,.5],col:'#ece4cc',rim:.5,tex:.15,pick:{t:'Destino del G3P',d:'Parte del G3P se convierte en almidón dentro del cloroplasto y otra parte sale al citosol para formar sacarosa, que viaja por el floema. También es el punto de partida para fabricar aminoácidos y ácidos grasos.'},pickR:1.4,label:{t:'Almidón / sacarosa',dy:-60}});root.add(starch);
  const rail=smooth([FIX,RED,REG,FIX].map(p=>v3.add(p,[0,-.6,1.2])),12);root.add(new N3({geo:E.tube(rail,.06,6),col:H('#9fd36b',.4),emit:.5,rim:0,tex:0}));
  root.add(tag(v3.add(FIX,[0,2.3,2]),'1 · Fijación del CO₂',null,{c:'#9fd36b',dy:-40}));root.add(tag(v3.add(RED,[0,2.2,1]),'2 · Reducción',null,{c:'#9fd36b'}));root.add(tag(v3.add(REG,[0,-1.6,2]),'3 · Regeneración',null,{c:'#9fd36b',dy:50}));
  const grid=(c,n,cols)=>{const out=[];cols=cols||3;for(let i=0;i<n;i++){const r=Math.floor(i/cols),k=i%cols;out.push(v3.add(c,[(k-(cols-1)/2)*1.9,r*1.3-.4,1.8]));}return out;};
  function token(kin,kout,to,txt,col,delay){later(P,delay||0,()=>{const t=mol(E,root,kin,v3.add(LUM,[0,1,1]),.2);A.move(t,v3.add(to,[0,1,.4]),1.1,{arc:1.5,end:()=>{kill(t);const b=mol(E,root,kout,v3.add(to,[0,1,.4]),.2);A.move(b,v3.add(LUM,[0,-1,1]),1.4,{arc:1.2,kill:true});if(txt)E.pop(to,txt,col);}});});}
  P.add((function*(){
    let rb=grid(FIX,3).map((p,k)=>mol(E,root,'rubp',p,.3,k?null:'RuBP (5C) ×3'));

      rb.forEach((r,k)=>{const g=mol(E,root,isPR[k]?'o2':'co2',[-12+k*1.5,6,-14],.32,k===0?(isPR[k]?'O₂ (fotorrespiración)':'CO₂ (atmósfera)'):null);A.move(g,v3.add(r.p,[0,.8,0]),2.0,{kill:true,delay:k*.25});});yield 2.6;
      F.pulse(rub,.35,1.4);rb.forEach(kill);const n3=6-nPR;let pg=grid(FIX,n3).map((p,k)=>mol(E,root,'3pg',p,.3,k?null:'3-Fosfoglicerato (3C) ×'+n3));

      S.stage=4;const gg=grid(REG,pg.length);pg.forEach((m,k)=>A.move(m,gg[k],2.0,{delay:k*.06}));yield 2.3;

      const gf=grid(FIX,3);rb.forEach((m,k)=>A.move(m,gf[k],2.2));yield 2.4;S.turn++;}})());
  return {root,cam:{yaw:0,pitch:.8,dist:26,t:[0,0,.8]},fog:[30,80],bg:['#16231a','#040805'],minD:8,maxD:70,
    update(dt){P.update(dt);A.update(dt);F.update(dt);rub.q=qAxis([0,1,0],(rub._a=(rub._a||0)+dt*.2));},stage:()=>S.stage,

/* ---- 4. Plantas C3, C4 y CAM ---- */
function sC4(E,O){
  const T=O.tipo;const root=new N3(),A=new Anim(),P=new Procs(),F=new FX(),R=rng(19);const S={stage:0,co2:0,mal:0,pr:0,atp:0,night:false,t:0,vac:0};
  const enzB=(p,col,t,d,dy)=>{const b=blob(E,{p,size:[.9,.85,.9],col,seed:300+((p[0]*7)|0)+((p[1]*3)|0),n:24,pick:{t,d},label:{t,dy:dy||-60}});root.add(b);return b;};
  const stoma=[];const ST=[-16,0,0];for(const s of [1,-1]){const g=new N3({geo:E.capsule(3.2,.85),p:[ST[0],s*1.1,0],q:qAxis([1,0,0],Math.PI/2),col:'#5fa142',rim:.6,tex:.35});root.add(g);stoma.push(g);}

  let pepc,mdh,me,rbc,ppdk;const PEPC_d='Enzima del citosol que fija el CO₂ (como HCO₃⁻) sobre el fosfoenolpiruvato. Tiene mucha más afinidad por el CO₂ que la RuBisCO y no reacciona con el O₂.';

    me=enzB([2.4,0,-.6],'#d0954f','Enzima málica','Descarboxila el malato: libera CO₂ y piruvato y forma NADPH.');rbc=enzB([6.6,0,-.6],'#3f8f6a','RuBisCO · ciclo de Calvin','Recibe CO₂ muy concentrado, así que apenas fija O₂: casi no hay fotorrespiración.');
    ppdk=enzB([-4.4,-2.2,-.6],'#5fa679','Piruvato fosfato diquinasa','Regenera el fosfoenolpiruvato a partir del piruvato gastando ATP (que pasa a AMP).',60);
    P.add((function*(){while(true){
      S.stage=0;const c=mol(E,root,'co2',[-20,0,.8],.32,'CO₂');A.path(c,[c.p,[-16,0,.8],[-8,.9,.8]],2.4);const pep=mol(E,root,'pep',[-8.6,-.9,.9],.3,'PEP (3C)');yield 2.5;
      S.stage=1;F.pulse(pepc,.4,1.4);kill(c);let m=swapM(E,root,pep,'oxa','Oxalacetato (4C)');S.co2++;yield 1.2;A.move(m,[-5,1.6,.9],1.1);yield 1.2;F.pulse(mdh,.4,1.2);m=swapM(E,root,m,'mal','Malato (4C)');yield .9;
      S.stage=2;A.path(m,[m.p,[-2.6,0,.9],[-.6,0,.9],[2.2,.2,.9]],2.4);yield 2.5;

      S.stage=4;A.path(py,[py.p,[-.6,-1.2,.9],[-2.6,-1.2,.9],[-4.4,-2.2,.9]],2.4);yield 2.5;F.pulse(ppdk,.4,1.2);const t=mol(E,root,'atp',[-4.4,-4.4,1],.22);A.move(t,[-4.4,-2.6,1],.8,{end:()=>{kill(t);const a=mol(E,root,'amp',[-4.4,-2.6,1],.22);A.move(a,[-4,-6,2],1.2,{kill:true});}});S.atp+=2;yield 1.0;py=swapM(E,root,py,'pep',null);A.move(py,[-8.6,-.9,.9],1.6,{kill:true});E.pop([-4.4,-2,1],'Piruvato + ATP → PEP',C_ATP);yield 1.7;}})());}
  else if(T==='CAM'){

    pepc=enzB([-7,1,-.6],'#c4665b','PEP carboxilasa (noche)',PEPC_d);me=enzB([4.6,1.6,-.6],'#d0954f','Enzima málica (día)','Libera el CO₂ del malato almacenado.');rbc=enzB([7.2,-1,-.6],'#3f8f6a','RuBisCO · ciclo de Calvin (día)','De día recibe el CO₂ procedente del malato, con los estomas cerrados.');
    const malS=[];

      yield 2;}})());}
  else{
    const MC=[-4,0,0];root.add(new N3({geo:E.g.sphere,p:MC,s:[7,4.2,3.4],col:H('#8ccf62',.16),rim:.9,tex:.2,pick:{t:'Célula del mesófilo (C3)',d:'La RuBisCO fija directamente el CO₂ que entra por los estomas. El primer producto estable es el 3-fosfoglicerato (3 C): de ahí el nombre C3.'},pickR:1}));chl(MC,8,[7,4.2,3.4]);
    rbc=enzB([-3,0,-.6],'#3f8f6a','RuBisCO','Fija CO₂ … pero, si hay poco CO₂ y mucho O₂, también fija O₂ (fotorrespiración).');
    P.add((function*(){while(true){const pr=R()<(O.calor?.45:.12);S.stage=0;const c=mol(E,root,pr?'o2':'co2',[-20,0,.8],.32,pr?'O₂':'CO₂');A.path(c,[c.p,[-16,0,.8],[-3,.9,.9]],2.4);yield 2.5;
      F.pulse(rbc,.4,1.2);kill(c);if(pr){S.stage=2;S.pr++;const g=mol(E,root,'pglicolato',[-3,.9,.9],.3,'2-Fosfoglicolato');A.move(g,[6,6,1],2.4,{kill:true});E.pop([-3,1.2,.9],'Fotorrespiración: se pierde C',C_O2);}else{S.stage=1;S.co2++;const p=mol(E,root,'3pg',[-3,.9,.9],.3,'3-Fosfoglicerato ×2');A.move(p,[6,0,1],2.2,{kill:true});E.pop([-3,1.2,.9],'→ ciclo de Calvin','#9fd36b');}yield 2.4;}})());}

/* ---- 5. Factores limitantes (experimento con Elodea) ---- */
function rateModel(L,C,T){const fL=1.15*L/(L+28),fC=1.15*C/(C+22);const fT=T<=0||T>=50?0:Math.exp(-Math.pow((T-27)/12,2))*(T>38?Math.max(0,(50-T)/12):1);const g=Math.min(fL,fC,1)*fT;const resp=.12*Math.min(1,Math.exp((T-25)/20));return {fL,fC,fT,g,net:g-resp};}
function sFactors(E,O){
  const root=new N3(),A=new Anim(),P=new Procs(),F=new FX(),R=rng(23);const S={stage:0,o2:0,acc:0};
  root.add(new N3({geo:E.capsule(13,2.2),p:[0,0,0],col:H('#dfeaf2',.1),rim:.95,tex:0,pick:{t:'Tubo de ensayo',d:'Contiene agua con bicarbonato (fuente de CO₂) y una ramita de Elodea, una planta acuática. Contar las burbujas de O₂ por minuto mide la velocidad de la fotosíntesis.'},pickR:1}));
  root.add(new N3({geo:E.capsule(12,2.05),p:[0,-.4,0],col:H('#4f8fb8',.1),rim:.6,tex:.05}));
  const stem=[[0,-7,0],[.3,-4,.2],[-.2,-1,0],[.3,2,-.2],[.2,4.6,0]];const sp=smooth(stem,10);root.add(new N3({geo:E.tube(sp,.12,8),col:'#5f9a3a',rim:.5,tex:.3}));
  const pl=new N3({pick:{t:'Elodea',d:'Planta acuática muy usada en el laboratorio: el O₂ de la fotosíntesis sale en burbujas por el corte del tallo.'},pickR:3,label:{t:'Elodea',dy:-40}});pl.p=[0,1,0];root.add(pl);
  for(let i=4;i<sp.length-2;i+=3){const c=sp[i];for(let k=0;k<3;k++){const a=k*TAU/3+i;const d=[Math.cos(a),.35,Math.sin(a)];root.add(new N3({geo:E.g.sphere,p:v3.add(c,v3.mul(d,.7)),q:qFromTo([1,0,0],d),s:[.75,.07,.24],col:'#4c9a36',rim:.6,tex:.3}));}}
  const tip=sp[sp.length-1];
  const lamp=new N3({p:[-12,1,3]});lamp.add(new N3({geo:E.g.cyl,p:[-.9,0,0],q:qAxis([0,0,1],Math.PI/2),s:[1.5,1.6,1.5],col:'#3b3f45',rim:.5,tex:.2}));const bulb=lamp.add(new N3({geo:E.g.sphere,s:1,col:'#fff1b8',emit:1,rim:0,tex:0}));const lg=lamp.add(new N3({glow:{s:4,c:[1,.9,.55,.8]}}));lamp.pick={t:'Foco de luz',d:'Cuanto más cerca del tubo, mayor es la intensidad luminosa que recibe la planta.'};lamp.pickR=1.6;lamp.label={t:'Luz',dy:-50};root.add(lamp);
  const hc=new N3({frozen:true});root.add(hc);const dots=[];for(let k=0;k<60;k++){const d=ball(E,[(R()-.5)*3.2,-6+R()*12,(R()-.5)*3.2],.07,'#e6eef6',{emit:.2,rim:.4,tex:0});root.add(d);dots.push(d);}
  dots[0].label={t:'HCO₃⁻ / CO₂',dy:40};
  const bub=[];function bubble(p){const b=ball(E,p,.14+R()*.08,H('#f2f8ff',.35),{rim:.95,tex:0});b.v=1.6+R()*.8;root.add(b);bub.push(b);}
  root.add(tag([3,-6,2],'Termómetro del baño',null,{dy:40}));const th=new N3({geo:E.g.cyl,p:[3.2,-2,1.8],s:[.15,8,.15],col:H('#e6eef6',.3),rim:.9});root.add(th);const thq=new N3({geo:E.g.cyl,p:[3.2,-5,1.8],s:[.09,2,.09],col:'#e2402c',emit:.4});root.add(thq);
  return {root,cam:{yaw:.45,pitch:.15,dist:26,t:[-3,0,0]},fog:[30,80],bg:['#121a22','#030507'],minD:8,maxD:60,
    update(dt){A.update(dt);F.update(dt);const L=O.luz*FEFF[O.color||'blanca'],C=O.co2,T=O.temp;const m=rateModel(L,C,T);
      lamp.p[0]+=((-6-(1-O.luz/100)*12)-lamp.p[0])*Math.min(1,dt*3);lg.glow.s=.5+4.5*O.luz/100;bulb.emit=.2+.8*O.luz/100;bulb.col=O.luz>0?H(LHEX[O.color||'blanca']):H('#5b5a50');const lc=LCOL[O.color||'blanca'];lg.glow.c=[lc[0],lc[1],lc[2],.8];
      dots.forEach((d,i)=>{d.visible=i<C*.6;d.p=[d.p[0]+Math.sin(i+d.p[1])*dt*.1,d.p[1]+(Math.sin(i*1.7+d.p[0]*2))*dt*.1,d.p[2]];});
      const tq=clamp(T/50,0,1);thq.s=[.09,.4+7.4*tq,.09];thq.p=[3.2,-6+(.4+7.4*tq)/2,1.8];
      if(m.net>0){S.acc+=dt*m.net*5;while(S.acc>=1){S.acc--;bubble(v3.add(tip,[(R()-.5)*.2,0,(R()-.5)*.2]));S.o2++;}}
      for(let i=bub.length-1;i>=0;i--){const b=bub[i];b.p=[b.p[0]+Math.sin(b.p[1]*4+i)*.004,b.p[1]+b.v*dt,b.p[2]];if(b.p[1]>7.4){kill(b);bub.splice(i,1);}}
      S.stage=m.net<=0?3:m.fT<.7?2:(m.fL<m.fC?0:1);},
    stage:()=>S.stage,
    counters:()=>{const m=rateModel(O.luz*FEFF[O.color||'blanca'],O.co2,O.temp);return [['Burbujas de O₂ por minuto',Math.max(0,Math.round(m.net*5*60)),C_O2],['Fotosíntesis bruta',Math.round(m.g*100)+' %','#9fd36b'],['Factor limitante',m.net<=0&&m.g<.05?'—':m.fT<.7?'Temperatura':(m.fL<m.fC?'Luz':'CO₂'),'#e6ebf0'],['Burbujas contadas',S.o2,'#cfd6dd']];},
    charts:()=>factorsCharts(O),
    sub:()=>{const m=rateModel(O.luz*FEFF[O.color||'blanca'],O.co2,O.temp);if(O.temp>=42)return 'Temperatura muy alta: las enzimas, como la RuBisCO, se desnaturalizan y la fotosíntesis cae en picado.';if(m.net<=0)return 'Por debajo del punto de compensación: la planta consume en la respiración tanto O₂ como produce (o más). No salen burbujas.';return '';}};}

/* ---- 6. Balance global ---- */
function sSum(E,O){
  const root=new N3(),A=new Anim(),P=new Procs(),F=new FX(),R=rng(29);const S={stage:0,glc:0};
  const C0=[0,1,0];root.add(new N3({geo:E.g.cyl,p:[0,-.3,0],s:[3,.12,3],col:'#2a2f2a',rim:.3,tex:.3}));
  root.add(tag([-9,4.6,0],'6 CO₂',null,{c:C_CO2}));root.add(tag([-9,-2.6,0],'12 H₂O',null,{c:'#9fd3ff',dy:40}));root.add(tag([9,4.6,0],'18 ATP',null,{c:C_ATP}));root.add(tag([9,-2.6,0],'12 NADPH',null,{c:C_NADPH,dy:40}));
  P.add((function*(){while(true){
    const co2=[],w=[],atp=[],nad=[];S.stage=0;
    for(let k=0;k<6;k++){const a=k*TAU/6;co2.push(mol(E,root,'co2',[-9+Math.cos(a)*1.6,3+Math.sin(a)*1.0,0],.32));yield .08;}
    for(let k=0;k<12;k++){w.push(mol(E,root,'h2o',[-10.5+(k%4)*1,-1+Math.floor(k/4)*.9,(k%2)*.5],.3));yield .05;}yield 1.0;
    S.stage=1;const os=[];for(let k=0;k<6;k++){const o=mol(E,root,'o2',[-9.5+(k%3)*1.2,-.5,0],.32,k?null:'6 O₂ a la atmósfera');os.push(o);A.move(o,[-6+k*1.2,9,-2],2.6,{kill:true,delay:.4+k*.1});}w.slice(0,12).forEach((m,k)=>A.move(m,[-9.5+(k%3)*1.2,-.5,0],.4,{kill:true}));
    for(let k=0;k<18;k++){atp.push(mol(E,root,'atp',[7.5+(k%6)*.6,2.6+Math.floor(k/6)*.9,(k%2)*.4],.18));yield .04;}for(let k=0;k<12;k++){nad.push(mol(E,root,'nadph',[7.6+(k%4)*.9,-1.2+Math.floor(k/4)*.8,(k%2)*.4],.15));yield .04;}
    E.pop([0,6,0],'Fase luminosa: 12 H₂O → 6 O₂ + 24 H⁺ + 24 e⁻',C_O2);yield 2.2;
    S.stage=2;for(const m of co2.concat(atp,nad))A.move(m,v3.add(C0,[(R()-.5)*1.4,(R()-.5)*1.4,(R()-.5)*1.4]),1.6+R()*.6,{kill:true});E.pop([0,4,0],'6 vueltas del ciclo de Calvin','#9fd36b');yield 2.6;
    S.stage=3;const g=mol(E,root,'glucosa',C0,.55,'Glucosa (C₆H₁₂O₆)');F.flash(root,C0,[1,.9,.6,1],4,1);S.glc++;
    for(let k=0;k<6;k++){const ww=mol(E,root,'h2o',C0,.3,k?null:'6 H₂O');A.move(ww,[2+k*.8,-3,2],1.6,{kill:true,delay:.3});}
    for(let k=0;k<18;k++){const a=mol(E,root,'adp',C0,.15);A.move(a,[9,3,-1],1.6,{kill:true,delay:.6});}E.pop([9,3,0],'ADP + Pi y NADP⁺ vuelven a los tilacoides','#e6ebf0');yield 4.5;A.move(g,[0,1,6],1.2,{kill:true});yield 1.4;}})());
  return {root,cam:{yaw:0,pitch:.2,dist:25,t:[0,1.2,0]},fog:[30,70],bg:['#16231a','#040805'],minD:8,maxD:60,update(dt){P.update(dt);A.update(dt);F.update(dt);},stage:()=>S.stage,counters:()=>[['Glucosas formadas',S.glc,'#ece4cc']]};}

const LCOL={blanca:[1,.92,.5],azul:[.35,.55,1],verde:[.35,1,.35],roja:[1,.28,.2],rojolejano:[.55,.08,.1]};
const LHEX={blanca:'#fff1b8',azul:'#8fb4ff',verde:'#9dff8f',roja:'#ff6a50',rojolejano:'#8a1c22'};
const LEFF={blanca:[1,1],azul:[.9,.9],verde:[.25,.25],roja:[.9,.9],rojolejano:[.03,.7]};
const FEFF={blanca:1,azul:.9,verde:.3,roja:.85,rojolejano:.15};
const LNM={azul:450,verde:550,roja:680,rojolejano:715};
function gs(x,m,s){return Math.exp(-((x-m)*(x-m))/(2*s*s));}
function specA(l){return {a:.95*gs(l,430,16)+.78*gs(l,662,12)+.12*gs(l,615,18),b:.82*gs(l,455,14)+.55*gs(l,643,11),c:l>530?0:.62*gs(l,452,16)+.7*gs(l,482,13)+.28*gs(l,425,12)};}
function lineD(pts){return 'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');}
function specChart(O){const X=l=>24+(l-400)/330*268;const Y=a=>150-a*125;const pa=[],pb=[],pc=[];for(let l=400;l<=730;l+=5){const s=specA(l);pa.push([X(l),Y(s.a)]);pb.push([X(l),Y(s.b)]);pc.push([X(l),Y(s.c)]);}
  const col=O.color||'blanca';const out={title:'Espectro de absorción de los pigmentos',xl:'',yl:'Absorción',paths:[{d:lineD(pa),c:'#59d36b',w:2.2},{d:lineD(pb),c:'#2f9e8f',w:2},{d:lineD(pc),c:'#f2b33d',w:2}],dots:[],labels:[{x:X(400),y:160,t:'400',c:'#7f8a96'},{x:X(500),y:160,t:'500',c:'#7f8a96'},{x:X(600),y:160,t:'600',c:'#7f8a96'},{x:X(700),y:160,t:'700 nm',c:'#7f8a96'}],legend:[['Clorofila a','#59d36b'],['Clorofila b','#2f9e8f'],['Carotenoides','#f2b33d']]};
  if(LNM[col]){const l=LNM[col];out.paths.push({d:'M'+X(l).toFixed(1)+' 150 L'+X(l).toFixed(1)+' 14',c:LHEX[col],w:2.5,dash:'4 3'});out.dots.push({x:X(l).toFixed(1),y:Y(specA(l).a).toFixed(1),c:LHEX[col],r:5});}else out.labels.push({x:160,y:20,t:'Luz blanca: todas las longitudes de onda',c:'#c9d2db'});return out;}
const ZP=[['H₂O',.82],['P680',1.15],['P680*',-.8],['Feofitina',-.55],['PQ',0],['Cit b₆f',.3],['PC',.37],['P700',.49],['P700*',-1.3],['Fe-S',-.6],['Fd',-.42],['NADP⁺',-.32]];
function zChart(stage){const X=i=>30+i*23.5;const Y=e=>18+(e+1.4)/2.75*126;const pts=ZP.map((p,i)=>[X(i),Y(p[1])]);
  const segA=lineD(pts.slice(0,2)),up1=lineD(pts.slice(1,3)),mid=lineD(pts.slice(2,8)),up2=lineD(pts.slice(7,9)),end=lineD(pts.slice(8));
  const map=[2,0,4,5,6,8,10,11];const k=map[stage]!=null?map[stage]:2;
  return {title:'Esquema en Z (potencial redox)',xl:'Recorrido de los electrones',yl:'E (V)  ↑ más reductor',paths:[{d:segA+' '+mid.replace('M','M')+' '+end,c:'#62b8ff',w:2},{d:up1,c:'#ffd75a',w:2.6,dash:'4 3'},{d:up2,c:'#ffd75a',w:2.6,dash:'4 3'}],
    dots:[{x:pts[k][0].toFixed(1),y:pts[k][1].toFixed(1),c:'#ff8a6a',r:6}],
    labels:ZP.map((p,i)=>({x:pts[i][0],y:pts[i][1]+(p[1]>0.2?11:-11),t:p[0],c:i===k?'#ffd9cf':'#9aa5b1'})).concat([{x:X(1)+16,y:Y(.2),t:'luz',c:'#ffd75a',a:'start'},{x:X(7)+16,y:Y(-.4),t:'luz',c:'#ffd75a',a:'start'}])};}
function factorsCharts(O){const ef=FEFF[O.color||'blanca'];const pts=[];for(let i=0;i<=40;i++){const L=i*2.5;const r=rateModel(L*ef,O.co2,O.temp).net;pts.push([24+L*2.68,Math.min(156,150-r*118)]);}const cur=rateModel(O.luz*ef,O.co2,O.temp).net;
  return [{title:'Velocidad neta frente a la intensidad luminosa',xl:'Intensidad luminosa',yl:'Velocidad neta',paths:[{d:lineD(pts),c:'#9fd36b',w:2.2},{d:'M24 132 L292 132',c:'rgba(255,255,255,.18)',w:1,dash:'3 4'}],dots:[{x:(24+O.luz*2.68).toFixed(1),y:Math.min(156,150-cur*118).toFixed(1),c:'#ff8a6a',r:5.5}],labels:[]},specChart(O)];}
function photonC(c,root,A,from,to,dur,end){const n=photon(root,A,from,to,dur,end);if(c)n.glow.c=[c[0],c[1],c[2],1];return n;}

/* ---- Gluconeogénesis y glucógeno ---- */
function sGluco(E,O){
  const root=new N3(),A=new Anim(),P=new Procs(),F=new FX(),R=rng(91);const S={stage:0,atp:0,gtp:0,nadh:0,glc:0,gly:0,vis:70};
  const en=(p,size,col,t,d,dy)=>{const b=blob(E,{p,size,col,seed:900+((p[0]*11)|0),n:30,pick:{t,d},label:{t,dy:dy||-60}});root.add(b);return b;};
  root.add(new N3({geo:E.capsule(4,2.3),p:[13.5,0,-.4],q:qAxis([0,0,1],Math.PI/2),col:H('#d8653a',.16),rim:.9,tex:.3,pick:{t:'Mitocondria',d:'La gluconeogénesis empieza en la matriz: el piruvato se carboxila a oxalacetato.'},pickR:1,label:{t:'Mitocondria',dy:-110}}));
  const PC=en([13,0,-1.3],[.95,.9,.95],'#c4665b','Piruvato carboxilasa','Primer rodeo: carboxila el piruvato a oxalacetato en la mitocondria gastando ATP. Necesita biotina.');
  const PK=en([7.5,0,-1.3],[.95,.9,.95],'#8f74c0','Fosfoenolpiruvato carboxiquinasa','Segundo paso del primer rodeo: descarboxila y fosforila el oxalacetato con GTP y forma fosfoenolpiruvato.');
  const RV=new N3({p:[1.5,0,-1.3],pick:{t:'Enzimas reversibles de la glucólisis',d:'Siete de las diez reacciones de la glucólisis son reversibles y se usan en sentido contrario. Aquí se gastan 2 ATP y 2 NADH.'},pickR:2.2,label:{t:'Enzimas reversibles de la glucólisis',dy:-80}});for(let k=0;k<7;k++)RV.add(blob(E,{p:[(k-3)*.6,Math.sin(k)*.5,0],size:[.42,.42,.42],col:['#c9a24b','#b47aa6','#7f8fb8','#d0954f','#4b9cc9','#5fa679','#8f74c0'][k],seed:910+k,n:8}));root.add(RV);
  const FB=en([-4,0,-1.3],[.95,.9,.95],'#5fa679','Fructosa-1,6-bisfosfatasa','Segundo rodeo: elimina un fosfato por hidrólisis (sin formar ATP). Es el principal punto de control de la gluconeogénesis.');
  const PG=en([-8,0,-1.3],[.8,.8,.8],'#6aa0a0','Fosfoglucosa isomerasa','Convierte la fructosa-6-P en glucosa-6-P.');
  const G6=en([-12.5,1.6,-1.3],[.95,.9,.95],'#4b9cc9','Glucosa-6-fosfatasa','Tercer rodeo, en el retículo del hepatocito: libera glucosa a la sangre. El músculo no la tiene, así que no puede ceder glucosa a la sangre.');
  const GS=en([-12.5,-2.6,-1.3],[.95,.9,.95],'#c9a24b','Glucógeno sintasa','Añade glucosas activadas como UDP-glucosa a las cadenas del glucógeno (enlaces α-1,4). La enzima ramificante crea los enlaces α-1,6.',60);
  root.add(new N3({geo:E.tube(smooth([[-18,-9,-1],[-17,0,0],[-18,9,-1]],8),.7,12),col:H('#c0392b',.35),rim:.8,tex:.1,pick:{t:'Capilar sanguíneo',d:'La glucosa sale del hígado a la sangre para mantener la glucemia durante el ayuno.'},pickR:1}));root.add(tag([-17,4,0],'Sangre',null,{c:'#ff8a8a'}));
  const GC=[-14,-6.5,0];const gpos=[GC];const Rg=rng(92);for(let k=1;k<300;k++){const par=gpos[Math.max(0,gpos.length-1-Math.floor(Rg()*Math.min(25,gpos.length)))];let d=v3.norm(v3.add(v3.sub(par,GC),[(Rg()-.5)*1.2,(Rg()-.5)*1.2,(Rg()-.5)*1.2]));if(k<3)d=v3.norm([Rg()-.5,Rg()-.5,Rg()-.5]);gpos.push(v3.add(par,v3.mul(d,.42)));}
  const gly=new N3({pick:{t:'Gránulo de glucógeno',d:'Polímero ramificado de glucosa (cada esfera es una glucosa). Las ramas permiten añadir o soltar muchas glucosas a la vez.'},p:[0,0,0]});const gn=gpos.map(p=>{const b=ball(E,p,.26,'#ece4cc',{geo:E.g.ball,rim:.6,tex:.1});b.visible=false;gly.add(b);return b;});root.add(gly);root.add(tag(GC,'Glucógeno',gly.pick,{dy:60}));
  const showG=n=>{gn.forEach((b,i)=>b.visible=i<n);};showG(S.vis);
  function cof(at,a,b,txt,col){const c=mol(E,root,a,v3.add(at,[-1.6,3.4,1.6]),.22);A.move(c,v3.add(at,[0,1,.6]),.8,{end:()=>{kill(c);if(!b)return;const d=mol(E,root,b,v3.add(at,[0,1,.6]),.22);if(txt)E.pop(d.p,txt,col);A.move(d,v3.add(at,[2,3.8,1.6]),1.2,{kill:true,delay:.2});}});}
  P.add((function*(){while(true){
    S.stage=0;let a=mol(E,root,'piruvato',[18,.8,1],.3,'Piruvato ×2'),b=mol(E,root,'piruvato',[18,-.8,1],.3);A.move(a,[13,.8,1],1.4);A.move(b,[13,-.8,1],1.4);yield 1.5;F.pulse(PC,.4,1.4);cof([13,.8,1],'atp','adp','−2 ATP','#f3b765');S.atp+=2;yield 1;a=swapM(E,root,a,'oxa','Oxalacetato');b=swapM(E,root,b,'oxa');yield .6;
    S.stage=1;A.move(a,[7.5,.8,1],1.4);A.move(b,[7.5,-.8,1],1.4);yield 1.5;F.pulse(PK,.4,1.4);cof([7.5,.8,1],'gtp','gdp','−2 GTP','#9fd36b');S.gtp+=2;const c=mol(E,root,'co2',[7.5,1.6,1],.3);A.move(c,[8,8,1],2,{kill:true,delay:.6});yield 1;a=swapM(E,root,a,'pep','Fosfoenolpiruvato');b=swapM(E,root,b,'pep');yield .6;
    S.stage=2;A.move(a,[1.5,.8,1],1.6);A.move(b,[1.5,-.8,1],1.6);yield 1.7;F.pulse(RV,.4,2);cof([1.5,.8,1],'atp','adp','−2 ATP','#f3b765');later(P,.4,()=>cof([1.5,-.8,1],'nadh','nad','−2 NADH','#62b8ff'));S.atp+=2;S.nadh+=2;yield 1.4;a=swapM(E,root,a,'g3p','Triosas fosfato');b=swapM(E,root,b,'dhap');yield .6;A.move(b,a.p,.6,{kill:true});yield .6;a=swapM(E,root,a,'f16bp','Fructosa-1,6-bisfosfato');yield .6;
    S.stage=3;A.move(a,[-4,0,1],1.6);yield 1.7;F.pulse(FB,.4,1.4);const pi=mol(E,root,'pi',[-4,.8,1],.26);A.move(pi,[-3,5,2],1.6,{kill:true});E.pop([-4,1,1],'−Pi (hidrólisis)','#e6ebf0');a=swapM(E,root,a,'f6p','Fructosa-6-fosfato');yield 1.2;A.move(a,[-8,0,1],1.3);yield 1.4;F.pulse(PG,.4,1);a=swapM(E,root,a,'g6p','Glucosa-6-fosfato');yield .8;
    if(O.dest==='glucogeno'){S.stage=5;A.move(a,[-12.5,-2.6,1],1.4);yield 1.5;F.pulse(GS,.4,1.6);cof([-12.5,-2.6,1],'gtp','gdp','UTP → UDP-glucosa','#c9b6ff');yield 1.1;A.move(a,gpos[Math.min(S.vis,gpos.length-1)],1.2,{kill:true});yield 1.3;S.vis=Math.min(gpos.length,S.vis+1);showG(S.vis);S.gly++;E.pop(GC,'+1 glucosa al glucógeno','#ece4cc');}
    else{S.stage=4;A.move(a,[-12.5,1.6,1],1.4);yield 1.5;F.pulse(G6,.4,1.4);const p2=mol(E,root,'pi',[-12.5,2.4,1],.26);A.move(p2,[-11,7,2],1.6,{kill:true});a=swapM(E,root,a,'glucosa','Glucosa → sangre');A.path(a,[a.p,[-16,1,.6],[-17,5,0]],2,{kill:true});S.glc++;yield 2.1;}
    yield 1;}})());
  P.add((function*(){while(true){yield 1.2;if(O.dest==='glucogeno'&&S.vis<gpos.length){S.vis++;showG(S.vis);}else if(O.dest!=='glucogeno'&&S.vis>40){S.vis--;showG(S.vis);}}})());
  return {root,cam:{yaw:.05,pitch:.18,dist:31,t:[-1,-1,0]},fog:[30,80],bg:['#1c1912','#060504'],minD:6,maxD:70,update(dt){P.update(dt);A.update(dt);F.update(dt);},stage:()=>S.stage,
    counters:()=>[['ATP gastados',S.atp,'#f3b765'],['GTP gastados',S.gtp,'#9fd36b'],['NADH gastados',S.nadh,'#62b8ff'],[O.dest==='glucogeno'?'Glucosas al glucógeno':'Glucosas a la sangre',O.dest==='glucogeno'?S.gly:S.glc,'#ece4cc']]};}

/* ---- Síntesis de ácidos grasos ---- */
function sFAS(E,O){
  const root=new N3(),A=new Anim(),P=new Procs(),F=new FX(),R=rng(95);const S={stage:0,k:0,n:2,nadph:0,atp:0,co2:0,pal:0};
  root.add(new N3({geo:E.capsule(4,2.5),p:[-14,0,-.4],q:qAxis([0,0,1],Math.PI/2),col:H('#d8653a',.18),rim:.9,tex:.3,pick:{t:'Mitocondria',d:'El acetil-CoA se forma en la matriz (a partir de piruvato), pero no atraviesa la membrana: sale en forma de citrato.'},pickR:1,label:{t:'Mitocondria',dy:-110}}));
  const en=(p,size,col,t,d,dy)=>{const b=blob(E,{p,size,col,seed:950+((p[0]*9)|0),n:30,pick:{t,d},label:{t,dy:dy||-60}});root.add(b);return b;};
  const AL=en([-7,2.4,-1.3],[.95,.9,.95],'#5fa679','ATP-citrato liasa','En el citosol rompe el citrato en acetil-CoA y oxalacetato, gastando ATP.');
  const AC=en([-2.2,2.4,-1.3],[1,.95,1],'#c4665b','Acetil-CoA carboxilasa','Paso limitante: añade CO₂ (como HCO₃⁻) al acetil-CoA y forma malonil-CoA (3 C). Usa biotina y ATP. La activa la insulina y la inhibe el palmitoil-CoA.');
  const FC=[6,0,-1.4];const fas=new N3({p:FC,pick:{t:'Ácido graso sintasa',d:'Complejo multienzimático gigante (dímero en forma de X) con siete actividades y una proteína transportadora de acilos (ACP) que lleva la cadena de un centro activo a otro.'},pickR:3.4,label:{t:'Ácido graso sintasa (complejo multienzimático)',dy:-120}});
  fas.add(blob(E,{q:qAxis([0,0,1],.55),size:[3.4,.95,1.05],col:'#4b9cc9',seed:960,n:80}));fas.add(blob(E,{q:qAxis([0,0,1],-.55),size:[3.4,.95,1.05],col:'#3a7fb0',seed:961,n:80}));root.add(fas);
  const acp=new N3({p:FC});const arm=acp.add(new N3({p:[1.2,0,1.3],glow:{s:.6,c:[1,.85,.4,1]}}));root.add(acp);
  root.add(tag(v3.add(FC,[1.2,0,1.3]),'ACP (brazo móvil)',null,{dy:60,c:'#ffd75a'}));root.add(tag([-14,4.8,0],'Citosol: aquí se fabrican los ácidos grasos',null,{c:'#e6ebf0',dy:-30}));

    upd=dt=>{S.t=(S.t+dt)%20;const tt=S.t<2?0:(S.t-2)*4;S.a=tt;spots.forEach((p,i)=>{const on=tt>=SP[i][0];p[0].visible=on;p[1].visible=on;});syr.visible=S.t<3;S.stage=S.t<2?0:tt<6?1:tt<60?2:3;};

MDEF.no2=()=>{const m=MB();const n=m.a('N',[0,0,0]);m.a('O',[1,.6,0],n);m.a('O',[-1,.6,0],n);return m;};
MDEF.no3=()=>{const m=MB();const n=m.a('N',[0,0,0]);for(let k=0;k<3;k++)m.a('O',[1.2*Math.cos(k*TAU/3),1.2*Math.sin(k*TAU/3),0],n);return m;};
MDEF.nh2oh=()=>{const m=MB();const n=m.a('N',[0,0,0]);m.a('H',[-.6,.7,0],n);m.a('H',[-.6,-.7,0],n);const o=m.a('O',[1.3,0,0],n);m.a('H',[1.8,.7,0],o);return m;};
function sChemo(E,O){
  const T=O.org;const root=new N3(),A=new Anim(),P=new Procs(),F=new FX(),R=rng(101);const S={stage:0,sub:0,atp:0,nadh:0,co2:0};

  root.add(tag([-14.5,4.6,-2],'Periplasma (exterior)',null,{c:'#ff8ac0'}));root.add(tag([-14.5,-4.6,-2],'Citoplasma de la bacteria',null,{c:'#62b8ff'}));
  const en=(p,size,col,t,d,dy)=>{const b=blob(E,{p,size,col,seed:1000+((p[0]*9)|0)+((p[1]*5)|0),n:30,pick:{t,d},label:{t,dy:dy||-60}});root.add(b);return b;};
  let S1,S2;if(T==='nitrosomonas'){S1=en([-11,0,0],[1.2,1.3,1.2],'#5fa679','Amoníaco monooxigenasa (AMO)','Oxida el amoníaco a hidroxilamina usando O₂.',-110);S2=en([-7,2.6,0],[1,.8,1],'#c9a24b','Hidroxilamina oxidorreductasa (HAO)','Oxida la hidroxilamina a nitrito y libera 4 electrones.');}

  const ASx=en([10,-1.4,0],[1,1.6,1],'#e2a03e','ATP sintasa','Los H⁺ vuelven al citoplasma y se forma ATP.',60);
  const CV=new N3({p:[3,-6.5,0],pick:{t:'Ciclo de Calvin',d:'Igual que las plantas, estas bacterias fijan el CO₂ con la RuBisCO usando el ATP y el NADH obtenidos de la oxidación química.'},pickR:1.8,label:{t:'Ciclo de Calvin · fija CO₂',dy:60}});CV.add(new N3({geo:E.torus(1.5,.07),q:qAxis([1,0,0],Math.PI/2),col:H('#9fd36b',.6),emit:.6,rim:0,tex:0}));root.add(CV);
  const cc=new N3({p:[-3,2.6,1.2]});cc.add(blob(E,{size:[.5,.5,.5],col:'#d2524a',seed:1010,n:12}));cc.e=cc.add(new N3({glow:{s:0,c:[.45,1,1,1]}}));cc.label={t:'Citocromo c',dy:-40};root.add(cc);

    S.stage=0;if(T==='nitrosomonas'){const n=mol(E,root,'nh3',[-14,4,1],.4,'NH₃');A.move(n,[-11,1.6,1],1.4);yield 1.5;F.pulse(S1,.4,1.2);const h=swapM(E,root,n,'nh2oh','NH₂OH',.4);A.move(h,[-7,3.6,1],1.2);yield 1.3;F.pulse(S2,.4,1.2);const no=swapM(E,root,h,'no2','NO₂⁻ (nitrito)',.4);A.move(no,[-12,7,1],2,{kill:true});E.pop([-7,4,1],'NH₃ → NO₂⁻ + e⁻','#9fd36b');}
    else{const n=mol(E,root,'no2',[-14,5,1],.4,'NO₂⁻');A.move(n,[-9,3.4,1],1.4);yield 1.5;F.pulse(S1,.4,1.2);const no=swapM(E,root,n,'no3','NO₃⁻ (nitrato)',.4);A.move(no,[-13,7,1],2,{kill:true});E.pop([-9,4,1],'NO₂⁻ → NO₃⁻ + 2 e⁻','#9fd36b');}
    S.sub++;yield .6;

    S.stage=2;A.move(cc,[3.4,2.5,1.2],1.4);yield 1.5;cc.e.glow.s=0;A.move(cc,[-3,2.6,1.2],1.4);F.pulse(C4,.4,1.2);pump(3.6);pump(4.4);const w=mol(E,root,'h2o',[4,-2.6,1],.3);A.move(w,[6,-6,2],1.6,{kill:true});E.pop([4,-2,1],'½O₂ → H₂O · bombea H⁺',C_H);yield 1.2;
    S.stage=3;for(let k=0;k<2;k++){const h=proton(E,[10.6,3.4,.8]);root.add(h);A.path(h,[h.p,[10.6,0,1],[10.6,-3,1]],1,{kill:true,delay:k*.3});}yield 1.2;F.pulse(ASx,.4,1);const at=mol(E,root,'atp',[10,-3.4,1],.24,'ATP');A.move(at,[4,-6.2,1],1.6,{kill:true});S.atp++;yield 1.2;
    S.stage=4;const h2=proton(E,[-1.6,3.4,.8]);root.add(h2);A.path(h2,[h2.p,[-1.6,0,1],[-1.6,-3,1]],1,{kill:true});const e2=electron([-3,2.4,1]);root.add(e2);A.path(e2,[e2.p,[-1,0,1],[-1,-2.4,1]],1.4,{kill:true});yield 1.4;F.pulse(C1,.4,1.2);const nh=mol(E,root,'nadh',[-1,-3,1],.24,'NADH');A.move(nh,[2,-6.2,1],1.6,{kill:true});E.pop([-1,-2.6,1],'Flujo inverso: gasta gradiente → NADH','#62b8ff');S.nadh++;yield 1.4;
    S.stage=5;const c=mol(E,root,'co2',[-4,-9,1],.3,'CO₂');A.move(c,[2,-6.4,1],1.4,{kill:true});yield 1.5;F.pulse(CV,.6,1.4);S.co2++;E.pop([3,-6,1],'CO₂ → materia orgánica','#9fd36b');yield 1.5;}})());
  return {root,cam:{yaw:.05,pitch:.12,dist:30,t:[-1,-1.4,0]},fog:[30,75],bg:['#171a22','#040508'],minD:6,maxD:70,update(dt){P.update(dt);A.update(dt);F.update(dt);},stage:()=>S.stage,

    const loop=t=>{if(!this._alive)return;this._raf=requestAnimationFrame(loop);this.frame(t);};this._raf=requestAnimationFrame(loop);}
  sceneOpts(i){const d=MTB_ANA.SCENES[i];if(!this.opts[d.id]){const o={};for(const c of d.controls||[])o[c.id]=c.def;this.opts[d.id]=o;}return this.opts[d.id];}

    const ctrls=d.controls||[];const stg=typeof d.stages==='function'?d.stages(O):d.stages;const rows=typeof d.rows==='function'?d.rows(O):(d.rows||[]);
