  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0}\n.sec-genealogia .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}\n.sec-genealogia .lg{display:flex;align-items:center;gap:12px;font-size:15px}\n.sec-genealogia .sym{width:30px;height:30px;border:2.5px solid #17231C;background:#fff;flex:none}\n.sec-genealogia .fb{border-radius:12px;padding:14px 16px}\n.sec-genealogia .fb.ok{background:#E2F1DF;color:#174D20}\n.sec-genealogia .fb.bad{background:#F8E3DC;color:#7A2914}\n.sec-genealogia .fb.info{background:#E7EDE3;color:#17231C}\n.sec-familia .wrap{max-width:1240px;margin:0 auto;padding:0 24px}\n.sec-familia .serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}\n.sec-familia .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}\n.sec-familia .kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#4A5A50;margin:0}\n.sec-familia .h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(44px,6.5vw,80px);line-height:.98;margin:0}\n.sec-familia .h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,42px);line-height:1.05;margin:0}\n.sec-familia .h3{font-size:18px;font-weight:700;margin:0;line-height:1.25}\n.sec-familia .muted{color:#4A5A50}\n.sec-familia .card{background:#FFFFFF;border:1px solid #D5DDD3;border-radius:16px;padding:22px}\n.sec-familia .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:2px solid #17231C;background:#17231C;color:#FFFFFF;font:700 16px/1 'Atkinson Hyperlegible',system-ui,sans-serif;cursor:pointer;text-decoration:none}\n.sec-familia .btn:hover{background:#2A3B30;color:#fff}\n.sec-familia .btn.ghost{background:transparent;color:#17231C}\n.sec-familia .btn.ghost:hover{background:#E4EBE1}\n.sec-familia .btn.go{background:#2F7D3A;border-color:#2F7D3A}\n.sec-familia .btn.go:hover{background:#25652E}\n.sec-familia .btn[disabled]{opacity:.35;cursor:default}\n.sec-familia .chips{display:flex;flex-wrap:wrap;gap:6px}\n.sec-familia .chip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:4px 10px;border-radius:12px;border:1.5px solid #B9C5B8;background:#FFFFFF;color:#17231C;font:700 14px/1.1 'JetBrains Mono',ui-monospace,monospace;cursor:pointer}\n.sec-familia .chip small{font:400 11px/1.1 'Atkinson Hyperlegible',sans-serif}\n.sec-familia .chip:hover{border-color:#17231C}\n.sec-familia .chip.on{background:#17231C;border-color:#17231C;color:#FFFFFF}\n.sec-familia .trow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid #EEF1EC}\n.sec-familia .tl{font-size:14px;font-weight:700;line-height:1.2}\n.sec-familia .avatar{position:relative;width:120px;height:132px;flex:none}\n.sec-familia .hair-back{position:absolute;left:14px;top:14px;width:92px;height:96px;border-radius:46px 46px 30px 30px;background:#3B2A20}\n.sec-familia .curl{position:absolute;width:30px;height:30px;border-radius:50%;background:#3B2A20}\n.sec-familia .head{position:absolute;left:20px;top:24px;width:80px;height:90px;border-radius:40px 40px 38px 38px;background:#EBC09A}\n.sec-familia .neck{position:absolute;left:48px;top:104px;width:24px;height:16px;background:#DDAE86}\n.sec-familia .body{position:absolute;left:22px;top:114px;width:76px;height:18px;border-radius:24px 24px 0 0}\n.sec-familia .cap{position:absolute;left:18px;top:18px;width:84px;height:34px;border-radius:42px 42px 8px 8px;background:#3B2A20}\n.sec-familia .wave{position:absolute;width:22px;height:36px;border-radius:50%;background:#3B2A20}\n.sec-familia .eye{position:absolute;top:58px;width:18px;height:13px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;border:1px solid #C9A07E}\n.sec-familia .iris{width:9px;height:9px;border-radius:50%}\n.sec-familia .mouth{position:absolute;left:46px;top:86px;width:28px;height:12px;border-bottom:3px solid #8E4B3A;border-radius:0 0 16px 16px}\n.sec-familia .dimple{position:absolute;top:88px;width:6px;height:8px;border-left:2px solid #B9805F;border-radius:50%}\n.sec-familia .freckle{position:absolute;width:3px;height:3px;border-radius:50%;background:#A86A3F}\n.sec-familia .badge{position:absolute;right:2px;top:2px;width:28px;height:28px;border-radius:50%;background:#17231C;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px}\n.sec-familia .cb{position:absolute;left:0;top:2px;padding:2px 6px;border-radius:6px;background:#C9B66B;color:#17231C;font-size:11px;font-weight:700}\n.sec-familia .kid{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 12px;border-radius:16px;background:#FFFFFF;border:1px solid #D5DDD3;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}\n@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}\n.sec-familia .kt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;font-size:13px;line-height:1.3}\n.sec-familia .kt .mono{font-size:12px;color:#4A5A50;text-align:right}\n.sec-familia .prob{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid #EEF1EC}\n.sec-familia .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#EEF1EC;font-size:14px}\n.sec-familia .pill strong{font-family:'JetBrains Mono',monospace}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"root\" data-canvas-width=\"1280\" data-canvas-height=\"1500\">\n<header class=\"topbar\">\n<div class=\"shellwrap\">\n<button type=\"button\" class=\"brand\" sc-camel-on-click=\"{{go.inicio}}\"><span class=\"brand-pea\"><\u002Fspan>El huerto de Mendel<\u002Fbutton>\n<nav class=\"mainnav\" aria-label=\"Secciones\">\n<sc-for list=\"{{tabs}}\" as=\"tb\" hint-placeholder-count=\"9\"><button type=\"button\" class=\"{{tb.cls}}\" sc-camel-on-click=\"{{tb.pick}}\" aria-current=\"{{tb.cur}}\">{{tb.txt}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n<sc-if value=\"{{tabOn.inicio}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"sec-main\">\n<section class=\"wrap\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 32px; align-items: center; padding-top: 56px; padding-bottom: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 22px\">\n<p class=\"kicker\">Simulador de genética mendeliana<\u002Fp>\n<h1 class=\"h1\">El huerto <em>de Mendel<\u002Fem><\u002Fh1>\n<p class=\"lead\">De los guisantes de un monasterio de Brno a tu grupo sanguíneo. Conoce la historia, entiende la teoría y haz tus propios cruces para descubrir cómo se heredan los caracteres.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{go.huerto}}\">Entrar al huerto 3D<\u002Fbutton>\n<button type=\"button\" class=\"btn ghost\" sc-camel-on-click=\"{{go.historia}}\">Empezar por la historia<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\">\n<div class=\"podscene\" aria-hidden=\"true\">\n<div class=\"pod3d\">\n<div class=\"shell\"><\u002Fdiv>\n<div class=\"inner\"><\u002Fdiv>\n<div class=\"peas3\">\n<div class=\"bigpea pea-y\"><\u002Fdiv>\n<div class=\"bigpea pea-y\" style=\"animation-delay: .4s\"><\u002Fdiv>\n<div class=\"bigpea pea-g\" style=\"animation-delay: .8s\"><\u002Fdiv>\n<div class=\"bigpea pea-y\" style=\"animation-delay: 1.2s\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"lid\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"muted\" style=\"margin: -24px 0 0; font-size: 15px\">Tres amarillos, uno verde: la proporción <span class=\"mono\">3 : 1<\u002Fspan> que lo cambió todo.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"wrap\" style=\"padding-bottom: 32px\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 16px\">\n<button type=\"button\" class=\"cardlink\" sc-camel-on-click=\"{{go.teoria}}\"><span class=\"num\">02<\u002Fspan><span class=\"h3\">Teoría<\u002Fspan><span class=\"muted\">Genes, alelos, genotipo y fenotipo. Las tres leyes de Mendel paso a paso.<\u002Fspan><\u002Fbutton>\n<button type=\"button\" class=\"cardlink\" sc-camel-on-click=\"{{go.huerto}}\"><span class=\"num\">03<\u002Fspan><span class=\"h3\">Huerto 3D<\u002Fspan><span class=\"muted\">Elige plantas, poliniza y mira crecer la descendencia. Tablas de Punnett y proporciones.<\u002Fspan><\u002Fbutton>\n<button type=\"button\" class=\"cardlink\" sc-camel-on-click=\"{{go.retos}}\"><span class=\"num\">04<\u002Fspan><span class=\"h3\">Retos<\u002Fspan><span class=\"muted\">Planta misteriosa, deduce los padres, rellena tablas de Punnett y preguntas rápidas.<\u002Fspan><\u002Fbutton>\n<button type=\"button\" class=\"cardlink\" sc-camel-on-click=\"{{go.herencia}}\"><span class=\"num\">05<\u002Fspan><span class=\"h3\">Tipos de herencia<\u002Fspan><span class=\"muted\">Dominancia, herencia intermedia, codominancia, alelos múltiples y ligada al sexo.<\u002Fspan><\u002Fbutton>\n<button type=\"button\" class=\"cardlink\" sc-camel-on-click=\"{{go.sangre}}\"><span class=\"num\">06<\u002Fspan><span class=\"h3\">Grupos sanguíneos<\u002Fspan><span class=\"muted\">Sistema AB0 y factor Rh. Calculadora, compatibilidad y caso detective.<\u002Fspan><\u002Fbutton>\n<button type=\"button\" class=\"cardlink\" sc-camel-on-click=\"{{go.genealogia}}\"><span class=\"num\">07<\u002Fspan><span class=\"h3\">Árboles genealógicos<\u002Fspan><span class=\"muted\">Interpreta pedigríes y asigna el genotipo de cada persona.<\u002Fspan><\u002Fbutton>\n<button type=\"button\" class=\"cardlink\" sc-camel-on-click=\"{{go.familia}}\"><span class=\"num\">08<\u002Fspan><span class=\"h3\">Creador de familias<\u002Fspan><span class=\"muted\">Diseña a una madre y un padre y mira cómo podrían ser sus hijos.<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{tabOn.historia}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"sec-main\">\n<div class=\"subwrap\"><nav class=\"subnav\" aria-label=\"Apartados\"><sc-for list=\"{{subtabs}}\" as=\"sbt\" hint-placeholder-count=\"4\"><button type=\"button\" class=\"{{sbt.cls}}\" sc-camel-on-click=\"{{sbt.pick}}\" aria-pressed=\"{{sbt.on}}\">{{sbt.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fnav><\u002Fdiv>\n<sc-if value=\"{{sb.historia_0}}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"historia\" class=\"section\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 36px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<p class=\"kicker\">01 · Historia<\u002Fp>\n<h2 class=\"h2\">Un fraile, un huerto y 28.000 plantas<\u002Fh2>\n<p class=\"lead\">Gregor Mendel no conocía el ADN, ni los cromosomas, ni la palabra «gen». Aun así, contando guisantes con paciencia y matemáticas, descubrió las reglas básicas de la herencia.<\u002Fp>\n<\u002Fdiv>\n<div class=\"tl\">\n<div class=\"tl-year\">1822<\u002Fdiv>\n<div class=\"tl-body\"><h3 class=\"h3\">Nace Johann Mendel<\u002Fh3><p>Nace en Heinzendorf (Silesia, entonces Imperio austriaco; hoy Hynčice, República Checa), en una familia de campesinos. De niño ayuda en el huerto y con los árboles frutales.<\u002Fp><\u002Fdiv>\n<div class=\"tl-year\">1843<\u002Fdiv>\n<div class=\"tl-body\"><h3 class=\"h3\">Entra en el monasterio de Santo Tomás<\u002Fh3><p>Ingresa en la abadía agustina de Brno y adopta el nombre de Gregor. El monasterio era un centro de estudio con biblioteca, profesores y un huerto experimental.<\u002Fp><\u002Fdiv>\n<div class=\"tl-year\">1851<\u002Fdiv>\n<div class=\"tl-body\"><h3 class=\"h3\">Estudia en la Universidad de Viena<\u002Fh3><p>Durante dos años estudia física, matemáticas y botánica. Entre sus profesores está Christian Doppler. Allí aprende algo clave: diseñar experimentos y analizar los datos con números.<\u002Fp><\u002Fdiv>\n<div class=\"tl-year\">1856<\u002Fdiv>\n<div class=\"tl-body\"><h3 class=\"h3\">Empiezan los experimentos con guisantes<\u002Fh3><p>Hasta 1863 cultiva y analiza unas 28.000 plantas de guisante (<em>Pisum sativum<\u002Fem>). Estudia siete caracteres, cada uno con dos formas bien distintas, y cuenta los descendientes de cada cruce generación tras generación.<\u002Fp><\u002Fdiv>\n<div class=\"tl-year\">1865<\u002Fdiv>\n<div class=\"tl-body\"><h3 class=\"h3\">Presenta sus resultados<\u002Fh3><p>En febrero y marzo expone su trabajo ante la Sociedad de Historia Natural de Brno. Al año siguiente publica <em>Experimentos sobre hibridación de plantas<\u002Fem>. Casi nadie entiende su importancia.<\u002Fp><\u002Fdiv>\n<div class=\"tl-year\">1868<\u002Fdiv>\n<div class=\"tl-body\"><h3 class=\"h3\">Abad del monasterio<\u002Fh3><p>Es elegido abad. Las tareas de gobierno le dejan poco tiempo para investigar. Muere en Brno en 1884 sin que su descubrimiento haya sido reconocido.<\u002Fp><\u002Fdiv>\n<div class=\"tl-year\">1900<\u002Fdiv>\n<div class=\"tl-body\"><h3 class=\"h3\">El redescubrimiento<\u002Fh3><p>Tres botánicos, Hugo de Vries, Carl Correns y Erich von Tschermak, llegan por separado a los mismos resultados y encuentran el artículo de Mendel. Sus leyes se convierten en la base de una ciencia nueva.<\u002Fp><\u002Fdiv>\n<div class=\"tl-year\">1906<\u002Fdiv>\n<div class=\"tl-body\"><h3 class=\"h3\">Nace la genética<\u002Fh3><p>William Bateson propone el nombre «genética» y en 1909 Wilhelm Johannsen acuña la palabra «gen» para los «factores» de los que hablaba Mendel.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{sb.historia_1}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"section\" style=\"background: #E7EDE3\">\n<div class=\"wrap\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr)); gap: 32px; align-items: start\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<p class=\"kicker\">¿Por qué guisantes?<\u002Fp>\n<h2 class=\"h2\">La planta perfecta para experimentar<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div class=\"card\" style=\"padding: 18px 20px\"><span class=\"h3\">Caracteres sin término medio.<\u002Fspan> <span class=\"muted\">Semilla lisa o rugosa, amarilla o verde, planta alta o enana. Es fácil clasificar cada planta.<\u002Fspan><\u002Fdiv>\n<div class=\"card\" style=\"padding: 18px 20px\"><span class=\"h3\">Se autofecundan solas.<\u002Fspan> <span class=\"muted\">La flor está cerrada, así que el polen fecunda su propia flor y se obtienen líneas puras.<\u002Fspan><\u002Fdiv>\n<div class=\"card\" style=\"padding: 18px 20px\"><span class=\"h3\">Se pueden cruzar a mano.<\u002Fspan> <span class=\"muted\">Quitando los estambres, Mendel decidía qué planta era el padre y cuál la madre.<\u002Fspan><\u002Fdiv>\n<div class=\"card\" style=\"padding: 18px 20px\"><span class=\"h3\">Muchas semillas y ciclo corto.<\u002Fspan> <span class=\"muted\">En una temporada obtenía cientos de descendientes que podía contar.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 16px\">\n<p class=\"kicker\">Así cruzaba Mendel sus plantas<\u002Fp>\n<div class=\"flowerbox\" aria-hidden=\"true\">\n<div class=\"petal\" style=\"transform: rotate(0deg)\"><\u002Fdiv>\n<div class=\"petal\" style=\"transform: rotate(72deg)\"><\u002Fdiv>\n<div class=\"petal\" style=\"transform: rotate(144deg)\"><\u002Fdiv>\n<div class=\"petal\" style=\"transform: rotate(216deg)\"><\u002Fdiv>\n<div class=\"petal\" style=\"transform: rotate(288deg)\"><\u002Fdiv>\n<div class=\"keel\"><\u002Fdiv>\n<div class=\"pistil\"><\u002Fdiv>\n<sc-if value=\"{{v_main.showStamens}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"stamen\" style=\"left: 100px; transform: rotate(-28deg)\"><div class=\"anther\"><\u002Fdiv><\u002Fdiv>\n<div class=\"stamen\" style=\"left: 106px; transform: rotate(-12deg)\"><div class=\"anther\"><\u002Fdiv><\u002Fdiv>\n<div class=\"stamen\" style=\"left: 132px; transform: rotate(12deg)\"><div class=\"anther\"><\u002Fdiv><\u002Fdiv>\n<div class=\"stamen\" style=\"left: 138px; transform: rotate(28deg)\"><div class=\"anther\"><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{v_main.showPollen}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"pollen\"><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{v_main.showBrush}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"brush\"><div class=\"brush-handle\"><\u002Fdiv><div class=\"brush-tip\"><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{v_main.showBag}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"bag\"><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px; min-height: 120px\">\n<h3 class=\"h3\">{{v_main.step.title}}<\u002Fh3>\n<p class=\"muted\" style=\"margin: 0\">{{v_main.step.text}}<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<button class=\"btn ghost\" sc-camel-on-click=\"{{v_main.prev}}\" disabled=\"{{v_main.noPrev}}\">Anterior<\u002Fbutton>\n<span class=\"mono\" style=\"font-size: 14px\">{{v_main.stepLabel}}<\u002Fspan>\n<button class=\"btn\" sc-camel-on-click=\"{{v_main.next}}\" disabled=\"{{v_main.noNext}}\">Siguiente<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{sb.historia_2}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"section\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 28px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<p class=\"kicker\">Los siete caracteres<\u002Fp>\n<h2 class=\"h2\">Los números reales de Mendel<\u002Fh2>\n<p class=\"lead\">Cruzó líneas puras, dejó que la primera generación se autofecundara y contó la segunda generación (F2). Elige un carácter para ver lo que obtuvo.<\u002Fp>\n<\u002Fdiv>\n<div class=\"chips\">\n<sc-for list=\"{{v_main.traitChips}}\" as=\"tc\" hint-placeholder-count=\"7\"><button class=\"{{tc.cls}}\" sc-camel-on-click=\"{{tc.pick}}\" aria-pressed=\"{{tc.on}}\">{{tc.name}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"card\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 28px; align-items: center\">\n<div style=\"display: flex; justify-content: center; gap: 40px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px\">\n<div style=\"width: 144px; height: 264px; display: flex; justify-content: center; align-items: flex-end\">\n<div class=\"plant\" style=\"transform: scale(1.5); transform-origin: 50% 100%\">\n<div class=\"soil\"><\u002Fdiv>\n<div class=\"stem\" style=\"height: {{v_main.domV.stemH}}px; top: {{v_main.domV.stemTop}}px\"><\u002Fdiv>\n<sc-for list=\"{{v_main.domV.leaves}}\" as=\"lf\" hint-placeholder-count=\"2\"><div class=\"leaf\" style=\"left: {{lf.x}}px; top: {{lf.y}}px; transform: rotate({{lf.r}}deg)\"><\u002Fdiv><\u002Fsc-for>\n<sc-for list=\"{{v_main.domV.pods}}\" as=\"pd\" hint-placeholder-count=\"2\"><div class=\"pod\" style=\"left: {{pd.x}}px; top: {{pd.y}}px; transform: rotate({{pd.r}}deg)\"><sc-if value=\"{{pd.inf}}\" hint-placeholder-val=\"{{ true }}\"><div class=\"pod-inf\" style=\"background: {{pd.c}}\"><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{pd.con}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"pod-con\"><div class=\"bead\" style=\"background: {{pd.c}}\"><\u002Fdiv><div class=\"bead\" style=\"background: {{pd.c}}\"><\u002Fdiv><div class=\"bead\" style=\"background: {{pd.c}}\"><\u002Fdiv><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fsc-for>\n<sc-for list=\"{{v_main.domV.flowers}}\" as=\"fl\" hint-placeholder-count=\"2\"><div class=\"flower\" style=\"left: {{fl.x}}px; top: {{fl.y}}px; background: {{fl.c}}; border-color: {{fl.b}}\"><\u002Fdiv><\u002Fsc-for>\n<div class=\"{{v_main.domV.seedCls}}\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"tag\">Dominante<\u002Fspan>\n<strong>{{v_main.cur.dom}} <span class=\"mono\">({{v_main.cur.L}})<\u002Fspan><\u002Fstrong>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px\">\n<div style=\"width: 144px; height: 264px; display: flex; justify-content: center; align-items: flex-end\">\n<div class=\"plant\" style=\"transform: scale(1.5); transform-origin: 50% 100%\">\n<div class=\"soil\"><\u002Fdiv>\n<div class=\"stem\" style=\"height: {{v_main.recV.stemH}}px; top: {{v_main.recV.stemTop}}px\"><\u002Fdiv>\n<sc-for list=\"{{v_main.recV.leaves}}\" as=\"lf\" hint-placeholder-count=\"2\"><div class=\"leaf\" style=\"left: {{lf.x}}px; top: {{lf.y}}px; transform: rotate({{lf.r}}deg)\"><\u002Fdiv><\u002Fsc-for>\n<sc-for list=\"{{v_main.recV.pods}}\" as=\"pd\" hint-placeholder-count=\"2\"><div class=\"pod\" style=\"left: {{pd.x}}px; top: {{pd.y}}px; transform: rotate({{pd.r}}deg)\"><sc-if value=\"{{pd.inf}}\" hint-placeholder-val=\"{{ true }}\"><div class=\"pod-inf\" style=\"background: {{pd.c}}\"><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{pd.con}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"pod-con\"><div class=\"bead\" style=\"background: {{pd.c}}\"><\u002Fdiv><div class=\"bead\" style=\"background: {{pd.c}}\"><\u002Fdiv><div class=\"bead\" style=\"background: {{pd.c}}\"><\u002Fdiv><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fsc-for>\n<sc-for list=\"{{v_main.recV.flowers}}\" as=\"fl\" hint-placeholder-count=\"2\"><div class=\"flower\" style=\"left: {{fl.x}}px; top: {{fl.y}}px; background: {{fl.c}}; border-color: {{fl.b}}\"><\u002Fdiv><\u002Fsc-for>\n<div class=\"{{v_main.recV.seedCls}}\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<span class=\"tag\" style=\"background: #EEE7F6\">Recesivo<\u002Fspan>\n<strong>{{v_main.cur.rec}} <span class=\"mono\">({{v_main.cur.l}})<\u002Fspan><\u002Fstrong>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<p class=\"muted\" style=\"margin: 0\">{{v_main.cur.look}}<\u002Fp>\n<div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap\">\n<span class=\"serif\" style=\"font-size: 72px; line-height: 1\">{{v_main.ratio}} : 1<\u002Fspan>\n<span class=\"muted\">proporción en la F2<\u002Fspan>\n<\u002Fdiv>\n<div class=\"stack\" role=\"img\" aria-label=\"{{v_main.barLabel}}\">\n<div style=\"width: {{v_main.domPct}}%; background: #2F7D3A\"><\u002Fdiv>\n<div style=\"width: {{v_main.recPct}}%; background: #D9D1E8\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n<span><strong class=\"mono\">{{v_main.cur.d}}<\u002Fstrong> {{v_main.cur.domL}}<\u002Fspan>\n<span><strong class=\"mono\">{{v_main.cur.r}}<\u002Fstrong> {{v_main.cur.recL}}<\u002Fspan>\n<\u002Fdiv>\n<p class=\"muted\" style=\"margin: 0; font-size: 15px\">En la primera generación (F1) todas las plantas mostraban el carácter dominante. El recesivo «reaparecía» en la F2 en una de cada cuatro plantas.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\" style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; background: #17231C; color: #FFFFFF; border-color: #17231C\">\n<span>Sumando los siete caracteres: <strong class=\"mono\">14.949<\u002Fstrong> dominantes y <strong class=\"mono\">5.010<\u002Fstrong> recesivos.<\u002Fspan>\n<span class=\"serif\" style=\"font-size: 40px; line-height: 1\">2,98 : 1<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{sb.historia_3}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"section\" style=\"background: #E7EDE3\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 24px\">\n<p class=\"kicker\">Su gran idea<\u002Fp>\n<h2 class=\"h2\">Lo que dedujo sin ver un solo gen<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px\">\n<div class=\"card\"><span class=\"num\">1<\u002Fspan><h3 class=\"h3\" style=\"margin-top: 8px\">Los caracteres van por parejas<\u002Fh3><p class=\"muted\" style=\"margin: 8px 0 0\">Cada planta tiene dos «factores» para cada carácter: uno heredado de la madre y otro del padre. Hoy los llamamos alelos.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><span class=\"num\">2<\u002Fspan><h3 class=\"h3\" style=\"margin-top: 8px\">Se separan al formar gametos<\u002Fh3><p class=\"muted\" style=\"margin: 8px 0 0\">Cada gameto (polen u óvulo) lleva solo uno de los dos factores. Por eso un carácter oculto puede reaparecer en los nietos.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><span class=\"num\">3<\u002Fspan><h3 class=\"h3\" style=\"margin-top: 8px\">Se combinan al azar<\u002Fh3><p class=\"muted\" style=\"margin: 8px 0 0\">La fecundación junta gametos al azar, y eso permite predecir las proporciones con probabilidad.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{go.teoria}}\">Ver la teoría y las tres leyes<\u002Fbutton>\n<button type=\"button\" class=\"btn ghost\" sc-camel-on-click=\"{{go.huerto}}\">Repetir sus experimentos<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{tabOn.teoria}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"sec-teoria\">\n<section class=\"wrap\" style=\"padding-top: 56px; padding-bottom: 24px; display: flex; flex-direction: column; gap: 18px\">\n<p class=\"kicker\">02 · Teoría<\u002Fp>\n<h1 class=\"h1\">El idioma <em>de la herencia<\u002Fem><\u002Fh1>\n<p class=\"lead\">Antes de cruzar plantas necesitamos unas pocas palabras clave. Pulsa cada concepto para verlo señalado en una pareja de cromosomas.<\u002Fp>\n<\u002Fsection>\n<div class=\"subwrap\"><nav class=\"subnav\" aria-label=\"Apartados\"><sc-for list=\"{{subtabs}}\" as=\"sbt\" hint-placeholder-count=\"5\"><button type=\"button\" class=\"{{sbt.cls}}\" sc-camel-on-click=\"{{sbt.pick}}\" aria-pressed=\"{{sbt.on}}\">{{sbt.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fnav><\u002Fdiv>\n<sc-if value=\"{{sb.teoria_0}}\" hint-placeholder-val=\"{{ true }}\">\n<section class=\"section\" style=\"padding-top: 24px\">\n<div class=\"wrap\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 28px; align-items: start\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div class=\"chips\">\n<sc-for list=\"{{v_teoria.concepts}}\" as=\"c\" hint-placeholder-count=\"11\"><button class=\"{{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\" aria-pressed=\"{{c.on}}\">{{c.name}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 10px; min-height: 220px\">\n<span class=\"tag\" style=\"align-self: flex-start\">Concepto<\u002Fspan>\n<h2 class=\"serif\" style=\"font-size: 44px; line-height: 1; margin: 0\">{{v_teoria.cc.name}}<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px\">{{v_teoria.cc.def}}<\u002Fp>\n<p class=\"muted\" style=\"margin: 0\"><strong>Ejemplo:<\u002Fstrong> {{v_teoria.cc.ex}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 14px; align-items: center\">\n<div class=\"chromo-wrap\" aria-hidden=\"true\">\n<div class=\"chromo {{v_teoria.hl.homo}}\" style=\"left: 60px\">\n<div class=\"band {{v_teoria.hl.A}}\" style=\"top: 62px\">A<\u002Fdiv>\n<div class=\"band {{v_teoria.hl.L1}}\" style=\"top: 220px\">L<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"chromo pat {{v_teoria.hl.homo}}\" style=\"left: 186px\">\n<div class=\"band {{v_teoria.hl.a}}\" style=\"top: 62px; background: #4A5A50\">a<\u002Fdiv>\n<div class=\"band {{v_teoria.hl.L2}}\" style=\"top: 220px\">L<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{v_teoria.showLocus}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"locus\" style=\"top: 87px\"><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; width: 100%; max-width: 320px; font-size: 14px\" class=\"muted\"><span>De la madre<\u002Fspan><span>Del padre<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%\">\n<div class=\"card {{v_teoria.hl.geno}}\" style=\"padding: 12px 18px; display: flex; flex-direction: column; gap: 4px; align-items: center\"><span class=\"kicker\">Genotipo<\u002Fspan><span class=\"mono\" style=\"font-size: 26px; font-weight: 700\">Aa LL<\u002Fspan><\u002Fdiv>\n<div class=\"card {{v_teoria.hl.pheno}}\" style=\"padding: 12px 18px; display: flex; gap: 12px; align-items: center\"><div class=\"pea pea-y\" style=\"width: 40px; height: 40px\"><\u002Fdiv><div style=\"display: flex; flex-direction: column\"><span class=\"kicker\">Fenotipo<\u002Fspan><span style=\"font-weight: 700\">Semilla amarilla y lisa<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"muted\" style=\"margin: 0; font-size: 14px; text-align: center\">A = amarilla, a = verde · L = lisa, l = rugosa<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{sb.teoria_1}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"section\" style=\"background: #E7EDE3\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<p class=\"kicker\">Las tres leyes<\u002Fp>\n<h2 class=\"h2\">Lo que demostraron los guisantes<\u002Fh2>\n<\u002Fdiv>\n<div class=\"chips\">\n<sc-for list=\"{{v_teoria.laws}}\" as=\"lw\" hint-placeholder-count=\"3\"><button class=\"{{lw.cls}}\" sc-camel-on-click=\"{{lw.pick}}\" aria-pressed=\"{{lw.on}}\">{{lw.name}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n\n<sc-if value=\"{{v_teoria.law0}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"card\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr)); gap: 28px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<h3 class=\"serif\" style=\"font-size: 38px; line-height: 1.05; margin: 0\">1ª ley · Uniformidad de los híbridos<\u002Fh3>\n<p style=\"margin: 0; font-size: 19px\">Al cruzar dos líneas puras que se diferencian en un carácter, <strong>todos los descendientes de la primera generación (F1) son iguales<\u002Fstrong> entre sí.<\u002Fp>\n<p class=\"muted\" style=\"margin: 0\">Todos son heterocigotos (Aa) y muestran el carácter dominante. El alelo recesivo sigue ahí, aunque no se vea.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<div class=\"gen-row\"><span class=\"gen-label\">P<\u002Fspan><div class=\"pea-box\"><div class=\"pea pea-y\" style=\"width: 46px; height: 46px\"><\u002Fdiv>AA<\u002Fdiv><span class=\"arrow\">×<\u002Fspan><div class=\"pea-box\"><div class=\"pea pea-g\" style=\"width: 46px; height: 46px\"><\u002Fdiv>aa<\u002Fdiv><\u002Fdiv>\n<div class=\"gen-row\"><span class=\"gen-label\">Gametos<\u002Fspan><div class=\"gamete\">A<\u002Fdiv><span class=\"muted\">y<\u002Fspan><div class=\"gamete\">a<\u002Fdiv><\u002Fdiv>\n<div class=\"gen-row\"><span class=\"gen-label\">F1<\u002Fspan><div class=\"pea-box\"><div class=\"pea pea-y\" style=\"width: 40px; height: 40px\"><\u002Fdiv>Aa<\u002Fdiv><div class=\"pea-box\"><div class=\"pea pea-y\" style=\"width: 40px; height: 40px\"><\u002Fdiv>Aa<\u002Fdiv><div class=\"pea-box\"><div class=\"pea pea-y\" style=\"width: 40px; height: 40px\"><\u002Fdiv>Aa<\u002Fdiv><div class=\"pea-box\"><div class=\"pea pea-y\" style=\"width: 40px; height: 40px\"><\u002Fdiv>Aa<\u002Fdiv><span class=\"tag\">100 % amarillas<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v_teoria.law1}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr)); gap: 28px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<h3 class=\"serif\" style=\"font-size: 38px; line-height: 1.05; margin: 0\">2ª ley · Segregación<\u002Fh3>\n<p style=\"margin: 0; font-size: 19px\">Los dos alelos de un individuo <strong>se separan al formar los gametos<\u002Fstrong>: cada gameto lleva solo uno. Al cruzar dos híbridos de la F1, reaparece el carácter recesivo.<\u002Fp>\n<p class=\"muted\" style=\"margin: 0\">Genotipos de la F2: 1 AA : 2 Aa : 1 aa. Fenotipos: 3 amarillas : 1 verde.<\u002Fp>\n<div class=\"gen-row\"><span class=\"gen-label\">F1<\u002Fspan><div class=\"pea-box\"><div class=\"pea pea-y\" style=\"width: 42px; height: 42px\"><\u002Fdiv>Aa<\u002Fdiv><span class=\"arrow\">×<\u002Fspan><div class=\"pea-box\"><div class=\"pea pea-y\" style=\"width: 42px; height: 42px\"><\u002Fdiv>Aa<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<span class=\"kicker\">Tabla de Punnett<\u002Fspan>\n<div class=\"punnett\" style=\"grid-template-columns: 64px repeat(2, minmax(0, 1fr)); max-width: 380px\">\n<sc-for list=\"{{v_teoria.p2cells}}\" as=\"pc\" hint-placeholder-count=\"9\"><div class=\"{{pc.cls}}\"><sc-if value=\"{{pc.pea}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"{{pc.peaCls}}\" style=\"width: 26px; height: 26px\"><\u002Fdiv><\u002Fsc-if>{{pc.txt}}<\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap\"><span class=\"tag\">3/4 amarillas<\u002Fspan><span class=\"tag\" style=\"background: #E9F2DA\">1/4 verdes<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v_teoria.law2}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr)); gap: 28px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<h3 class=\"serif\" style=\"font-size: 38px; line-height: 1.05; margin: 0\">3ª ley · Transmisión independiente<\u002Fh3>\n<p style=\"margin: 0; font-size: 19px\">Cuando se estudian dos caracteres a la vez, <strong>cada pareja de alelos se hereda con independencia de la otra<\u002Fstrong>. Un dihíbrido AaLl forma cuatro tipos de gametos en igual proporción.<\u002Fp>\n<div class=\"gen-row\"><span class=\"gen-label\">Gametos<\u002Fspan><div class=\"gamete\">AL<\u002Fdiv><div class=\"gamete\">Al<\u002Fdiv><div class=\"gamete\">aL<\u002Fdiv><div class=\"gamete\">al<\u002Fdiv><\u002Fdiv>\n<p class=\"muted\" style=\"margin: 0\">Resultado: 9 amarillas lisas : 3 amarillas rugosas : 3 verdes lisas : 1 verde rugosa.<\u002Fp>\n<p class=\"muted\" style=\"margin: 0; font-size: 15px\"><strong>Ojo:<\u002Fstrong> solo se cumple si los genes están en cromosomas distintos (o muy separados). Los genes que están juntos en el mismo cromosoma, los genes ligados, tienden a heredarse juntos.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px; overflow-x: auto\">\n<span class=\"kicker\">AaLl × AaLl<\u002Fspan>\n<div class=\"punnett\" style=\"grid-template-columns: 52px repeat(4, minmax(56px, 1fr)); min-width: 340px\">\n<sc-for list=\"{{v_teoria.p3cells}}\" as=\"pc\" hint-placeholder-count=\"25\"><div class=\"{{pc.cls}}\" style=\"min-height: 56px; font-size: 13px\"><sc-if value=\"{{pc.pea}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"{{pc.peaCls}}\" style=\"width: 22px; height: 22px\"><\u002Fdiv><\u002Fsc-if>{{pc.txt}}<\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{sb.teoria_2}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"section\">\n<div class=\"wrap\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 32px; align-items: start\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<p class=\"kicker\">Método<\u002Fp>\n<h2 class=\"h2\">Cómo resolver un problema<\u002Fh2>\n<div class=\"card\" style=\"background: #17231C; color: #FFFFFF; border-color: #17231C\">\n<p style=\"margin: 0\">En el cobaya, el pelo negro (N) domina sobre el blanco (n). Se cruza un macho negro heterocigoto con una hembra blanca. ¿Cómo serán sus crías?<\u002Fp>\n<\u002Fdiv>\n<div class=\"steps\">\n<div class=\"stepc\"><span class=\"stepn\">1<\u002Fspan><div><strong>Asigna letras.<\u002Fstrong> <span class=\"muted\">Mayúscula para el dominante: N = negro, n = blanco.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"stepc\"><span class=\"stepn\">2<\u002Fspan><div><strong>Escribe los genotipos de los padres.<\u002Fstrong> <span class=\"muted\">Macho negro heterocigoto: <span class=\"mono\">Nn<\u002Fspan>. Hembra blanca (recesiva, solo puede ser homocigota): <span class=\"mono\">nn<\u002Fspan>.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"stepc\"><span class=\"stepn\">3<\u002Fspan><div><strong>Forma los gametos.<\u002Fstrong> <span class=\"muted\">El macho da <span class=\"mono\">N<\u002Fspan> o <span class=\"mono\">n<\u002Fspan>; la hembra solo <span class=\"mono\">n<\u002Fspan>.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"stepc\"><span class=\"stepn\">4<\u002Fspan><div><strong>Haz la tabla de Punnett.<\u002Fstrong> <span class=\"muted\">Combina cada gameto de un padre con cada gameto del otro.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"stepc\"><span class=\"stepn\">5<\u002Fspan><div><strong>Cuenta proporciones.<\u002Fstrong> <span class=\"muted\">Genotipos: 1/2 <span class=\"mono\">Nn<\u002Fspan> y 1/2 <span class=\"mono\">nn<\u002Fspan>. Fenotipos: 50 % negros y 50 % blancos.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<p class=\"kicker\">Cruzamiento prueba<\u002Fp>\n<h2 class=\"h2\">¿AA o Aa? Descúbrelo<\u002Fh2>\n<p style=\"margin: 0\">Un individuo dominante puede ser homocigoto (AA) o heterocigoto (Aa): por fuera son iguales. Para saberlo se cruza con un <strong>homocigoto recesivo (aa)<\u002Fstrong>, que solo aporta alelos <span class=\"mono\">a<\u002Fspan> y deja ver lo que trae el otro.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 14px\">\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 10px\">\n<span class=\"mono\" style=\"font-weight: 700; font-size: 20px\">AA × aa<\u002Fspan>\n<div style=\"display: flex; gap: 6px\"><div class=\"pea pea-y\" style=\"width: 28px; height: 28px\"><\u002Fdiv><div class=\"pea pea-y\" style=\"width: 28px; height: 28px\"><\u002Fdiv><div class=\"pea pea-y\" style=\"width: 28px; height: 28px\"><\u002Fdiv><div class=\"pea pea-y\" style=\"width: 28px; height: 28px\"><\u002Fdiv><\u002Fdiv>\n<span class=\"muted\">Todos dominantes. Era <strong>homocigoto<\u002Fstrong>.<\u002Fspan>\n<\u002Fdiv>\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 10px\">\n<span class=\"mono\" style=\"font-weight: 700; font-size: 20px\">Aa × aa<\u002Fspan>\n<div style=\"display: flex; gap: 6px\"><div class=\"pea pea-y\" style=\"width: 28px; height: 28px\"><\u002Fdiv><div class=\"pea pea-g\" style=\"width: 28px; height: 28px\"><\u002Fdiv><div class=\"pea pea-y\" style=\"width: 28px; height: 28px\"><\u002Fdiv><div class=\"pea pea-g\" style=\"width: 28px; height: 28px\"><\u002Fdiv><\u002Fdiv>\n<span class=\"muted\">Mitad y mitad (1 : 1). Era <strong>heterocigoto<\u002Fstrong>.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"muted\" style=\"margin: 0; font-size: 15px\">Basta con que aparezca un solo descendiente recesivo para saber que el padre dominante era heterocigoto. Pruébalo en <button type=\"button\" class=\"linkbtn\" sc-camel-on-click=\"{{go.retos}}\">Retos → La planta misteriosa<\u002Fbutton>.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{sb.teoria_3}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"section\" style=\"background: #E7EDE3\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 22px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<p class=\"kicker\">Probabilidad<\u002Fp>\n<h2 class=\"h2\">La regla del producto<\u002Fh2>\n<p class=\"lead\">Como cada gen se hereda por separado, la probabilidad de una combinación es el producto de las probabilidades de cada gen. Monta un cruce con tres genes y elige qué buscas.<\u002Fp>\n<\u002Fdiv>\n<div class=\"card\">\n<sc-for list=\"{{v_teoria.calcRows}}\" as=\"cr\" hint-placeholder-count=\"3\">\n<div class=\"calc-row\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span class=\"kicker\">Gen {{cr.L}}<\u002Fspan><span class=\"muted\" style=\"font-size: 15px\">{{cr.desc}}<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 14px; font-weight: 700\">Madre<\u002Fspan><div class=\"chips\"><sc-for list=\"{{cr.m}}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 14px; font-weight: 700\">Padre<\u002Fspan><div class=\"chips\"><sc-for list=\"{{cr.f}}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 14px; font-weight: 700\">Busco un hijo…<\u002Fspan><div class=\"chips\"><sc-for list=\"{{cr.t}}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><span class=\"mono\" style=\"font-size: 15px\">P = {{cr.p}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding-top: 18px; border-top: 1px solid #E1E7DF\">\n<span class=\"mono\" style=\"font-size: 16px\">{{v_teoria.calcExpr}}<\u002Fspan>\n<span class=\"serif\" style=\"font-size: 48px; line-height: 1\">{{v_teoria.calcRes}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{sb.teoria_4}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"section\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<p class=\"kicker\">Más allá de Mendel<\u002Fp>\n<h2 class=\"h2\">No todo es dominante o recesivo<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 16px\">\n<div class=\"card\"><h3 class=\"h3\">Herencia intermedia y codominancia<\u002Fh3><p class=\"muted\" style=\"margin: 8px 0 0\">El heterocigoto puede tener un fenotipo intermedio (flores rosas) o mostrar los dos a la vez (grupo AB).<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3 class=\"h3\">Alelos múltiples<\u002Fh3><p class=\"muted\" style=\"margin: 8px 0 0\">Algunos genes tienen más de dos alelos en la población, como los grupos sanguíneos A, B y 0.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3 class=\"h3\">Herencia ligada al sexo<\u002Fh3><p class=\"muted\" style=\"margin: 8px 0 0\">Genes en el cromosoma X, como el del daltonismo, se heredan distinto en chicos y chicas.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3 class=\"h3\">Herencia poligénica y ambiente<\u002Fh3><p class=\"muted\" style=\"margin: 8px 0 0\">La altura o el color de piel dependen de muchos genes y del ambiente, por eso varían de forma continua.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\"><button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{go.herencia}}\">Explorar los tipos de herencia<\u002Fbutton><button type=\"button\" class=\"btn ghost\" sc-camel-on-click=\"{{go.huerto}}\">Ir al huerto 3D<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{tabOn.huerto}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"sec-huerto\">\n<section class=\"wrap\" style=\"padding-top: 40px; padding-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<p class=\"kicker\">03 · Laboratorio<\u002Fp>\n<h1 class=\"h1\">El huerto <em>3D<\u002Fem><\u002Fh1>\n<\u002Fdiv>\n<p class=\"muted\" style=\"margin: 0; max-width: 520px\">Elige el carácter, los genotipos de la planta madre y de la planta padre, y poliniza. Arrastra el huerto para girarlo.<\u002Fp>\n<\u002Fsection>\n<section class=\"wrap\" style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<div class=\"card\" style=\"flex: 1 1 340px; max-width: 100%; display: flex; flex-direction: column\">\n<div class=\"ctl\">\n<span class=\"lbl\">Tipo de cruce<\u002Fspan>\n<div class=\"chips\"><sc-for list=\"{{v_huerto.modeChips}}\" as=\"o\" hint-placeholder-count=\"2\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ctl\">\n<span class=\"lbl\">Carácter {{v_huerto.labelA}}<\u002Fspan>\n<div class=\"chips\"><sc-for list=\"{{v_huerto.traitA}}\" as=\"o\" hint-placeholder-count=\"7\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{v_huerto.isDi}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"ctl\">\n<span class=\"lbl\">Carácter 2<\u002Fspan>\n<div class=\"chips\"><sc-for list=\"{{v_huerto.traitB}}\" as=\"o\" hint-placeholder-count=\"6\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div class=\"ctl\">\n<span class=\"lbl\">Atajos<\u002Fspan>\n<div class=\"chips\"><sc-for list=\"{{v_huerto.presets}}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"chip sm\" sc-camel-on-click=\"{{o.pick}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ctl\">\n<span class=\"lbl\">♀ Planta madre · {{v_huerto.p1Ph}}<\u002Fspan>\n<div class=\"chips\"><sc-for list=\"{{v_huerto.p1Chips}}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ctl\">\n<span class=\"lbl\">♂ Planta padre · {{v_huerto.p2Ph}}<\u002Fspan>\n<div class=\"chips\"><sc-for list=\"{{v_huerto.p2Chips}}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ctl\">\n<span class=\"lbl\">Número de semillas<\u002Fspan>\n<div class=\"chips\"><sc-for list=\"{{v_huerto.nChips}}\" as=\"o\" hint-placeholder-count=\"4\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ctl\" style=\"gap: 10px\">\n<sc-if value=\"{{v_huerto.dirty}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"notice\">Has cambiado el cruce. Pulsa polinizar para ver el nuevo resultado.<\u002Fdiv><\u002Fsc-if>\n<button class=\"btn go\" sc-camel-on-click=\"{{v_huerto.cross}}\">Polinizar y sembrar<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<div class=\"scene\" sc-camel-on-pointer-down=\"{{v_huerto.down}}\" sc-camel-on-pointer-move=\"{{v_huerto.move}}\" sc-camel-on-pointer-up=\"{{v_huerto.up}}\" sc-camel-on-pointer-cancel=\"{{v_huerto.up}}\" sc-camel-on-pointer-leave=\"{{v_huerto.up}}\" role=\"img\" ar
