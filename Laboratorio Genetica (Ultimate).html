c-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<span class=\"muted\" style=\"font-size: 15px\">{{v_herencia.ph2}}<\u002Fspan>\n<\u002Fdiv>\n<sc-if value=\"{{v_herencia.isABO}}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" class=\"btn\" style=\"align-self: flex-start\" sc-camel-on-click=\"{{go.sangre}}\">Más sobre grupos sanguíneos<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap\"><h2 class=\"h2\">Tabla de Punnett<\u002Fh2><span class=\"mono\" style=\"font-weight: 700; font-size: 18px\">{{v_herencia.crossTxt}}<\u002Fspan><\u002Fdiv>\n<div class=\"punnett\">\n<sc-for list=\"{{v_herencia.cells}}\" as=\"c\" hint-placeholder-count=\"9\">\n<div class=\"{{c.cls}}\">\n<sc-if value=\"{{c.head}}\" hint-placeholder-val=\"{{ true }}\">{{c.txt}}<\u002Fsc-if>\n<sc-if value=\"{{c.body}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"swatch\" style=\"background: {{c.bg}}; border-radius: {{c.rad}}\"><\u002Fdiv><span class=\"gt\">{{c.txt}}<\u002Fspan><span class=\"pn\">{{c.pn}}<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 4px\">\n<h2 class=\"h2\" style=\"margin-bottom: 8px\">Descendencia esperada<\u002Fh2>\n<sc-for list=\"{{v_herencia.groups}}\" as=\"g\" hint-placeholder-count=\"1\">\n<sc-if value=\"{{g.titled}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"kicker\" style=\"margin-top: 10px\">{{g.title}}<\u002Fspan><\u002Fsc-if>\n<sc-for list=\"{{g.rows}}\" as=\"r\" hint-placeholder-count=\"2\">\n<div class=\"res\">\n<div class=\"swatch\" style=\"width: 28px; height: 28px; background: {{r.bg}}; border-radius: {{r.rad}}\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-weight: 700\">{{r.name}}<\u002Fspan><div class=\"barbox\"><div style=\"height: 100%; width: {{r.pct}}%; background: #2F7D3A\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<span class=\"mono\" style=\"font-weight: 700; text-align: right\">{{r.frac}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsc-for>\n<p class=\"muted\" style=\"margin: 10px 0 0; font-size: 15px\">{{v_herencia.note}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 14px; overflow-x: auto\">\n<h2 class=\"h2\">Resumen para comparar<\u002Fh2>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Tipo<\u002Fsc-raw-th><sc-raw-th>¿Cómo es el heterocigoto?<\u002Fsc-raw-th><sc-raw-th>F2 (híbrido × híbrido)<\u002Fsc-raw-th><sc-raw-th>Ejemplo<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><strong>Dominancia completa<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Igual que el dominante<\u002Fsc-raw-td><sc-raw-td class=\"mono\">3 : 1<\u002Fsc-raw-td><sc-raw-td>Color del guisante, hoyuelos<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Herencia intermedia<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Fenotipo intermedio, «mezcla»<\u002Fsc-raw-td><sc-raw-td class=\"mono\">1 : 2 : 1<\u002Fsc-raw-td><sc-raw-td>Flores del dondiego de noche<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Codominancia<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Muestra los dos fenotipos a la vez<\u002Fsc-raw-td><sc-raw-td class=\"mono\">1 : 2 : 1<\u002Fsc-raw-td><sc-raw-td>Ganado ruano, grupo AB<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Alelos múltiples<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Depende de qué dos alelos tenga<\u002Fsc-raw-td><sc-raw-td>Varía según el cruce<\u002Fsc-raw-td><sc-raw-td>Grupos sanguíneos AB0<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Ligada al sexo (X)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Las mujeres heterocigotas son portadoras<\u002Fsc-raw-td><sc-raw-td>Distinta en chicos y chicas<\u002Fsc-raw-td><sc-raw-td>Daltonismo, hemofilia<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<p class=\"muted\" style=\"margin: 0; font-size: 15px\">Otros casos que puedes encontrar: los <strong>genes letales<\u002Fstrong>, en los que una combinación no llega a nacer y la F2 da 2 : 1; y la <strong>herencia influida por el sexo<\u002Fstrong>, como la calvicie común, en la que el mismo genotipo se expresa distinto en hombres y mujeres.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{tabOn.sangre}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"sec-sangre\">\n<section class=\"wrap\" style=\"padding-top: 48px; padding-bottom: 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 28px; align-items: end\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<p class=\"kicker\">06 · Grupos sanguíneos<\u002Fp>\n<h1 class=\"h1\">Lo que llevas <em>en la sangre<\u002Fem><\u002Fh1>\n<p class=\"muted\" style=\"margin: 0; font-size: 19px\">El sistema AB0 depende de un gen con tres alelos: <span class=\"mono\">Iᴬ<\u002Fspan> e <span class=\"mono\">Iᴮ<\u002Fspan> son codominantes y los dos dominan sobre <span class=\"mono\">i<\u002Fspan>. El factor Rh depende de otro gen: <span class=\"mono\">D<\u002Fspan> (Rh+) domina sobre <span class=\"mono\">d<\u002Fspan> (Rh−).<\u002Fp>\n<\u002Fdiv>\n<div class=\"card\" style=\"overflow-x: auto; padding: 8px 18px\">\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Grupo<\u002Fsc-raw-th><sc-raw-th>Antígenos en el glóbulo rojo<\u002Fsc-raw-th><sc-raw-th>Genotipos<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><div style=\"display: flex; align-items: center; gap: 12px\"><div class=\"drop\" style=\"background: #2F5FB3\"><\u002Fdiv><strong>A<\u002Fstrong><\u002Fdiv><\u002Fsc-raw-td><sc-raw-td>A<\u002Fsc-raw-td><sc-raw-td class=\"mono\">IᴬIᴬ · Iᴬi<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><div style=\"display: flex; align-items: center; gap: 12px\"><div class=\"drop\" style=\"background: #E07B24\"><\u002Fdiv><strong>B<\u002Fstrong><\u002Fdiv><\u002Fsc-raw-td><sc-raw-td>B<\u002Fsc-raw-td><sc-raw-td class=\"mono\">IᴮIᴮ · Iᴮi<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><div style=\"display: flex; align-items: center; gap: 12px\"><div class=\"drop\" style=\"background: #6B3FA0\"><\u002Fdiv><strong>AB<\u002Fstrong><\u002Fdiv><\u002Fsc-raw-td><sc-raw-td>A y B<\u002Fsc-raw-td><sc-raw-td class=\"mono\">IᴬIᴮ<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><div style=\"display: flex; align-items: center; gap: 12px\"><div class=\"drop\" style=\"background: #8A948C\"><\u002Fdiv><strong>0<\u002Fstrong><\u002Fdiv><\u002Fsc-raw-td><sc-raw-td>Ninguno<\u002Fsc-raw-td><sc-raw-td class=\"mono\">ii<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fsection>\n<div class=\"subwrap\"><nav class=\"subnav\" aria-label=\"Apartados\"><sc-for list=\"{{subtabs}}\" as=\"sbt\" hint-placeholder-count=\"3\"><button type=\"button\" class=\"{{sbt.cls}}\" sc-camel-on-click=\"{{sbt.pick}}\" aria-pressed=\"{{sbt.on}}\">{{sbt.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fnav><\u002Fdiv>\n<sc-if value=\"{{sb.sangre_0}}\" hint-placeholder-val=\"{{ true }}\">\n<section class=\"section\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\"><p class=\"kicker\">Calculadora<\u002Fp><h2 class=\"h2\">¿Qué grupo tendrán los hijos?<\u002Fh2><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 20px\">\n<sc-for list=\"{{v_sangre.parents}}\" as=\"p\" hint-placeholder-count=\"2\">\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n<h3 class=\"serif\" style=\"font-size: 34px; margin: 0; line-height: 1\">{{p.role}}<\u002Fh3>\n<div class=\"bigdrop\" style=\"background: {{p.color}}\"><span>{{p.ph}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<span class=\"h3\" style=\"font-size: 16px\">Grupo AB0<\u002Fspan>\n<div class=\"chips\"><sc-for list=\"{{p.abo}}\" as=\"o\" hint-placeholder-count=\"6\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<span class=\"h3\" style=\"font-size: 16px\">Factor Rh<\u002Fspan>\n<div class=\"chips\"><sc-for list=\"{{p.rh}}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 20px; align-items: start\">\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 12px\">\n<span class=\"h3\">Gen AB0<\u002Fspan>\n<div class=\"punnett\"><sc-for list=\"{{v_sangre.punA}}\" as=\"c\" hint-placeholder-count=\"9\"><div class=\"{{c.cls}}\">{{c.txt}}<sc-if value=\"{{c.sub}}\" hint-placeholder-val=\"{{ false }}\"><small>{{c.subTxt}}<\u002Fsmall><\u002Fsc-if><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 12px\">\n<span class=\"h3\">Gen Rh<\u002Fspan>\n<div class=\"punnett\"><sc-for list=\"{{v_sangre.punR}}\" as=\"c\" hint-placeholder-count=\"9\"><div class=\"{{c.cls}}\">{{c.txt}}<sc-if value=\"{{c.sub}}\" hint-placeholder-val=\"{{ false }}\"><small>{{c.subTxt}}<\u002Fsmall><\u002Fsc-if><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 6px\">\n<span class=\"h3\" style=\"margin-bottom: 6px\">Probabilidad de cada grupo<\u002Fspan>\n<sc-for list=\"{{v_sangre.combo}}\" as=\"r\" hint-placeholder-count=\"4\">\n<div class=\"res\">\n<div class=\"drop\" style=\"background: {{r.color}}\"><\u002Fdiv>\n<strong class=\"mono\">{{r.name}}<\u002Fstrong>\n<div class=\"barbox\"><div style=\"height: 100%; width: {{r.pct}}%; background: {{r.color}}\"><\u002Fdiv><\u002Fdiv>\n<span class=\"mono\" style=\"text-align: right; font-weight: 700\">{{r.frac}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<p class=\"muted\" style=\"margin: 8px 0 0; font-size: 15px\">Los dos genes se heredan de forma independiente, así que se multiplican las probabilidades: P = P(AB0) × P(Rh).<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\" style=\"background: #17231C; color: #FFFFFF; border-color: #17231C\">\n<span style=\"font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #D9E4DA\">Si solo conociéramos el grupo de los padres<\u002Fspan>\n<p style=\"margin: 6px 0 0\">Una madre <strong>{{v_sangre.onlyPh.m}}<\u002Fstrong> y un padre <strong>{{v_sangre.onlyPh.f}}<\u002Fstrong>, sin saber sus genotipos, podrían tener hijos de los grupos: <strong class=\"mono\">{{v_sangre.onlyPh.list}}<\u002Fstrong>.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{sb.sangre_1}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"section\" style=\"background: #E7EDE3\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\"><p class=\"kicker\">Transfusiones<\u002Fp><h2 class=\"h2\">¿Quién puede donar a quién?<\u002Fh2><p class=\"muted\" style=\"margin: 0; max-width: 720px\">El receptor no puede recibir glóbulos rojos con antígenos que él no tenga, porque su sangre los atacaría. Elige el grupo de la persona que recibe la transfusión.<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 16px\">\n<span class=\"h3\">Receptor<\u002Fspan>\n<div class=\"chips\"><sc-for list=\"{{v_sangre.recv}}\" as=\"o\" hint-placeholder-count=\"8\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.on}}\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<span class=\"h3\">Donantes compatibles con {{v_sangre.recvName}}<\u002Fspan>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px\">\n<sc-for list=\"{{v_sangre.donors}}\" as=\"d\" hint-placeholder-count=\"8\"><div class=\"{{d.cls}}\"><div class=\"drop\" style=\"background: {{d.color}}\"><\u002Fdiv><strong class=\"mono\" style=\"font-size: 18px\">{{d.name}}<\u002Fstrong><span style=\"font-size: 13px; font-weight: 700\">{{d.lab}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<p class=\"muted\" style=\"margin: 0; font-size: 15px\">El grupo <strong>0−<\u002Fstrong> es el donante universal de glóbulos rojos y el <strong>AB+<\u002Fstrong> es el receptor universal. En la práctica, los hospitales siempre comprueban la compatibilidad antes de transfundir.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{sb.sangre_2}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"section\">\n<div class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\"><p class=\"kicker\">Caso detective<\u002Fp><h2 class=\"h2\">¿Quién puede ser el padre?<\u002Fh2><\u002Fdiv>\n<button class=\"btn ghost\" sc-camel-on-click=\"{{v_sangre.det.renew}}\">Nuevo caso<\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin: 0; max-width: 760px\">En el hospital se han mezclado unos datos. Sabemos el grupo de la madre y del bebé. Marca para cada candidato si <strong>puede<\u002Fstrong> o <strong>no puede<\u002Fstrong> ser el padre biológico.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 14px\">\n<div class=\"person\"><span class=\"kicker\">Madre<\u002Fspan><div class=\"bigdrop\" style=\"background: {{v_sangre.det.mColor}}\"><span>{{v_sangre.det.m}}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"person\"><span class=\"kicker\">Bebé<\u002Fspan><div class=\"bigdrop\" style=\"background: {{v_sangre.det.cColor}}\"><span>{{v_sangre.det.c}}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<sc-for list=\"{{v_sangre.det.cands}}\" as=\"k\" hint-placeholder-count=\"3\">\n<div class=\"person\" style=\"background: #FFFFFF; border: 1px solid #D5DDD3\">\n<span class=\"kicker\">Candidato {{k.n}}<\u002Fspan>\n<div class=\"bigdrop\" style=\"background: {{k.color}}\"><span>{{k.ph}}<\u002Fspan><\u002Fdiv>\n<div class=\"chips\" style=\"justify-content: center\">\n<button class=\"{{k.yesCls}}\" sc-camel-on-click=\"{{k.yes}}\">Puede<\u002Fbutton>\n<button class=\"{{k.noCls}}\" sc-camel-on-click=\"{{k.no}}\">No puede<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n<button class=\"btn\" sc-camel-on-click=\"{{v_sangre.det.check}}\">Comprobar<\u002Fbutton>\n<sc-if value=\"{{v_sangre.det.fbShow}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"{{v_sangre.det.fbCls}}\">{{v_sangre.det.fb}}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<p class=\"muted\" style=\"margin: 0; font-size: 15px\">Truco: escribe los genotipos posibles de la madre y del bebé. ¿Qué alelo ha tenido que aportar el padre? Los grupos sanguíneos pueden descartar a un padre, pero nunca demostrar quién lo es: para eso se usan pruebas de ADN.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{tabOn.genealogia}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"sec-genealogia\">\n<section class=\"wrap\" style=\"padding-top: 48px; padding-bottom: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr)); gap: 28px; align-items: end\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<p class=\"kicker\">07 · Árboles genealógicos<\u002Fp>\n<h1 class=\"h1\">Leer una familia <em>como un detective<\u002Fem><\u002Fh1>\n<p class=\"muted\" style=\"margin: 0; font-size: 19px\">Un árbol genealógico (o pedigrí) muestra cómo aparece un carácter a lo largo de varias generaciones. Pulsa sobre cada persona para asignarle un genotipo.<\u002Fp>\n<\u002Fdiv>\n<div class=\"card legend\">\n<div class=\"lg\"><div class=\"sym\" style=\"border-radius: 4px\"><\u002Fdiv>Hombre<\u002Fdiv>\n<div class=\"lg\"><div class=\"sym\" style=\"border-radius: 50%\"><\u002Fdiv>Mujer<\u002Fdiv>\n<div class=\"lg\"><div class=\"sym\" style=\"border-radius: 4px; background: #17231C\"><\u002Fdiv>Persona afectada<\u002Fdiv>\n<div class=\"lg\"><div class=\"sym\" style=\"border-radius: 50%; background: linear-gradient(90deg, #17231C 50%, #FFFFFF 50%)\"><\u002Fdiv>Portadora (a veces se marca)<\u002Fdiv>\n<div class=\"lg\"><div style=\"width: 30px; height: 2px; background: #17231C\"><\u002Fdiv>Pareja<\u002Fdiv>\n<div class=\"lg\"><div style=\"width: 30px; height: 7px; border-top: 2px solid #17231C; border-bottom: 2px solid #17231C\"><\u002Fdiv>Consanguíneos<\u002Fdiv>\n<div class=\"lg\"><span class=\"serif\" style=\"font-size: 26px; width: 30px\">II<\u002Fspan>Generación<\u002Fdiv>\n<div class=\"lg\"><span class=\"mono\" style=\"width: 30px; font-weight: 700\">A_<\u002Fspan>Uno seguro, el otro no se sabe<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"wrap\" style=\"display: flex; flex-direction: column; gap: 20px; padding-bottom: 48px\">\n<div class=\"tabs\" role=\"tablist\">\n<sc-for list=\"{{v_genealogia.tabs}}\" as=\"t\" hint-placeholder-count=\"3\"><button class=\"{{t.cls}}\" role=\"tab\" aria-selected=\"{{t.on}}\" sc-camel-on-click=\"{{t.pick}}\">{{t.txt}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n<div class=\"card\" style=\"flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px\">\n<h2 class=\"h2\">{{v_genealogia.P.title}}<\u002Fh2>\n<span class=\"muted\" style=\"font-size: 15px\">Opciones al pulsar: <span class=\"mono\">{{v_genealogia.P.optsTxt}}<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0\">{{v_genealogia.P.story}}<\u002Fp>\n<div style=\"overflow-x: auto; padding: 8px 0\">\n<div class=\"pedbox\">\n<sc-for list=\"{{v_genealogia.gens}}\" as=\"g\" hint-placeholder-count=\"3\"><span class=\"gen\" style=\"top: {{g.y}}px\">{{g.t}}<\u002Fspan><\u002Fsc-for>\n<sc-for list=\"{{v_genealogia.lines}}\" as=\"l\" hint-placeholder-count=\"10\"><div class=\"ln\" style=\"left: {{l.x}}px; top: {{l.y}}px; width: {{l.w}}px; height: {{l.h}}px\"><\u002Fdiv><\u002Fsc-for>\n<sc-for list=\"{{v_genealogia.people}}\" as=\"p\" hint-placeholder-count=\"9\">\n<button class=\"{{p.cls}}\" style=\"left: {{p.l}}px; top: {{p.t}}px\" sc-camel-on-click=\"{{p.click}}\" aria-label=\"{{p.aria}}\"><\u002Fbutton>\n<span class=\"pid\" style=\"left: {{p.idl}}px; top: {{p.idt}}px\">{{p.id}}<\u002Fspan>\n<span class=\"{{p.gcls}}\" style=\"left: {{p.gl}}px; top: {{p.gt}}px\">{{p.g}}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n<button class=\"btn\" sc-camel-on-click=\"{{v_genealogia.check}}\">Comprobar genotipos<\u002Fbutton>\n<button class=\"btn ghost\" sc-camel-on-click=\"{{v_genealogia.solve}}\">Ver solución<\u002Fbutton>\n<button class=\"btn ghost\" sc-camel-on-click=\"{{v_genealogia.clear}}\">Borrar<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{v_genealogia.fbShow}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"{{v_genealogia.fbCls}}\">{{v_genealogia.fb}}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 12px\">\n<span class=\"kicker\">Pregunta<\u002Fspan>\n<h3 class=\"h3\">¿Qué tipo de herencia es la más probable?<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; gap: 8px\"><sc-for list=\"{{v_genealogia.typeOpts}}\" as=\"o\" hint-placeholder-count=\"4\"><button class=\"{{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" disabled=\"{{o.dis}}\" style=\"justify-content: flex-start\">{{o.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<sc-if value=\"{{v_genealogia.typeFbShow}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"{{v_genealogia.typeFbCls}}\">{{v_genealogia.typeFb}}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 10px; background: #17231C; color: #FFFFFF; border-color: #17231C\">\n<span style=\"font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #D9E4DA\">Pistas para deducir<\u002Fspan>\n<p style=\"margin: 0\"><strong>Recesiva:<\u002Fstrong> dos padres sanos tienen un hijo afectado. Puede saltarse generaciones.<\u002Fp>\n<p style=\"margin: 0\"><strong>Dominante:<\u002Fstrong> todo afectado tiene un padre afectado. Si dos afectados tienen un hijo sano, es dominante seguro.<\u002Fp>\n<p style=\"margin: 0\"><strong>Ligada al X recesiva:<\u002Fstrong> casi todos los afectados son hombres y la reciben de madres portadoras sanas.<\u002Fp>\n<p style=\"margin: 0\"><strong>Empieza siempre<\u002Fstrong> por las personas con el fenotipo recesivo: su genotipo es seguro.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{tabOn.familia}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"sec-familia\">\n<section class=\"wrap\" style=\"padding-top: 48px; padding-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 680px\">\n<p class=\"kicker\">08 · Creador de familias<\u002Fp>\n<h1 class=\"h1\">¿Cómo serían <em>sus hijos?<\u002Fem><\u002Fh1>\n<p class=\"muted\" style=\"margin: 0; font-size: 19px\">Elige el genotipo de una madre y un padre para siete caracteres y genera hijos al azar. Cada hijo recibe un alelo de cada progenitor para cada gen.<\u002Fp>\n<\u002Fdiv>\n<div class=\"chips\"><button class=\"btn ghost\" sc-camel-on-click=\"{{v_familia.randomize}}\">Padres al azar<\u002Fbutton><button class=\"btn ghost\" sc-camel-on-click=\"{{v_familia.allHet}}\">Todo heterocigoto<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<div class=\"subwrap\"><nav class=\"subnav\" aria-label=\"Apartados\"><sc-for list=\"{{subtabs}}\" as=\"sbt\" hint-placeholder-count=\"3\"><button type=\"button\" class=\"{{sbt.cls}}\" sc-camel-on-click=\"{{sbt.pick}}\" aria-pressed=\"{{sbt.on}}\">{{sbt.txt}}<\u002Fbutton><\u002Fsc-for><\u002Fnav><\u002Fdiv>\n<sc-if value=\"{{sb.familia_0}}\" hint-placeholder-val=\"{{ true }}\">\n<section class=\"wrap\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(520px, 100%), 1fr)); gap: 20px; align-items: start\">\n<sc-for list=\"{{v_familia.parents}}\" as=\"p\" hint-placeholder-count=\"2\">\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 18px\">\n<div class=\"avatar\">\n<sc-if value=\"{{p.av.longHair}}\" hint-placeholder-val=\"{{ true }}\"><div class=\"hair-back\"><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{p.av.curly}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"curl\" style=\"left: 10px; top: 30px\"><\u002Fdiv><div class=\"curl\" style=\"left: 80px; top: 30px\"><\u002Fdiv><div class=\"curl\" style=\"left: 6px; top: 58px\"><\u002Fdiv><div class=\"curl\" style=\"left: 84px; top: 58px\"><\u002Fdiv><\u002Fsc-if>\n<div class=\" iv>\n<sc-if value=\"{{v_familia.noKids}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"card muted\" style=\"text-align: center; padding: 40px\">Todavía no hay hijos. Pulsa «Tener un hijo o hija» para ver cómo se combinan los alelos.<\u002Fdiv><\u002Fsc-if>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px\">\n<sc-for list=\"{{v_familia.kids}}\" as=\"p\" hint-placeholder-count=\"0\">\n<div class=\"kid\">\n<div class=\"avatar\">\n<sc-if value=\"{{p.av.longHair}}\" hint-placeholder-val=\"{{ true }}\"><div class=\"hair-back\"><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{p.av.curly}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"curl\" style=\"left: 10px; top: 30px\"><\u002Fdiv><div class=\"curl\" style=\"left: 80px; top: 30px\"><\u002Fdiv><div class=\"curl\" style=\"left: 6px; top: 58px\"><\u002Fdiv><div class=\"curl\" style=\"left: 84px; top: 58px\"><\u002Fdiv><\u002Fsc-if>\n<div class=\"neck\"><\u002Fdiv>\n<div class=\"body\" style=\"background: {{p.av.shirt}}\"><\u002Fdiv>\n<div class=\"head\"><\u002Fdiv>\n<sc-if value=\"{{p.av.straight}}\" hint-placeholder-val=\"{{ true }}\"><div class=\"cap\"><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{p.av.wavy}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"cap\"><\u002Fdiv><div class=\"wave\" style=\"left: 14px; top: 34px; transform: rotate(18deg)\"><\u002Fdiv><div class=\"wave\" style=\"left: 84px; top: 34px; transform: rotate(-18deg)\"><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{p.av.curly}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"curl\" style=\"left: 18px; top: 14px\"><\u002Fdiv><div class=\"curl\" style=\"left: 38px; top: 8px\"><\u002Fdiv><div class=\"curl\" style=\"left: 60px; top: 8px\"><\u002Fdiv><div class=\"curl\" style=\"left: 76px; top: 16px\"><\u002Fdiv><div class=\"curl\" style=\"left: 28px; top: 26px; width: 26px; height: 22px\"><\u002Fdiv><div class=\"curl\" style=\"left: 62px; top: 26px; width: 26px; height: 22px\"><\u002Fdiv><\u002Fsc-if>\n<div class=\"eye\" style=\"left: 36px\"><div class=\"iris\" style=\"background: {{p.av.eye}}\"><\u002Fdiv><\u002Fdiv>\n<div class=\"eye\" style=\"left: 66px\"><div class=\"iris\" style=\"background: {{p.av.eye}}\"><\u002Fdiv><\u002Fdiv>\n<sc-if value=\"{{p.av.freckles}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"freckle\" style=\"left: 36px; top: 76px\"><\u002Fdiv><div class=\"freckle\" style=\"left: 42px; top: 79px\"><\u002Fdiv><div class=\"freckle\" style=\"left: 34px; top: 82px\"><\u002Fdiv><div class=\"freckle\" style=\"left: 78px; top: 76px\"><\u002Fdiv><div class=\"freckle\" style=\"left: 84px; top: 79px\"><\u002Fdiv><div class=\"freckle\" style=\"left: 80px; top: 83px\"><\u002Fdiv><\u002Fsc-if>\n<div class=\"mouth\"><\u002Fdiv>\n<sc-if value=\"{{p.av.dimples}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"dimple\" style=\"left: 40px\"><\u002Fdiv><div class=\"dimple\" style=\"left: 78px; transform: scaleX(-1)\"><\u002Fdiv><\u002Fsc-if>\n<span class=\"badge\" aria-hidden=\"true\">{{p.av.sym}}<\u002Fspan>\n<sc-if value=\"{{p.av.cb}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"cb\">{{p.av.cbTxt}}<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<strong>{{p.name}}<\u002Fstrong>\n<div class=\"kt\">\n<sc-for list=\"{{p.traits}}\" as=\"t\" hint-placeholder-count=\"7\"><span>{{t.ph}}<\u002Fspan><span class=\"mono\">{{t.g}}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{sb.familia_2}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"wrap\" style=\"padding-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(520px, 100%), 1fr)); gap: 20px; align-items: start\">\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 4px\">\n<h2 class=\"h2\" style=\"margin-bottom: 8px\">Probabilidades para cada hijo<\u002Fh2>\n<sc-for list=\"{{v_familia.probs}}\" as=\"r\" hint-placeholder-count=\"7\">\n<div class=\"prob\">\n<span class=\"tl\">{{r.name}}<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<sc-for list=\"{{r.groups}}\" as=\"g\" hint-placeholder-count=\"1\">\n<div class=\"chips\" style=\"align-items: center\"><sc-if value=\"{{g.titled}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 13px; font-weight: 700; width: 48px\">{{g.title}}<\u002Fspan><\u002Fsc-if><sc-for list=\"{{g.items}}\" as=\"it\" hint-placeholder-count=\"2\"><span class=\"pill\">{{it.ph}} <strong>{{it.pct}}<\u002Fstrong><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 10px\">\n<span class=\"kicker\">Para pensar<\u002Fspan>\n<p style=\"margin: 0\">¿Por qué dos hermanos con los mismos padres pueden ser tan distintos? Cada hijo recibe una combinación al azar: con solo estos siete genes ya hay miles de combinaciones posibles.<\u002Fp>\n<p style=\"margin: 0\">Prueba: madre <span class=\"mono\">mm<\u002Fspan> (ojos claros) y padre <span class=\"mono\">Mm<\u002Fspan> (oscuros). ¿Qué proporción de hijos con ojos claros esperas? Genera 12 hijos y compara.<\u002Fp>\n<p style=\"margin: 0\">Con daltonismo: madre portadora <span class=\"mono\">XᴰXᵈ<\u002Fspan> y padre <span class=\"mono\">XᴰY<\u002Fspan>. ¿Puede tener una hija daltónica?<\u002Fp>\n<\u002Fdiv>\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 8px; background: #FBF3E3; border-color: #EAD9B5\">\n<span class=\"kicker\" style=\"color: #6B4A12\">Importante: es un modelo simplificado<\u002Fspan>\n<p style=\"margin: 0; font-size: 15px\">El color de ojos, la forma del pelo, las pecas o los hoyuelos dependen en realidad de varios genes y también del ambiente. Aquí se tratan como si dependieran de un solo gen para practicar las leyes de Mendel. Los grupos sanguíneos, el factor Rh y el daltonismo sí siguen bastante bien estos modelos.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"height: 48px\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1500}}\">\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    var D = this.defs();\n    this.TABS = [{\"id\": \"inicio\", \"label\": \"Inicio\", \"sec\": \"main\", \"subs\": []}, {\"id\": \"historia\", \"label\": \"Historia\", \"sec\": \"main\", \"subs\": [\"Cronología\", \"¿Por qué guisantes?\", \"Los 7 caracteres\", \"Su gran idea\"]}, {\"id\": \"teoria\", \"label\": \"Teoría\", \"sec\": \"teoria\", \"subs\": [\"Conceptos\", \"Las tres leyes\", \"Resolver problemas\", \"Probabilidad\", \"Más allá de Mendel\"]}, {\"id\": \"huerto\", \"label\": \"Huerto 3D\", \"sec\": \"huerto\", \"subs\": [\"Padres y tabla de Punnett\", \"Fenotipos y genotipos\"]}, {\"id\": \"retos\", \"label\": \"Retos\", \"sec\": \"retos\", \"subs\": [\"La planta misteriosa\", \"Deduce los padres\", \"Tabla de Punnett\", \"Preguntas rápidas\"]}, {\"id\": \"herencia\", \"label\": \"Tipos de herencia\", \"sec\": \"herencia\", \"subs\": []}, {\"id\": \"sangre\", \"label\": \"Grupos sanguíneos\", \"sec\": \"sangre\", \"subs\": [\"Calculadora\", \"Transfusiones\", \"Caso detective\"]}, {\"id\": \"genealogia\", \"label\": \"Genealogías\", \"sec\": \"genealogia\", \"subs\": []}, {\"id\": \"familia\", \"label\": \"Familias\", \"sec\": \"familia\", \"subs\": [\"Madre y padre\", \"Hijos\", \"Probabilidades\"]}];\n    this.secs = {};\n    var self = this;\n    Object.keys(D).forEach(function (k) { var s = new D[k]({}); s._host = self; s._key = k; self.secs[k] = s; });\n    var sub = {}; this.TABS.forEach(function (t) { sub[t.id] = 0; });\n    this.state = { tab: 'inicio', sub: sub };\n  }\n  defs() {\nclass SecBase {\n  constructor(props) { this.props = props || {}; this.state = {}; }\n  setState(o) { var p = typeof o === 'function' ? o(this.state) : o; this.state = Object.assign({}, this.state, p); if (this._host) this._host.forceUpdate(); }\n  forceUpdate() { if (this._host) this._host.forceUpdate(); }\n  _active() { var h = this._host; if (!h) return false; var t = h.TABS.filter(function (x) { return x.id === h.state.tab; })[0]; return !!t && t.sec === this._key; }\n}\nclass Sec_main extends SecBase {\n  constructor(props) {\n    super(props);\n    this.state = { trait: 1, step: 0 };\n    this.TRAITS = [\n      { id: 'forma', name: 'Forma de la semilla', L: 'L', dom: 'Lisa', rec: 'Rugosa', domL: 'semillas lisas', recL: 'semillas rugosas', d: 5474, r: 1850, look: 'Fíjate en la semilla que hay junto a cada planta: lisa o arrugada.' },\n      { id: 'colorSem', name: 'Color de la semilla', L: 'A', dom: 'Amarilla', rec: 'Verde', domL: 'semillas amarillas', recL: 'semillas verdes', d: 6022, r: 2001, look: 'Fíjate en el color de la semilla que hay junto a cada planta.' },\n      { id: 'flor', name: 'Color de la flor', L: 'V', dom: 'Violeta', rec: 'Blanca', domL: 'flores violetas', recL: 'flores blancas', d: 705, r: 224, look: 'Fíjate en el color de las flores.' },\n      { id: 'vaina', name: 'Forma de la vaina', L: 'H', dom: 'Hinchada', rec: 'Estrangulada', domL: 'vainas hinchadas', recL: 'vainas estranguladas', d: 882, r: 299, look: 'Fíjate en las vainas: lisas o con estrechamientos entre guisante y guisante.' },\n      { id: 'colorVaina', name: 'Color de la vaina', L: 'C', dom: 'Verde', rec: 'Amarilla', domL: 'vainas verdes', recL: 'vainas amarillas', d: 428, r: 152, look: 'Fíjate en el color de las vainas.' },\n      { id: 'posicion', name: 'Posición de la flor', L: 'P', dom: 'Axial', rec: 'Terminal', domL: 'flores axiales', recL: 'flores terminales', d: 651, r: 207, look: 'Fíjate en dónde nacen las flores: a lo largo del tallo o solo en la punta.' },\n      { id: 'tallo', name: 'Longitud del tallo', L: 'T', dom: 'Alto', rec: 'Enano', domL: 'plantas altas', recL: 'plantas enanas', d: 787, r: 277, look: 'Fíjate en la altura de la planta.' }\n    ];\n    this.STEPS = [\n      { title: '1. Partir de líneas puras', text: 'Durante dos años comprobó que cada variedad, al autofecundarse, daba siempre la misma forma del carácter. Así se aseguraba de empezar con líneas puras.' },\n      { title: '2. Quitar los estambres', text: 'En la flor que iba a hacer de madre abría los pétalos antes de tiempo y le quitaba los estambres (la parte masculina), para que no pudiera autofecundarse.' },\n      { title: '3. Polinizar con un pincel', text: 'Con un pincel recogía polen de la planta elegida como padre y lo depositaba en el estigma de la flor madre.' },\n      { title: '4. Proteger y contar', text: 'Protegía la flor para que no llegara polen de otras plantas. Cuando maduraban las vainas, contaba y anotaba cada semilla obtenida.' }\n    ];\n  }\n\n  plantVis(ph) {\n    var tall = ph.tallo !== false, axial = ph.posicion !== false;\n    var G = 150, stemH = tall ? 120 : 52, top = G - stemH;\n    var fc = ph.flor !== false ? '#7B4BB7' : '#FFFFFF';\n    var fb = ph.flor !== false ? '#4B2A75' : '#8A948C';\n    var pc = ph.colorVaina !== false ? '#3F8F3A' : '#E2C23A';\n    var inf = ph.vaina !== false;\n    var nodes = [];\n    if (axial) {\n      (tall ? [0.42, 0.66, 0.9] : [0.55, 0.95]).forEach(function (f, i) { nodes.push({ y: Math.round(G - stemH * f), s: i % 2 ? 1 : -1, t: false }); });\n    } else {\n      nodes = [{ y: top, s: -1, t: true }, { y: top, s: 1, t: true }];\n    }\n    var flowers = [], pods = [];\n    nodes.forEach(function (n) {\n      flowers.push({ x: n.t ? 48 + n.s * 6 - 7 : 48 + n.s * 11 - 7, y: n.t ? top - 14 : n.y - 7, c: fc, b: fb });\n      pods.push({ x: n.s > 0 ? 54 : 16, y: n.t ? top + 6 : n.y + 5, r: n.s > 0 ? 28 : -28, c: pc, inf: inf, con: !inf });\n    });\n    var leaves = [{ x: 24, y: Math.round(G - stemH * 0.22), r: -18 }, { x: 50, y: Math.round(G - stemH * 0.3), r: 18 }];\n    var seedCls = 'pea seed ' + (ph.colorSem !== false ? 'pea-y' : 'pea-g') + (ph.forma !== false ? '' : ' pea-w');\n    return { stemH: stemH, stemTop: top, flowers: flowers, pods: pods, leaves: leaves, seedCls: seedCls };\n  }\n\n  renderVals() {\n    var self = this;\n    var st = this.state;\n    var t = this.TRAITS[st.trait];\n    var phD = {}; phD[t.id] = true;\n    var phR = {}; phR[t.id] = false;\n    var total = t.d + t.r;\n    var domPct = Math.round(t.d / total * 1000) / 10;\n    var step = this.STEPS[st.step];\n    return {\n      traitChips: this.TRAITS.map(function (x, i) {\n        return { name: x.name, on: i === st.trait, cls: i === st.trait ? 'chip on' : 'chip', pick: function () { self.setState({ trait: i }); } };\n      }),\n      cur: { dom: t.dom, rec: t.rec, L: t.L, l: t.L.toLowerCase(), d: t.d.toLocaleString('es-ES'), r: t.r.toLocaleString('es-ES'), domL: t.domL, recL: t.recL, look: t.look },\n      domV: this.plantVis(phD),\n      recV: this.plantVis(phR),\n      ratio: (t.d / t.r).toFixed(2).replace('.', ','),\n      domPct: domPct,\n      recPct: Math.round((100 - domPct) * 10) / 10,\n      barLabel: t.d + ' ' + t.domL + ' frente a ' + t.r + ' ' + t.recL,\n      step: step,\n      stepLabel: (st.step + 1) + ' / ' + this.STEPS.length,\n      noPrev: st.step === 0,\n      noNext: st.step === this.STEPS.length - 1,\n      prev: function () { self.setState({ step: Math.max(0, st.step - 1) }); },\n      next: function () { self.setState({ step: Math.min(self.STEPS.length - 1, st.step + 1) }); },\n      showStamens: st.step < 1,\n      showPollen: st.step >= 2,\n      showBrush: st.step === 2,\n      showBag: st.step === 3\n    };\n  }\n}\nclass Sec_teoria extends SecBase {\n  constructor(props) {\n    super(props);\n    this.state = { concept: 0, law: 0, m: [1, 1, 1], f: [1, 1, 1], tg: ['D', 'D', 'R'] };\n    this.CONCEPTS = [\n      { name: 'Gen', def: 'Fragmento de ADN que contiene la información para un carácter hereditario.', ex: 'el gen del color de la semilla del guisante.', hl: ['A', 'a'] },\n      { name: 'Alelo', def: 'Cada una de las variantes que puede tener un gen.', ex: 'A (amarilla) y a (verde) son dos alelos del gen del color.', hl: ['A'] },\n      { name: 'Locus', def: 'Lugar fijo que ocupa un gen en un cromosoma. En plural, loci.', ex: 'el gen del color siempre está en la misma posición de ese cromosoma.', hl: ['locus'] },\n      { name: 'Cromosomas homólogos', def: 'Pareja de cromosomas con los mismos genes en el mismo orden: uno viene de la madre y otro del padre.', ex: 'por eso tenemos dos alelos de cada gen.', hl: ['homo'] },\n      { name: 'Genotipo', def: 'Conjunto de alelos que tiene un individuo para uno o varios caracteres.', ex: 'Aa LL.', hl: ['geno'] },\n      { name: 'Fenotipo', def: 'Lo que se observa del carácter: depende del genotipo y también del ambiente.', ex: 'semilla amarilla y lisa.', hl: ['pheno'] },\n      { name: 'Homocigoto', def: 'Individuo con los dos alelos iguales para un gen. También se llama raza o línea pura.', ex: 'LL (o ll) para la forma de la semilla.', hl: ['L1', 'L2'] },\n      { name: 'Heterocigoto', def: 'Individuo con dos alelos distintos para un gen. También se llama híbrido.', ex: 'Aa para el color de la semilla.', hl: ['A', 'a'] },\n      { name: 'Dominante', def: 'Alelo que se manifiesta aunque esté acompañado de otro distinto. Se escribe en mayúscula.', ex: 'A: con Aa la semilla ya es amarilla.', hl: ['A'] },\n      { name: 'Recesivo', def: 'Alelo que solo se manifiesta cuando está en doble dosis (homocigosis). Se escribe en minúscula.', ex: 'a: solo las semillas aa son verdes.', hl: ['a'] },\n      { name: 'Gameto', def: 'Célula reproductora (óvulo o polen/espermatozoide). Lleva solo un alelo de cada gen.', ex: 'esta planta Aa LL forma gametos AL y aL.', hl: ['A', 'L1'] }\n    ];\n    this.LAWS = ['1ª ley · Uniformidad', '2ª ley · Segregación', '3ª ley · Independencia'];\n    this.GENES = [\n      { L: 'A', desc: 'Color: A amarilla, a verde' },\n      { L: 'L', desc: 'Forma: L lisa, l rugosa' },\n      { L: 'T', desc: 'Tallo: T alto, t enano' }\n    ];\n  }\n\n  gcd(a, b) { return b ? this.gcd(b, a % b) : a; }\n\n  geno(L, k) { var l = L.toLowerCase(); return k === 2 ? L + L : k === 1 ? L + l : l + l; }\n\n  peaCls(domColor, domShape) { return 'pea ' + (domColor ? 'pea-y' : 'pea-g') + (domShape ? '' : ' pea-w'); }\n\n  renderVals() {\n    var self = this, st = this.state;\n    var c = this.CONCEPTS[st.concept];\n    var hlKeys = ['A', 'a', 'L1', 'L2', 'homo', 'geno', 'pheno'];\n    var hl = {};\n    hlKeys.forEach(function (k) { hl[k] = c.hl.indexOf(k) >= 0 ? 'hl' : ''; });\n\n    var p2 = [{ cls: 'pc ph', txt: '♀ \\\\ ♂' }, { cls: 'pc ph', txt: 'A' }, { cls: 'pc ph', txt: 'a' }];\n    ['A', 'a'].forEach(function (r) {\n      p2.push({ cls: 'pc ph', txt: r });\n      ['A', 'a'].forEach(function (col) {\n        var g = (r === 'A' || col === 'A') ? (r === 'A' && col === 'A' ? 'AA' : 'Aa') : 'aa';\n        p2.push({ cls: 'pc', txt: g, pea: true, peaCls: self.peaCls(g !== 'aa', true) });\n      });\n    });\n\n    var gam = ['AL', 'Al', 'aL', 'al'];\n    var p3 = [{ cls: 'pc ph', txt: '' }];\n    gam.forEach(function (g) { p3.push({ cls: 'pc ph', txt: g }); });\n    gam.forEach(function (r) {\n      p3.push({ cls: 'pc ph', txt: r });\n      gam.forEach(function (col) {\n        var a = [r[0], col[0]].sort().join('');\n        var l = [r[1], col[1]].sort().join('');\n        var dA = a.indexOf('A') >= 0, dL = l.indexOf('L') >= 0;\n        p3.push({ cls: 'pc', txt: a + l, pea: true, peaCls: self.peaCls(dA, dL) });\n      });\n    });\n\n    var probs = [], num = 1, den = 1, exprParts = [];\n    var calcRows = this.GENES.map(function (g, i) {\n      var km = st.m[i], kf = st.f[i];\n      var pm = km / 2, pf = kf / 2;\n      var pRec = (1 - pm) * (1 - pf);\n      var n4, d4 = 4;\n      if (st.tg[i] === 'D') n4 = Math.round((1 - pRec) * 4);\n      else if (st.tg[i] === 'R') n4 = Math.round(pRec * 4);\n      else { n4 = 4; }\n      var pTxt;\n      if (st.tg[i] === 'X') pTxt = '1 (da igual)';\n      else { var gg = self.gcd(n4, d4) || 1; pTxt = (n4 === 0 ? '0' : (n4 / gg) + '/' + (d4 / gg)); num *= n4; den *= d4; exprParts.push(pTxt); }\n      function opts(arr, key) {\n        return [2, 1, 0].map(function (k) {\n          return { txt: self.geno(g.L, k), on: arr[i] === k, cls: arr[i] === k ? 'chip mono on' : 'chip mono', pick: function () { var n = st[key].slice(); n[i] = k; var o = {}; o[key] = n; self.setState(o); } };\n        });\n      }\n      var tgts = [['D', 'Dominante'], ['R', 'Recesivo'], ['X', 'Me da igual']].map(function (t) {\n        return { txt: t[1], on: st.tg[i] === t[0], cls: st.tg[i] === t[0] ? 'chip on' : 'chip', pick: function () { var n = st.tg.slice(); n[i] = t[0]; self.setState({ tg: n }); } };\n      });\n      return { L: g.L, desc: g.desc, m: opts(st.m, 'm'), f: opts(st.f, 'f'), t: tgts, p: pTxt };\n    });\n    var calcRes, calcExpr;\n    if (exprParts.length === 0) { calcRes = '1'; calcExpr = 'No has elegido ninguna condición'; }\n    else if (num === 0) { calcRes = '0'; calcExpr = exprParts.join(' × ') + ' = imposible'; }\n    else { var G = this.gcd(num, den); calcRes = (num / G) + '/' + (den / G) + ' ≈ ' + (num / den * 100).toFixed(1).replace('.', ',') + ' %'; calcExpr = 'P = ' + exprParts.join(' × '); }\n\n    return {\n      concepts: this.CONCEPTS.map(function (x, i) { return { name: x.name, on: i === st.concept, cls: i === st.concept ? 'chip on' : 'chip', pick: function () { self.setState({ concept: i }); } }; }),\n      cc: c,\n      hl: hl,\n      showLocus: c.hl.indexOf('locus') >= 0,\n      laws: this.LAWS.map(function (x, i) { return { name: x, on: i === st.law, cls: i === st.law ? 'chip on' : 'chip', pick: function () { self.setState({ law: i }); } }; }),\n      law0: st.law === 0, law1: st.law === 1, law2: st.law === 2,\n      p2cells: p2,\n      p3cells: p3,\n      calcRows: calcRows,\n      calcRes: calcRes,\n      calcExpr: calcExpr
