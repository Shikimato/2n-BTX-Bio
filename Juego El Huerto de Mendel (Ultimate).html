<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El huerto de Mendel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0f0c09}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0}

body{margin:0;background:#1f1a14}
a{color:#f2c94c}a:hover{color:#fff1a8}
.ps{font-family:'Press Start 2P',monospace}
.px{box-shadow:-4px 0 0 0 #0f0c09,4px 0 0 0 #0f0c09,0 -4px 0 0 #0f0c09,0 4px 0 0 #0f0c09}
.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.btn{font-family:'Press Start 2P',monospace;border:0;cursor:pointer;box-shadow:-4px 0 0 0 #0f0c09,4px 0 0 0 #0f0c09,0 -4px 0 0 #0f0c09,0 4px 0 0 #0f0c09,inset -4px -4px 0 0 rgba(0,0,0,.28),inset 4px 4px 0 0 rgba(255,255,255,.18)}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px)}
.btn:focus-visible{outline:4px solid #fff1a8;outline-offset:6px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.tbtn{font-family:'VT323',monospace;border:0;cursor:pointer;background:transparent;padding:4px 8px}
.tbtn:hover{background:#3a3128}
.tbtn:focus-visible{outline:3px solid #fff1a8}
.plot{border:0;cursor:pointer;padding:0}
.plot:hover{filter:brightness(1.12)}
.plot:focus-visible{outline:4px solid #fff1a8 !important;outline-offset:4px}
.plot:disabled{cursor:default;filter:none}
.arena{position:absolute;left:0;top:0;width:1280px;height:736px;background:transparent;border:0;padding:0;cursor:crosshair}
.arena:focus{outline:none}
.arena:focus-visible{outline:4px solid rgba(255,241,168,.35);outline-offset:-4px}
input[type=number]{-moz-appearance:textfield}
input:focus{outline:4px solid #c9932a;outline-offset:2px}

</style>
</head>
<body>
<div id="stage"></div>
<template id="tpl">
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #1f1a14; color: #f4efe1; font-family: 'VT323', monospace; font-size: 22px; line-height: 1.15">

<sc-if value="{{isTitle}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; width: 1280px; height: 800px; background: #9ccbe0; overflow: hidden">
  <div style="position: absolute; left: 0; top: 0; width: 1280px; height: 110px; background: #b9def0"></div>
  <div style="position: absolute; left: 0; top: 110px; width: 1280px; height: 70px; background: #abd5ea"></div>
  <img class="pix" src="{{sp.sol}}" alt="" style="position: absolute; right: 90px; top: 90px; width: 112px; height: 112px">
  <img class="pix" src="{{sp.nube}}" alt="" style="position: absolute; left: 860px; top: 150px; width: 96px; height: 96px">
  <div style="position: absolute; left: 0; top: 470px; width: 1280px; height: 30px; background: #7aa94c"></div>
  <div style="position: absolute; left: 0; top: 500px; width: 1280px; height: 300px; background: #5b8f3b"></div>
  <img class="pix" src="{{sp.monasterio}}" alt="Abadía de Santo Tomás" style="position: absolute; left: 700px; top: 290px; width: 480px; height: 260px">
  <div style="position: absolute; left: 0; top: 640px; width: 1280px; height: 160px; background: #6b4528"></div>
  <div style="position: absolute; left: 0; top: 640px; width: 1280px; height: 12px; background: #4f321c"></div>
  <div style="position: absolute; left: 30px; top: 520px; display: flex; gap: 18px; align-items: flex-end">
    <sc-for list="{{titlePlants}}" as="tp" hint-placeholder-count="14">
      <img class="pix" src="{{tp.src}}" alt="" style="width: 64px; height: 96px; margin-top: 30px">
    </sc-for>
  </div>

  <div style="position: absolute; right: 32px; top: 24px; display: flex; gap: 14px">
    <button class="btn" onClick="{{toggleSound}}" style="font-size: 9px; padding: 10px 12px; background: #f4efe1; color: #241811">{{soundLabel}}</button>
    <button class="btn" onClick="{{toggleMusic}}" style="font-size: 9px; padding: 10px 12px; background: #f4efe1; color: #241811">{{musicLabel}}</button>
    <button class="btn" onClick="{{openHistoryTitle}}" style="font-size: 9px; padding: 10px 12px; background: #e9d39a; color: #241811">HISTORIA</button>
  </div>

  <div style="position: absolute; left: 60px; top: 56px; width: 760px">
    <div class="ps" style="font-size: 44px; line-height: 1.25; color: #f2c94c; text-shadow: 4px 4px 0 #241811, -2px -2px 0 #241811, 2px -2px 0 #241811, -2px 2px 0 #241811">EL HUERTO<br>DE MENDEL</div>
    <div style="margin-top: 18px; font-size: 30px; color: #241811">Simulador de experimentos con guisantes · Abadía de Santo Tomás, Brno, 1856</div>
  </div>

  <div style="position: absolute; left: 60px; top: 300px; display: flex; gap: 24px; align-items: flex-end">
    <img class="pix" src="{{sp.mendel}}" alt="Gregor Mendel" style="width: 112px; height: 168px">
    <div class="px" style="width: 520px; background: #f4efe1; color: #241811; padding: 16px 20px; font-size: 26px; margin-bottom: 40px">
      <div class="ps" style="font-size: 11px; color: #8a5e33; margin-bottom: 8px">FRAY GREGOR</div>
      Este verano vamos a cruzar guisantes y a contar, contar y contar. Si los números cuadran, habremos descubierto cómo se heredan los caracteres. ¿Cómo quieres trabajar?
    </div>
  </div>

  <div style="position: absolute; left: 60px; top: 676px; display: flex; gap: 28px">
    <button class="btn" onClick="{{pickFacil}}" style="width: 360px; height: 96px; background: #8cc152; color: #241811; text-align: left; padding: 14px 18px">
      <div style="font-size: 17px">ASEQUIBLE</div>
      <div style="font-family: 'VT323', monospace; font-size: 23px; margin-top: 10px">Siembra, cruza, cuenta y apunta.</div>
    </button>
    <button class="btn" onClick="{{pickReal}}" style="width: 380px; height: 96px; background: #f2c94c; color: #241811; text-align: left; padding: 14px 18px">
      <div style="font-size: 17px">REALISTA</div>
      <div style="font-family: 'VT323', monospace; font-size: 23px; margin-top: 10px">Riega, poda, sulfata y emascula.</div>
    </button>
    <button class="btn" onClick="{{openFriki}}" style="width: 340px; height: 96px; background: #9b6bc7; color: #fff; text-align: left; padding: 14px 18px">
      <div style="font-size: 17px">FRIKI</div>
      <div style="font-family: 'VT323', monospace; font-size: 23px; margin-top: 10px">¡Arcade! Frena la plaga de pulgones.</div>
    </button>
  </div>
</div>
</sc-if>

<sc-if value="{{notTitle}}" hint-placeholder-val="{{ false }}">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; background: #2e261d; border-bottom: 4px solid #0f0c09; box-sizing: border-box">
  <div style="display: flex; align-items: center; gap: 10px">
    <img class="pix" src="{{sp.peaY}}" alt="" style="width: 28px; height: 28px">
    <div class="ps" style="font-size: 11px; color: #f2c94c">EL HUERTO DE MENDEL</div>
  </div>
  <nav style="display: flex; gap: 4px" aria-label="Fases">
    <sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
      <div class="ps" style="font-size: 9px; padding: 9px 8px; background: {{st.bg}}; color: {{st.fg}}">{{st.label}}</div>
    </sc-for>
  </nav>
  <div style="display: flex; align-items: center; gap: 8px">
    <div class="ps" style="font-size: 9px; padding: 8px 8px; background: {{modeBg}}; color: #241811">{{modeLabel}}</div>
    <div style="font-size: 21px; color: #c8bba0; padding: 0 4px">Logros {{badgeCount}}/{{badgeTotal}}</div>
    <button class="tbtn" onClick="{{toggleSound}}" style="font-size: 21px; color: #f4efe1">{{soundLabelLow}}</button>
    <button class="tbtn" onClick="{{toggleMusic}}" style="font-size: 21px; color: #f4efe1">{{musicLabelLow}}</button>
    <button class="btn" onClick="{{goMenu}}" style="font-size: 9px; padding: 10px 10px; background: #5a4a38; color: #f4efe1">MENÚ</button>
  </div>
</header>
</sc-if>

<sc-if value="{{isLab}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; gap: 28px; padding: 24px 28px; box-sizing: border-box; min-height: 0">
  <aside style="width: 290px; flex-shrink: 0; display: flex; flex-direction: column; gap: 18px">
    <img class="pix" src="{{sp.mendel}}" alt="Gregor Mendel" style="width: 96px; height: 144px">
    <div class="px" style="background: #f4efe1; color: #241811; padding: 16px; font-size: 23px">
      <div class="ps" style="font-size: 10px; color: #8a5e33; margin-bottom: 8px">FRAY GREGOR</div>
      {{labTip}}
    </div>
    <div style="font-size: 21px; color: #a89a80">Experimento nº {{expNo}} · temporada de {{year}}</div>
  </aside>
  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0">
    <div class="ps" style="font-size: 12px; color: #f2c94c">1. ¿QUÉ CARÁCTER VAS A ESTUDIAR?</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px">
      <sc-for list="{{expCards}}" as="ec" hint-placeholder-count="3">
        <button class="btn" onClick="{{ec.pick}}" style="background: {{ec.bg}}; color: {{ec.fg}}; padding: 12px 14px; text-align: left; height: 116px; display: flex; flex-direction: column; gap: 9px">
          <div style="display: flex; gap: 8px">
            <sc-for list="{{ec.peas}}" as="pe" hint-placeholder-count="2">
              <img class="pix" src="{{pe.src}}" alt="" style="width: 28px; height: 28px">
            </sc-for>
          </div>
          <div style="font-size: 11px; line-height: 1.5">{{ec.name}}</div>
          <div style="font-family: 'VT323', monospace; font-size: 21px">{{ec.desc}}</div>
        </button>
      </sc-for>
    </div>
    <div class="ps" style="font-size: 12px; color: #f2c94c; margin-top: 6px">2. ¿QUÉ CRUCE?</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px">
      <sc-for list="{{crossCards}}" as="cc" hint-placeholder-count="4">
        <button class="btn" onClick="{{cc.pick}}" style="background: {{cc.bg}}; color: {{cc.fg}}; padding: 12px 14px; text-align: left; height: 124px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 10px; line-height: 1.4">
            <sc-if value="{{cc.mystery}}" hint-placeholder-val="{{ false }}"><img class="pix" src="{{sp.lupa}}" alt="" style="width: 22px; height: 22px"></sc-if>
            {{cc.name}}
          </div>
          <div style="font-family: 'VT323', monospace; font-size: 20px">{{cc.desc}}</div>
        </button>
      </sc-for>
    </div>
    <sc-if value="{{isMystery}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 16px">
        <div class="ps" style="font-size: 10px; color: #c8bba0">¿CÓMO LA PONES A PRUEBA?</div>
        <sc-for list="{{testButtons}}" as="tb" hint-placeholder-count="2">
          <button class="btn" onClick="{{tb.pick}}" style="font-size: 10px; padding: 10px 12px; background: {{tb.bg}}; color: {{tb.fg}}">{{tb.label}}</button>
        </sc-for>
      </div>
    </sc-if>
    <div class="px" style="margin-top: 6px; background: #2e261d; padding: 14px 18px; display: flex; align-items: center; gap: 20px">
      <div style="display: flex; align-items: center; gap: 12px">
        <img class="pix" src="{{mother.src}}" alt="" style="width: 40px; height: 40px">
        <div>
          <div class="ps" style="font-size: 9px; color: #a89a80">MADRE</div>
          <div style="font-size: 23px">{{mother.name}}</div>
          <div style="font-size: 20px; color: #f2c94c">{{mother.geno}}</div>
        </div>
      </div>
      <div class="ps" style="font-size: 18px; color: #a89a80">×</div>
      <div style="display: flex; align-items: center; gap: 12px">
        <img class="pix" src="{{father.src}}" alt="" style="width: 40px; height: 40px">
        <div>
          <div class="ps" style="font-size: 9px; color: #a89a80">PADRE (POLEN)</div>
          <div style="font-size: 23px">{{father.name}}</div>
          <div style="font-size: 20px; color: #f2c94c">{{father.geno}}</div>
        </div>
      </div>
      <div style="flex: 1; font-size: 20px; color: #c8bba0">{{crossNote}}</div>
      <button class="btn" onClick="{{startGarden}}" style="font-size: 12px; padding: 18px 18px; background: #8cc152; color: #241811">SEMBRAR →</button>
    </div>
  </main>
</div>
</sc-if>

<sc-if value="{{isGarden}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; gap: 20px; padding: 20px; box-sizing: border-box; min-height: 0; position: relative">
  <aside class="px" style="width: 290px; flex-shrink: 0; background: #2e261d; padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <div class="ps" style="font-size: 11px; color: #f2c94c; line-height: 1.6">{{calendar}}</div>
    <div style="display: flex; align-items: center; gap: 12px">
      <img class="pix" src="{{weather.src}}" alt="" style="width: 44px; height: 44px">
      <div style="font-size: 26px">{{weather.label}}</div>
      <sc-if value="{{isReal}}" hint-placeholder-val="{{ true }}">
        <div style="margin-left: auto; text-align: right">
          <div class="ps" style="font-size: 8px; color: #a89a80">JORNADAS</div>
          <div style="font-size: 30px; color: #f2c94c">{{ap}}</div>
        </div>
      </sc-if>
    </div>
    <sc-if value="{{hasAdvice}}" hint-placeholder-val="{{ true }}">
      <div style="background: #f4efe1; color: #241811; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px">
          <img class="pix" src="{{sp.mendel}}" alt="" style="width: 20px; height: 30px">
          <div class="ps" style="font-size: 8px; color: #8a5e33">CONSEJO DE FRAY GREGOR</div>
        </div>
        <div style="font-size: 21px">{{advice.t}}</div>
        <sc-if value="{{advice.hasTool}}" hint-placeholder-val="{{ true }}">
          <button class="btn" onClick="{{advice.use}}" style="align-self: flex-start; font-size: 8px; padding: 8px 10px; background: #f2c94c; color: #241811">COGER {{advice.toolName}}</button>
        </sc-if>
      </div>
      <div style="display: flex; gap: 10px">
        <button class="btn" onClick="{{openGuide}}" style="flex: 1; font-size: 8px; padding: 10px 6px; background: #5a4a38; color: #f4efe1">GUÍA</button>
        <button class="btn" onClick="{{toggleHints}}" style="flex: 1; font-size: 8px; padding: 10px 6px; background: #5a4a38; color: #f4efe1">{{hintsLabel}}</button>
      </div>
    </sc-if>
    <sc-if value="{{isFacil}}" hint-placeholder-val="{{ false }}">
      <div style="font-size: 21px; color: #c8bba0">Pulsa «Pasar semana» y mira cómo crecen. En la semana 4 florecen y harás el cruce.</div>
    </sc-if>
    <div class="ps" style="font-size: 8px; color: #a89a80">DIARIO DEL HUERTO</div>
    <div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 20px">
      <sc-for list="{{log}}" as="lg" hint-placeholder-count="5">
        <div style="display: flex; gap: 8px; align-items: flex-start; color: {{lg.col}}">
          <sc-if value="{{lg.hasSrc}}" hint-placeholder-val="{{ false }}"><img class="pix" src="{{lg.src}}" alt="" style="width: 24px; height: 24px; flex-shrink: 0"></sc-if>
          <div>{{lg.t}}</div>
        </div>
      </sc-for>
    </div>
  </aside>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0">
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px">
      <sc-for list="{{plots}}" as="p" hint-placeholder-count="12">
        <button class="plot px" onClick="{{p.click}}" disabled="{{p.disabled}}" aria-label="{{p.aria}}" style="height: 262px; background: #33452a; color: #f4efe1; display: flex; flex-direction: column; opacity: {{p.op}}; font-family: 'VT323', monospace; outline: 4px solid {{p.ring}}; outline-offset: 4px">
          <div style="height: 30px; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; box-sizing: border-box">
            <div class="ps" style="font-size: 9px; color: #c8bba0">{{p.label}}</div>
            <div style="display: flex; gap: 2px">
              <sc-for list="{{p.icons}}" as="ic" hint-placeholder-count="1">
                <img class="pix" src="{{ic.src}}" alt="{{ic.tip}}" title="{{ic.tip}}" style="width: 22px; height: 22px">
              </sc-for>
            </div>
          </div>
          <div style="flex: 1; width: 100%; position: relative; display: flex; align-items: flex-end; justify-content: center">
            <sc-if value="{{p.staked}}" hint-placeholder-val="{{ false }}">
              <img class="pix" src="{{sp.tutor}}" alt="" style="position: absolute; left: 14px; bottom: 26px; width: 48px; height: 128px">
            </sc-if>
            <img class="pix" src="{{p.src}}" alt="" style="position: relative; width: 80px; height: 120px; margin-bottom: 22px">
            <div style="position: absolute; left: 0; bottom: 0; width: 100%; height: 26px; background: #6b4528; border-top: 4px solid #4f321c; box-sizing: border-box"></div>
          </div>
          <sc-if value="{{p.real}}" hint-placeholder-val="{{ true }}">
            <div style="width: 100%; padding: 6px 8px 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; text-align: left">
              <div style="display: flex; align-items: center; gap: 6px; font-size: 16px">
                <div style="width: 38px">agua</div>
                <div style="flex: 1; height: 8px; background: #1f1a14"><div style="height: 8px; width: {{p.water}}; background: #4fa3d9"></div></div>
              </div>
              <div style="display: flex; align-items: center; gap: 6px; font-size: 16px">
                <div style="width: 38px">salud</div>
                <div style="flex: 1; height: 8px; background: #1f1a14"><div style="height: 8px; width: {{p.health}}; background: {{p.hcol}}"></div></div>
              </div>
            </div>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <div style="flex: 1; display: flex; align-items: center; gap: 12px">
      <sc-if value="{{isReal}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; gap: 12px; flex: 1">
          <sc-for list="{{tools}}" as="tl" hint-placeholder-count="5">
            <button class="btn" onClick="{{tl.pick}}" title="{{tl.desc}}" style="flex: 1; height: 92px; background: {{tl.bg}}; color: {{tl.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 6px">
              <img class="pix" src="{{tl.src}}" alt="" style="width: 40px; height: 40px">
              <div style="font-size: 9px">{{tl.label}}</div>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{isFacil}}" hint-placeholder-val="{{ false }}">
        <div style="flex: 1; font-size: 24px; color: #c8bba0">{{facilBar}}</div>
      </sc-if>
      <sc-if value="{{canPass}}" hint-placeholder-val="{{ true }}">
        <button class="btn" onClick="{{passWeek}}" style="width: 230px; height: 92px; font-size: 13px; line-height: 1.6; background: #f2c94c; color: #241811">PASAR<br>SEMANA →</button>
      </sc-if>
      <sc-if value="{{harvestReady}}" hint-placeholder-val="{{ false }}">
        <button class="btn" onClick="{{goHarvest}}" style="width: 230px; height: 92px; font-size: 13px; background: #8cc152; color: #241811">COSECHAR →</button>
      </sc-if>
    </div>
  </main>

  <sc-if value="{{needPoll}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(15, 12, 9, 0.72); display: flex; align-items: center; justify-content: center">
      <div class="px" style="width: 720px; background: #f4efe1; color: #241811; padding: 28px 32px; display: flex; gap: 24px">
        <img class="pix" src="{{sp.flor}}" alt="" style="width: 96px; height: 144px; flex-shrink: 0">
        <div style="display: flex; flex-direction: column; gap: 14px; flex: 1">
          <div class="ps" style="font-size: 16px; color: #8a5e33">¡FLORACIÓN!</div>
          <div style="font-size: 25px">{{poll.text}}</div>
          <sc-if value="{{poll.isSelf}}" hint-placeholder-val="{{ false }}">
            <button class="btn" onClick="{{pollSelf}}" style="align-self: flex-start; font-size: 12px; padding: 16px 18px; background: #8cc152; color: #241811">ENTENDIDO</button>
          </sc-if>
          <sc-if value="{{poll.isEasy}}" hint-placeholder-val="{{ false }}">
            <button class="btn" onClick="{{pollEasy}}" style="align-self: flex-start; font-size: 12px; padding: 16px 18px; background: #8cc152; color: #241811; display: flex; align-items: center; gap: 12px"><img class="pix" src="{{sp.pincel}}" alt="" style="width: 32px; height: 32px">CRUZAR LAS FLORES</button>
          </sc-if>
          <sc-if value="{{poll.isReal}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 14px">
              <button class="btn" onClick="{{emasculate}}" disabled="{{poll.emascDone}}" style="font-size: 11px; padding: 14px 16px; background: #e9d39a; color: #241811; display: flex; align-items: center; gap: 12px; text-align: left"><img class="pix" src="{{sp.tijeras}}" alt="" style="width: 32px; height: 32px">1. QUITAR ESTAMBRES (2 JORNADAS)</button>
              <button class="btn" onClick="{{pollinate}}" style="font-size: 11px; padding: 14px 16px; background: #8cc152; color: #241811; display: flex; align-items: center; gap: 12px; text-align: left"><img class="pix" src="{{sp.pincel}}" alt="" style="width: 32px; height: 32px">2. POLINIZAR CON EL PINCEL</button>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </sc-if>

(function(){
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function look(path, scope){
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);

    for (let i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }

      const t = node.nodeValue; if (!t.trim()) return;

    }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-if') {
      const m = (node.getAttribute('value') || '').match(WHOLE);
      if (m && look(m[1], scope)) for (const c of node.childNodes) build(c, scope, out);
      return;
    }
    if (tag === 'sc-for') {
      const m = (node.getAttribute('list') || '').match(WHOLE); const as = node.getAttribute('as') || 'item';
      const list = m ? look(m[1], scope) : null;
      if (Array.isArray(list)) list.forEach((it, i) => { const s = Object.create(scope); s[as] = it; s.$index = i; for (const c of node.childNodes) build(c, s, out); });
      return;
    }
    const p = {};
    for (const a of node.attributes) {
      let n = a.name; if (n.indexOf('hint-') === 0) continue;
      const m = a.value.match(WHOLE);
      const v = m ? look(m[1], scope) : (a.value.indexOf('{{') >= 0 ? interp(a.value, scope) : a.value);
      if (n === 'onchange' && tag === 'input') n = 'oninput';
      p[n] = v;
    }
    const kids = []; for (const c of node.childNodes) build(c, scope, kids);
    out.push({ t: tag, p, c: kids, svg: node.namespaceURI === 'http://www.w3.org/2000/svg' });
  }
  function setProp(el, n, v, old){
    if (n.indexOf('on') === 0) {
      const ev = n.slice(2); el._l = el._l || {};
      if (!(ev in el._l)) el.addEventListener(ev, (e) => { const f = el._l[ev]; if (typeof f === 'function') f(e); });
      el._l[ev] = v; return;
    }
    if (n === 'ref') { if (typeof v === 'function' && !el._ref) { el._ref = 1; v(el); } return; }
    if (n === 'style') { if (v !== old) el.style.cssText = v || ''; return; }
    if (n === 'value') { const s = v == null ? '' : String(v); if (el.value !== s) el.value = s; return; }
    if (n === 'disabled' || n === 'checked') { el[n] = !!v && v !== 'false'; return; }
    if (v === old) return;
    if (v == null || v === false) el.removeAttribute(n); else el.setAttribute(n, v === true ? '' : v);
  }
  function mount(v){
    if (v.text != null) { v.el = document.createTextNode(v.text); return v.el; }
    const el = v.svg ? document.createElementNS('http://www.w3.org/2000/svg', v.t) : document.createElement(v.t);
    for (const n in v.p) setProp(el, n, v.p[n], undefined);
    for (const c of v.c) el.appendChild(mount(c));
    v.el = el; return el;
  }
  function patch(parent, o, n){
    if (!o) { parent.appendChild(mount(n)); return; }
    if ((o.text != null) !== (n.text != null) || o.t !== n.t) { parent.replaceChild(mount(n), o.el); return; }
    n.el = o.el;
    if (n.text != null) { if (o.text !== n.text) o.el.nodeValue = n.text; return; }

    const L = Math.max(o.c.length, n.c.length);
    for (let i = 0; i < L; i++) {

      patch(n.el, o.c[i], n.c[i]);
    }
  }

  function render(){
    queued = false;
    const out = []; const vals = comp.renderVals();
    for (const c of tplRoot.childNodes) build(c, vals, out);
    const root = { t: 'div', p: {}, c: out };

    forceUpdate(){ if (!queued) { queued = true; Promise.resolve().then(render); } } };

  ac() {

      if (!this._ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this._ac = new A(); }

  }
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  tone(f, d, type, vol, t) {
    const ac = this.ac(); if (!ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  }
  sfx(name, vol) {
    if (!this.state.sound) return;
    const ac = this.ac(); if (!ac) return;
    let t = ac.currentTime + 0.01;
    (this.SFX[name] || []).forEach(([m, d, type]) => { this.tone(this.hz(m), d, type || 'square', vol || 0.05, t); t += d; });
  }
  startMusic() {
    const ac = this.ac(); if (!ac) return;
    this.stopMusic();
    let step = 0;
    this._mi = setInterval(() => {
      const t = ac.currentTime + 0.02;
      const m = this.MELODY[step % this.MELODY.length];
      if (m) this.tone(this.hz(m), 0.14, 'square', 0.022, t);
      if (step % 4 === 0) this.tone(this.hz(this.BASS[Math.floor(step / 4) % this.BASS.length]), 0.55, 'triangle', 0.05, t);
      step++;
    }, 170);
  }
  stopMusic() { clearInterval(this._mi); this._mi = null; }

  cat(pairs) {
    const dom = pairs.map((p) => p !== p.toLowerCase());

  gametes(pairs) {
    if (pairs.length === 1) return [pairs[0][0], pairs[0][1]];
    const out = [];

  norm(a, b) {
    if (a === a.toUpperCase()) return a + b;
    if (b === b.toUpperCase()) return b + a;

  chi(obs, r) {
    const n = obs.reduce((a, b) => a + b, 0);
    const R = r.reduce((a, b) => a + b, 0);
    const exp = r.map((x) => n * x / R);
    let chi = 0, df = -1, ok = true;
    exp.forEach((e, i) => {
      if (e === 0) { if (obs[i] > 0) ok = false; }
      else { df++; chi += Math.pow(obs[i] - e, 2) / e; }
    });
    const crit = { 0: 0, 1: 3.841, 2: 5.991, 3: 7.815 }[df];
    if (!ok) return { chi: Infinity, df, crit, pass: false, exp };
    return { chi, df, crit, pass: df === 0 ? true : chi <= crit, exp };
  }

  rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  pick(list) {
    const tot = list.reduce((a, x) => a + x[1], 0);
    let r = Math.random() * tot;
    for (const x of list) { r -= x[1]; if (r <= 0) return x[0]; }
    return list[0][0];
  }
  fmt(x, d) { return isFinite(x) ? x.toFixed(d).replace('.', ',') : '∞'; }
  year() { return Math.min(1855 + this.state.expNo, 1863); }

  ratioText(exp, obs) {
    const n = obs.reduce((a, b) => a + b, 0);
    if (!n) return '–';
    if (exp === 'dihib') return obs.map((v) => this.fmt(v / n * 16, 1)).join(' : ') + ' (sobre 16)';
    if (obs[1] === 0) return 'todas dominantes';
    return this.fmt(obs[0] / obs[1], 2) + ' : 1';
  }

  toast(msg) {
    this.setState({ flash: msg });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ flash: '' }), 2600);
  }

  award(badges, id) {
    if (badges[id]) return null;
    badges[id] = true;
    const b = this.BADGES.find((x) => x[0] === id);
    return b ? b[1] : id;
  }

  needPoll() { return this.state.screen === 'garden' && this.state.week >= 4 && !this.state.pollinated; }

  // ---------- navegación ----------
  chooseMode = (m) => { this.sfx('click'); this.setState({ mode: m, screen: 'lab' }); };
  goMenu = () => { this.sfx('click'); clearInterval(this._ri); clearInterval(this._gl); this.g = null; this.setState(this.fresh(this.state)); };

  // ---------- modo friki ----------
  openFriki = () => { this.sfx('click'); clearInterval(this._gl); this.g = null; this.setState({ screen: 'friki' }); };
  setArena = (el) => { this._arena = el; };

  fkStart = () => {
    clearInterval(this._gl);
    const plantsX = [0, 1, 2, 3, 4, 5].map((i) => Math.round(1280 / 7 * (i + 1)) - 32);
    this.g = {
      f: 0, score: 0, wave: 0, lives: 3, mx: 616, tx: 616, keys: {}, bullets: [], aphids: [], drops: [], pows: [], booms: [],
      plants: plantsX.map((x) => ({ x, hp: 3 })), triple: 0, inv: 0, banner: null, bannerT: 0, over: false, paused: false, cool: 0, diveT: 70
    };
    this.fkWave();
    this.sfx('win');
    this.setState({ screen: 'friki', fkTick: 0 });
    this._gl = setInterval(this.fkTick, 33);
    setTimeout(() => { try { if (this._arena) this._arena.focus(); } catch (e) {} }, 60);
  };

  fkWave() {
    const g = this.g;
    g.wave++;
    const rows = Math.min(5, 2 + Math.ceil(g.wave / 2)), cols = 8;
    g.aphids = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const left = c < 4;
      g.aphids.push({
        sx: 640 - 24 - (cols - 1) * 45 + c * 90, sy: 70 + r * 58,
        x: left ? -80 : 1360, y: -60, ex: left ? -80 : 1360, ey: -60, side: left ? 1 : -1,
        st: 'enter', t: -(r * 8 + (left ? 3 - c : c - 4) * 4) / 40,
        red: g.wave >= 2 && r === 0 || (g.wave >= 4 && r === 1), hp: 1, vy: 0, tx: 0, ph: 0
      });
    }
    g.aphids.forEach((a) => { if (a.red) a.hp = 2; });
    g.banner = { title: 'OLEADA ' + g.wave, text: this.FACTS[(g.wave - 1) % this.FACTS.length] };
    g.bannerT = 110;
    g.diveT = 90;
    if (g.wave === 5) {
      const badges = Object.assign({}, this.state.badges);
      const got = this.award(badges, 'friki');
      if (got) { this.setState({ badges }); this.toast('¡Logro: ' + got + '!'); this.sfx('badge'); }
    }
  }

  fkPause = () => {
    const g = this.g; if (!g || g.over) return;
    g.paused = !g.paused;
    this.sfx('click');
    this.setState({ fkTick: g.f + 0.5 });
    if (!g.paused) setTimeout(() => { try { if (this._arena) this._arena.focus(); } catch (e) {} }, 30);
  };

  arenaMove = (e) => {
    const g = this.g; if (!g) return;
    const r = e.currentTarget.getBoundingClientRect();
    if (!r.width) return;
    g.tx = (e.clientX - r.left) / r.width * 1280 - 24;
  };
  arenaKeyDown = (e) => {
    const g = this.g; if (!g) return;
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { g.keys.l = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { g.keys.r = true; e.preventDefault(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { e.preventDefault(); this.fkPause(); }
    else if (k === ' ' || k === 'Enter') e.preventDefault();
  };
  arenaKeyUp = (e) => {
    const g = this.g; if (!g) return;
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') g.keys.l = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') g.keys.r = false;
  };

  fkTick = () => {
    const g = this.g;
    if (!g || g.over || g.paused || this.state.screen !== 'friki') return;
    g.f++;
    const hit = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    const MY = 618;

    // Mendel
    if (g.keys.l || g.keys.r) { g.mx += ((g.keys.r ? 1 : 0) - (g.keys.l ? 1 : 0)) * 16; g.tx = g.mx; }
    else g.mx += Math.max(-18, Math.min(18, g.tx - g.mx));
    g.mx = Math.max(0, Math.min(1232, g.mx));
    if (g.inv > 0) g.inv--;
    if (g.triple > 0) g.triple--;

    // disparo automático
    if (--g.cool <= 0) {
      const vx = g.triple > 0 ? [-5, 0, 5] : [0];
      vx.forEach((v) => g.bullets.push({ x: g.mx + 15, y: MY - 10, vx: v }));
      g.cool = 5;
      if (g.f % 2 === 0) this.sfx('shot', 0.015);
    }
    g.bullets.forEach((b) => { b.y -= 22; b.x += b.vx; });
    g.bullets = g.bullets.filter((b) => b.y > -30 && b.x > -30 && b.x < 1300);

    // pulgones
    const off = Math.sin(g.f / 30) * 50;
    const bob = Math.sin(g.f / 8) * 4;
    const alivePlants = g.plants.filter((p) => p.hp > 0);
    g.aphids.forEach((a) => {
      if (a.st === 'enter') {
        a.t += 1 / 40;
        if (a.t < 0) { a.x = a.ex; a.y = a.ey; return; }
        const t = Math.min(1, a.t);
        a.x = a.ex + (a.sx + off - a.ex) * t + Math.sin(t * Math.PI) * 140 * a.side;
        a.y = a.ey + (a.sy - a.ey) * t;
        if (a.t >= 1) a.st = 'form';
      } else if (a.st === 'form') {
        a.x = a.sx + off; a.y = a.sy + bob;
      } else if (a.st === 'dive') {
        a.ph += 0.18;
        a.x += Math.max(-9, Math.min(9, (a.tx - a.x) * 0.06)) + Math.sin(a.ph) * 4;
        a.y += a.vy;
        if (g.wave >= 2 && Math.random() < 0.03) g.drops.push({ x: a.x + 19, y: a.y + 40 });
        if (a.y + 40 >= 600) {
          const p = g.plants.find((pl) => pl.hp > 0 && Math.abs(pl.x + 32 - (a.x + 24)) < 46);
          if (p) {
            p.hp--; this.sfx('splat');
            g.booms.push({ x: a.x, y: a.y, t: 0 });
            if (p.hp === 0) this.sfx('dead');
          }
          a.st = 'enter'; a.t = 0; a.ex = a.x; a.ey = -60; a.side = a.x < 640 ? 1 : -1;
        }
      }
      if (g.inv === 0 && a.st === 'dive' && hit(a.x + 6, a.y + 6, 36, 36, g.mx + 6, MY + 4, 36, 64)) {
        a.dead = true; g.booms.push({ x: a.x, y: a.y, t: 0 });
        g.lives--; g.inv = 60; this.sfx('dead');
      }
    });

    // colisiones guisante-pulgón
    g.bullets.forEach((b) => {
      if (b.gone) return;
      for (const a of g.aphids) {
        if (a.dead || a.st === 'enter' && a.t < 0) continue;
        if (hit(b.x, b.y, 18, 18, a.x + 4, a.y + 6, 40, 38)) {
          b.gone = true; a.hp--;
          if (a.hp <= 0) {
            a.dead = true;
            g.score += (a.red ? 200 : 100) * (a.st === 'dive' ? 2 : 1);
            g.booms.push({ x: a.x, y: a.y, t: 0 });
            this.sfx('pop', 0.04);
            const r = Math.random();
            if (r < 0.07) g.pows.push({ x: a.x + 4, y: a.y, kind: 'mariquita' });
            else if (r < 0.12 && g.plants.some((p) => p.hp > 0 && p.hp < 3)) g.pows.push({ x: a.x + 4, y: a.y, kind: 'regadera' });
          } else this.sfx('tick');
          break;
        }
      }
    });
    g.bullets = g.bullets.filter((b) => !b.gone);
    g.aphids = g.aphids.filter((a) => !a.dead);

    // lanzar picados
    if (--g.diveT <= 0 && alivePlants.length) {
      const formed = g.aphids.filter((a) => a.st === 'form');
      const n = Math.min(formed.length, 1 + Math.floor(g.wave / 3));
      for (let i = 0; i < n; i++) {
        const a = formed.splice(Math.floor(Math.random() * formed.length), 1)[0];
        const p = alivePlants[Math.floor(Math.random() * alivePlants.length)];
        a.st = 'dive'; a.tx = p.x + 8; a.vy = 4.5 + g.wave * 0.6; a.ph = 0;
      }
      g.diveT = Math.max(16, 60 - g.wave * 6);
    }
    if (g.wave >= 4) g.aphids.forEach((a) => { if (a.st === 'form' && Math.random() < 0.0015) g.drops.push({ x: a.x + 19, y: a.y + 40 }); });

    // melaza
    g.drops.forEach((d) => {
      d.y += 8;
      if (g.inv === 0 && hit(d.x, d.y, 10, 14, g.mx + 8, MY + 6, 32, 62)) { d.gone = true; g.lives--; g.inv = 60; this.sfx('dead'); }
    });
    g.drops = g.drops.filter((d) => !d.gone && d.y < 700);

    // premios
    g.pows.forEach((p) => {
      p.y += 4;
      if (hit(p.x, p.y, 40, 40, g.mx, MY, 48, 72)) {
        p.gone = true; this.sfx('badge');
        if (p.kind === 'mariquita') g.triple = 300;
        else {
          const hurt = g.plants.filter((pl) => pl.hp > 0 && pl.hp < 3).sort((a, b) => a.hp - b.hp)[0];
          if (hurt) hurt.hp++;
        }
      }
    });
    g.pows = g.pows.filter((p) => !p.gone && p.y < 700);
    g.booms.forEach((b) => b.t++);
    g.booms = g.booms.filter((b) => b.t < 9);
    if (g.bannerT > 0) g.bannerT--;

    // fin de oleada o de partida
    if (g.lives <= 0 || !g.plants.some((p) => p.hp > 0)) {
      g.over = true;
      clearInterval(this._gl);
      this.sfx('fail');
      this.setState({ fkTick: g.f, fkBest: Math.max(this.state.fkBest, g.score) });
      return;
    }
    if (g.aphids.length === 0) { g.score += 500; this.sfx('win'); this.fkWave(); }
    this.setState({ fkTick: g.f });
  };

  fkVals() {
    const SP = this.SP, g = this.g, s = this.state;
    if (!g) return {
      stars: this.STARS, plants: [0, 1, 2, 3, 4, 5].map((i) => ({ x: (Math.round(1280 / 7 * (i + 1)) - 32) + 'px', src: SP.vainas, pips: [{ c: '#8cc152' }, { c: '#8cc152' }, { c: '#8cc152' }] })),
      aphids: [], bullets: [], drops: [], pows: [], booms: [], mx: 616, mo: 1, score: 0, best: s.fkBest, wave: 0, lives: [1, 2, 3],
      hasTriple: false, triple: 0, pauseLabel: 'PAUSA', hasBanner: false, bannerO: 0, bannerTitle: '', bannerText: '',
      showStart: true, paused: false, panelTitle: 'PLAGA EN EL HUERTO', startLabel: 'EMPEZAR',
      panelText: 'Los pulgones bajan en oleadas a chuparse la savia de los guisantes. Fray Gregor los frena a guisantazos. Cada pulgón que llega a una planta le quita una vida.'
    };
    const fr = Math.floor(g.f / 6) % 2;
    return {
      stars: this.STARS,
      plants: g.plants.map((p) => ({ x: p.x + 'px', src: [SP.muerta, SP.joven, SP.flor, SP.vainas][p.hp], pips: [0, 1, 2].map((i) => ({ c: i < p.hp ? '#8cc152' : '#3a3128' })) })),
      aphids: g.aphids.map((a) => ({ x: Math.round(a.x), y: Math.round(a.y), o: a.red && a.hp === 1 ? 0.7 : 1, src: a.red ? (fr ? SP.pulgonR2 : SP.pulgonR) : (fr ? SP.pulgon2 : SP.pulgon) })),
      bullets: g.bullets.map((b) => ({ x: Math.round(b.x), y: Math.round(b.y) })),
      drops: g.drops.map((d) => ({ x: Math.round(d.x), y: Math.round(d.y) })),
      pows: g.pows.map((p) => ({ x: Math.round(p.x), y: Math.round(p.y), src: p.kind === 'mariquita' ? SP.mariquita : SP.regadera })),
      booms: g.booms.map((b) => ({ x: Math.round(b.x), y: Math.round(b.y), s: (0.6 + b.t * 0.1).toFixed(2), o: (1 - b.t / 9).toFixed(2) })),
      mx: Math.round(g.mx), mo: g.inv > 0 && g.f % 4 < 2 ? 0.3 : 1,
      score: g.score, best: Math.max(s.fkBest, g.score), wave: g.wave, lives: Array.from({ length: Math.max(0, g.lives) }, (_, i) => i),
      hasTriple: g.triple > 0, triple: Math.ceil(g.triple / 30), pauseLabel: g.paused ? 'SEGUIR' : 'PAUSA',
      hasBanner: g.bannerT > 0 && !g.over, bannerO: Math.min(1, g.bannerT / 20).toFixed(2), bannerTitle: g.banner ? g.banner.title : '', bannerText: g.banner ? g.banner.text : '',
      showStart: g.over, paused: g.paused && !g.over, panelTitle: 'FIN DE LA PARTIDA', startLabel: 'OTRA VEZ',
      panelText: 'Has llegado a la oleada ' + g.wave + ' con ' + g.score + ' puntos' + (g.score >= s.fkBest && g.score > 0 ? '. ¡Nuevo récord!' : '. Récord: ' + s.fkBest + '.') + ' ' + (g.lives <= 0 ? 'La melaza y los pulgones han podido con Fray Gregor.' : 'Los pulgones han dejado el huerto sin plantas.')
    };
  }
  openHistory = (from) => { this.sfx('click'); this.setState({ screen: 'history', prevScreen: from }); };
  closeHistory = () => { this.sfx('click'); this.setState({ screen: this.state.prevScreen || 'title' }); };

  startGarden = () => {
    const s = this.state;
    const plants = Array.from({ length: 12 }, (_, i) => ({ id: i, alive: true, health: 100, water: 4, pulgon: false, oidio: false, ramas: false, staked: false, birds: false }));
    const mystery = s.cross === 'misterio' ? { exp: s.exp, pairs: this.E()[s.exp].genes.map((L) => Math.random() < 0.5 ? L + L : L + L.toLowerCase()) } : null;
    const real = s.mode === 'real';
    this.sfx('week');
    this.setState({
      screen: 'garden', week: 0, weather: 'sol', ap: 10, tool: 'regar', plants, mystery, guess: null,
      log: [{ t: 'Marzo de ' + this.year() + ': siembras 12 plantas en el huerto de la abadía.' }],
      emasc: false, pollinated: false, contam: false, result: null, hyp: null, checked: false,
      inputs: ['', '', '', ''], nbTab: 'res', showGuide: real && !s.guideSeen
    });
  };

  openGuide = () => { this.sfx('click'); this.setState({ showGuide: true }); };
  closeGuide = () => { this.sfx('click'); this.setState({ showGuide: false, guideSeen: true }); };
  toggleHints = () => { this.sfx('click'); this.setState({ hints: !this.state.hints }); };

  passWeek = () => {
    const s = this.state;
    if (s.week >= 8 || this.needPoll()) return;
    const week = s.week + 1;
    const real = s.mode === 'real';
    const W = real ? this.pick([['sol', 35], ['nube', 25], ['lluvia', 25], ['calor', 15]]) : this.pick([['sol', 50], ['nube', 25], ['lluvia', 25]]);
    const msgs = [{ t: 'Semana ' + week + ': ' + { sol: 'sol radiante', nube: 'día nublado', lluvia: 'llueve', calor: 'ola de calor' }[W] + '.' }];
    const plants = s.plants.map((p) => Object.assign({}, p));
    let ap = 10, deaths = 0, eventHappened = false;
    const L = (a) => a.map((i) => 'P' + (i + 1)).join(', ');
    const aliveIdx = () => plants.map((p, i) => p.alive ? i : -1).filter((i) => i >= 0);
    const sample = (arr, n) => arr.slice().sort(() => Math.random() - 0.5).slice(0, n);

    if (real) {
      const delta = { sol: -1, nube: 0, lluvia: 2, calor: -3 }[W];
      const prevP = s.plants.map((p) => p.alive && p.pulgon);
      const newP = [], newO = [], newR = [], dead = [], dry = [], wet = [], fallen = [];
      plants.forEach((p, i) => {
        if (!p.alive) return;
        p.water = Math.max(0, Math.min(8, p.water + delta));
        let dmg = 0;
        if (p.water <= 0) { dmg += 25; dry.push(i); }
        if (p.water >= 8) { dmg += 15; wet.push(i); }
        if (p.pulgon) dmg += 15;
        if (p.oidio) dmg += 15;
        if (p.ramas) dmg += 5;
        if (week >= 5 && !p.staked) { dmg += 10; fallen.push(i); }
        const neigh = [i - 1, i + 1, i - 6, i + 6].filter((j) => j >= 0 && j < 12 && !(Math.abs(j - i) === 1 && Math.floor(j / 6) !== Math.floor(i / 6)));
        if (!p.pulgon && (Math.random() < 0.07 + (W === 'calor' ? 0.1 : 0) || (neigh.some((j) => prevP[j]) && Math.random() < 0.3))) { p.pulgon = true; newP.push(i); }
        if (!p.oidio && Math.random() < 0.04 + (W === 'lluvia' ? 0.14 : 0)) { p.oidio = true; newO.push(i); }
        if (!p.ramas && week >= 3 && Math.random() < 0.1) { p.ramas = true; newR.push(i); }
        p.health = Math.max(0, p.health - dmg);
        if (p.health <= 0) { p.alive = false; dead.push(i); }
      });
      if (dry.length) msgs.push({ t: 'Se secan: ' + L(dry) + '.' });
      if (wet.length) msgs.push({ t: 'Encharcadas: ' + L(wet) + '.' });
      if (newP.length) msgs.push({ t: 'Pulgones en ' + L(newP) + '.' });
      if (newO.length) msgs.push({ t: 'Oídio (polvo blanco) en ' + L(newO) + '.' });
      if (newR.length) msgs.push({ t: 'Ramas secas en ' + L(newR) + '.' });
      if (fallen.length) msgs.push({ t: 'Sin tutor se tumban: ' + L(fallen) + '.' });
      if (week === 3) msgs.push({ t: 'Las plantas trepan: ponles tutores antes de la semana 5.' });

      if (Math.random() < 0.3) {
        const opts = ['abad'];
        if (week >= 2) opts.push('granizo');
        if (week <= 2) opts.push('helada');
        if (week >= 6) opts.push('mirlos');
        const ev = opts[Math.floor(Math.random() * opts.length)];
        eventHappened = true;
        if (ev === 'abad') { ap = 13; msgs.push({ t: 'El abad Napp visita el huerto y te presta dos novicios: +3 jornadas esta semana.', src: this.SP.abad, ev: true }); }
        if (ev === 'granizo') {
          const hit = sample(aliveIdx(), 4);
          hit.forEach((i) => { plants[i].health = Math.max(0, plants[i].health - 15); if (plants[i].health <= 0 && plants[i].alive) { plants[i].alive = false; dead.push(i); } });
          msgs.push({ t: '¡Granizada! Golpea a ' + L(hit) + ' (−15 salud).', src: this.SP.lluvia, ev: true });
        }
        if (ev === 'helada') {
          aliveIdx().forEach((i) => { plants[i].health = Math.max(0, plants[i].health - 10); if (plants[i].health <= 0) { plants[i].alive = false; dead.push(i); } });
          msgs.push({ t: 'Helada tardía: todas las plantas sufren (−10 salud).', src: this.SP.nube, ev: true });
        }
        if (ev === 'mirlos') {
          const hit = sample(aliveIdx(), 3);
          hit.forEach((i) => { plants[i].birds = true; });
          msgs.push({ t: 'Los mirlos picotean las vainas de ' + L(hit) + ': darán menos guisantes.', src: this.SP.vainas, ev: true });
        }
      }
      if (dead.length) { deaths = dead.length; msgs.push({ t: '¡Han muerto ' + L(dead) + '!' }); }
    } else {
      msgs.push({ t: { 1: 'Asoman los brotes.', 2: 'Las plantas crecen.', 3: 'Ya trepan por los tutores.', 4: 'Se abren las flores.', 5: 'Las flores se cierran.', 6: 'Aparecen las vainas.', 7: 'Las vainas engordan.', 8: 'Vainas maduras: ¡a cosechar!' }[week] });
      if (Math.random() < 0.3) {
        eventHappened = true;
        const ev = this.pick([
          [{ t: 'El abad Napp pasa por el huerto y pregunta por tus cuentas.', src: this.SP.abad, ev: true }, 1],
          [{ t: 'Un hermano te trae un cuaderno nuevo para tus cuentas.', src: this.SP.mendel, ev: true }, 1],
          [{ t: 'Recuerdas tus clases de física en Viena: medir y contar con rigor.', src: this.SP.mendel, ev: true }, 1],
          [{ t: 'Las abejas zumban, pero no pueden entrar en la flor cerrada del guisante.', src: this.SP.flor, ev: true }, 1]
        ]);
        msgs.push(ev);
      }
    }
    this.sfx(deaths ? 'dead' : eventHappened ? 'event' : 'week');
    this.setState({ week, weather: W, plants, ap, log: msgs.concat(s.log).slice(0, 40) });
  };

  usePlant = (i) => {
    const s = this.state;
    if (s.mode !== 'real' || this.needPoll()) return;
    const n = 'P' + (i + 1);
    const p = Object.assign({}, s.plants[i]);
    if (!p.alive) { this.toast(n + ' está muerta.'); return; }
    if (s.ap <= 0) { this.sfx('bad'); this.toast('Sin jornadas: pasa a la semana siguiente.'); return; }
    let msg = '', cost = 1, good = true;
    if (s.tool === 'regar') { p.water = Math.min(8, p.water + 3); msg = p.water >= 8 ? 'Riegas ' + n + '... ¡demasiada agua!' : 'Riegas ' + n + '.'; good = p.water < 8; }
    else if (s.tool === 'pulgones') { if (p.pulgon) { p.pulgon = false; msg = 'Quitas los pulgones de ' + n + '.'; } else { msg = n + ' no tenía pulgones.'; good = false; } }
    else if (s.tool === 'sulfatar') { if (p.oidio) { p.oidio = false; msg = 'Sulfatas ' + n + ' con caldo bordelés: adiós oídio.'; } else { p.health -= 10; good = false; msg = 'Sulfato innecesario en ' + n + ' (−10 salud).'; } }
    else if (s.tool === 'tutor') { if (p.staked) { cost = 0; good = false; msg = n + ' ya tiene tutor.'; } else { p.staked = true; msg = 'Pones un tutor a ' + n + '.'; } }
    else if (s.tool === 'podar') { if (p.ramas) { p.ramas = false; msg = 'Podas las ramas secas de ' + n + '.'; } else { p.health -= 5; good = false; msg = 'Poda innecesaria en ' + n + ' (−5 salud).'; } }
    if (p.health <= 0) { p.health = 0; p.alive = false; msg += ' ' + n + ' ha muerto.'; this.sfx('dead'); }
    else this.sfx(good ? 'pop' : 'bad');
    const plants = s.plants.slice(); plants[i] = p;
    this.setState({ plants, ap: s.ap - cost, log: [{ t: msg }].concat(s.log).slice(0, 40) });
  };

  emasculate = () => {
    const s = this.state;
    this.sfx('pop');
    this.setState({ emasc: true, ap: Math.max(0, s.ap - 2), log: [{ t: 'Abres los capullos y quitas los estambres con las tijeras.' }].concat(s.log) });
  };
  pollinate = () => {
    const s = this.state;
    this.sfx('ok');
    this.setState({ pollinated: true, contam: this.needsCross() && !s.emasc, log: [{ t: 'Llevas el polen del padre a las flores madre con el pincel.' }].concat(s.log) });
  };
  pollEasy = () => {
    this.sfx('ok');
    this.setState({ emasc: true, pollinated: true, contam: false, log: [{ t: 'Quitas los estambres de las flores madre y las polinizas con el pincel.' }].concat(this.state.log) });
  };
  pollSelf = () => {
    this.sfx('ok');
    this.setState({ pollinated: true, log: [{ t: 'Las flores se autofecundan solas.' }].concat(this.state.log) });
  };

  goHarvest = () => {
    const s = this.state;
    const real = s.mode === 'real';
    const par = this.parents();
    let seeds = [], alive = 0;
    s.plants.forEach((p) => {
      if (!p.alive) return;
      alive++;
      let k = real ? Math.round(p.health / 100 * 30) + this.rnd(0, 6) - (p.ramas ? 6 : 0) - (p.birds ? 8 : 0) : 28 + this.rnd(0, 8);
      k = Math.max(0, k);
      for (let j = 0; j < k; j++) seeds.push(this.seed(par, s.contam));
    });
    for (let i = seeds.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = seeds[i]; seeds[i] = seeds[j]; seeds[j] = t; }
    let mice = false;
    if (real && seeds.length > 40 && Math.random() < 0.25) { mice = true; seeds = seeds.slice(0, Math.round(seeds.length * 0.85)); }
    const counts = [0, 0, 0, 0];
    seeds.forEach((c) => counts[c]++);
    const nPods = real ? 5 : 3;
    const pods = [];
    let idx = 0;
    for (let q = 0; q < nPods && idx < seeds.length; q++) {
      const size = Math.min(this.rnd(5, 8), seeds.length - idx);
      pods.push(seeds.slice(idx, idx + size));
      idx += size;
    }
    const badges = Object.assign({}, s.badges);
    const got = real && alive === 12 ? this.award(badges, 'hortelano') : null;
    this.sfx(got ? 'badge' : 'ok');
    if (got) this.toast('¡Logro: ' + got + '!');
    this.setState({ screen: 'harvest', counts, total: seeds.length, seq: seeds, mice, alive, pods, podIdx: 0, peaIdx: 0, tallies: [0, 0, 0, 0], mistakes: 0, revealed: false, revealN: 0, badges });
  };

  sortPea = (c) => {
    const s = this.state;
    if (s.podIdx >= s.pods.length) return;
    const cur = s.pods[s.podIdx][s.peaIdx];
    if (c !== cur) { this.sfx('bad'); this.setState({ mistakes: s.mistakes + 1 }); this.toast('¡Ese no va ahí! Fíjate en el guisante marcado.'); return; }
    const t = s.tallies.slice(); t[c]++;
    let pe = s.peaIdx + 1, po = s.podIdx;
    if (pe >= s.pods[po].length) { po++; pe = 0; this.sfx('ok'); } else this.sfx('pop');
    this.setState({ tallies: t, peaIdx: pe, podIdx: po });
  };

  reveal = () => {
    const s = this.state;
    const badges = Object.assign({}, s.badges);
    const got = s.mistakes === 0 ? this.award(badges, 'contable') : null;
    if (got) { this.sfx('badge'); this.toast('¡Logro: ' + got + '!'); }
    const start = s.pods.reduce((a, p) => a + p.length, 0);
    this.setState({ revealed: true, revealN: start, badges });
    clearInterval(this._ri);
    const stepN = Math.max(1, Math.ceil((s.total - start) / 70));
    let k = 0;
    this._ri = setInterval(() => {
      const n = Math.min(this.state.total, this.state.revealN + stepN);
      this.setState({ revealN: n });
      if (++k % 3 === 0) this.sfx('tick');
      if (n >= this.state.total) { clearInterval(this._ri); this.sfx('ok'); }
    }, 55);
  };
  skipAnim = () => { clearInterval(this._ri); this.setState({ revealN: this.state.total }); };

  goNotebook = () => { this.sfx('click'); this.setState({ screen: 'notebook' }); };
  backHarvest = () => { this.sfx('click'); this.setState({ screen: 'harvest' }); };

  newExperiment = () => {
    const s = this.state;
    this.sfx('click');
    clearInterval(this._ri);
    this.setState({
      screen: 'lab', expNo: s.checked ? s.expNo + 1 : s.expNo, week: 0, plants: [], log: [],
      emasc: false, pollinated: false, contam: false, result: null, hyp: null, checked: false, mystery: null, guess: null,
      inputs: ['', '', '', ''], nbTab: 'res', revealed: false, pods: [], total: 0, seq: [], revealN: 0
    });
  };

  check = () => {
    const s = this.state;
    const ex = this.E()[s.exp];
    const k = ex.labels.length;
    const obs = s.inputs.slice(0, k).map((v) => parseInt(v, 10));
    if (obs.some((v) => isNaN(v) || v < 0)) { this.sfx('bad'); this.toast('Apunta un número en cada casilla.'); return; }
    if (!s.hyp) { this.sfx('bad'); this.toast('Elige qué proporción esperas.'); return; }
    const mys = s.cross === 'misterio';
    if (mys && !s.guess) { this.sfx('bad'); this.toast('Elige qué factores crees que tiene la planta misteriosa.'); return; }
    const n = obs.reduce((a, b) => a + b, 0);
    if (!n) { this.toast('Con cero guisantes no hay nada que comprobar.'); return; }
    const H = this.hyps(s.exp, s.cross);
    const mine = H.find((h) => h.id === s.hyp);
    const r = this.chi(obs, mine.r);
    const passing = H.filter((h) => this.chi(obs, h.r).pass);
    const correct = this.correctHyp();
    const isCorrect = s.hyp === correct;
    const matches = obs.every((v, i) => v === s.counts[i]);
    const notes = [];
    const badges = Object.assign({}, s.badges);
    const newB = [];
    const give = (id) => { const g = this.award(badges, id); if (g) newB.push(g); };

    let chiLine;
    if (r.df === 0) chiLine = r.pass ? 'Todos los guisantes son del tipo dominante, tal como dice tu hipótesis.' : 'Tu hipótesis dice que todos deberían ser dominantes, pero has contado de otros tipos.';
    else if (!isFinite(r.chi)) chiLine = 'Tu hipótesis no admite algunos de los tipos que has contado.';
    else chiLine = 'χ² = ' + this.fmt(r.chi, 2) + ' · límite ' + this.fmt(r.crit, 2) + ' (' + r.df + ' g.l., 5 %)';

    let lawTitle = '', lawText = '';
    if (r.pass && isCorrect && !mys) {
      if (s.cross === 'P') { lawTitle = '1ª LEY · UNIFORMIDAD'; lawText = 'Al cruzar dos líneas puras, toda la F1 es igual y muestra el carácter dominante. El recesivo no ha desaparecido: está escondido.'; if (matches) give('ley1'); }
      else if (s.cross === 'F2' && s.exp !== 'dihib') { lawTitle = '2ª LEY · SEGREGACIÓN'; lawText = 'Cada planta lleva dos factores. Se separan al formar los gametos, y el carácter recesivo reaparece en 1 de cada 4 semillas.'; if (matches) give('ley2'); }
      else if (s.cross === 'F2') { lawTitle = '3ª LEY · TRANSMISIÓN INDEPENDIENTE'; lawText = 'El color y la forma se heredan por separado. Combinando dos 3:1 independientes sale 9:3:3:1.'; if (matches) give('ley3'); }
      else { lawTitle = 'RETROCRUCE'; lawText = s.exp === 'dihib' ? 'La F1 forma cuatro tipos de gametos en igual proporción: 1:1:1:1. Otra prueba de la 3ª ley.' : 'La F1 es híbrida (lleva un factor de cada). Cruzada con un recesivo puro da mitad y mitad.'; if (matches) give('retro'); }
    }

    let hasMystery = false, myText = '', myBg = '#f2c94c';
    if (mys) {
      hasMystery = true;
      const real = s.mystery.pairs.join('');
      if (s.guess === real) {
        myText = '¡Correcto! La planta misteriosa era ' + real + '.';
        if (matches) give('detective');
      } else {
        myBg = '#e3a08f';
        myText = 'No: la planta misteriosa era ' + real + ', no ' + s.guess + '.';
      }
      const het = s.mystery.pairs.some((p) => p[0] !== p[1]);
      notes.push({ t: het ? 'Pista: si aparece algún recesivo, la planta tiene que llevar escondido el factor recesivo.' : 'Pista: si no aparece ni un solo recesivo en muchos guisantes, la planta es pura.' });
    }

    if (!matches) notes.push({ t: 'Tus números no coinciden con el recuento (' + s.counts.slice(0, k).join(' : ') + '). Revisa lo que has apuntado.' });
    if (r.pass && !isCorrect) notes.push({ t: 'Cuadra con el azar, pero no es lo que predicen las leyes de Mendel para este cruce. ¿Has pensado bien qué factores tienen los padres?' });
    if (!r.pass && passing.length) notes.push({ t: 'Tus datos sí encajan con: ' + passing.map((h) => h.label.toLowerCase()).join(', ') + '.' });
    if (passing.length > 1 && n < 120) notes.push({ t: 'Con solo ' + n + ' guisantes encajan varias hipótesis. Por eso Mendel contaba miles.' });
    if (s.contam && !r.pass && isCorrect) { notes.push({ t: 'Han salido recesivos de más: algunas flores se autofecundaron porque no les quitaste los estambres antes de polinizar.' }); give('leccion'); }
    if (r.pass && isFinite(r.chi) && r.df >= 1 && n >= 50 && r.chi < (r.df === 1 ? 0.016 : 0.58)) {
      notes.push({ t: 'Datos casi perfectos. En 1936 el estadístico R. A. Fisher sospechó que los de Mendel eran demasiado buenos para ser verdad. ¡Los tuyos también lo parecen!' });
      if (matches) give('fisher');
    }
    if (newB.length) { this.sfx('badge'); this.toast('¡Logro: ' + newB.join(', ') + '!'); }
    else this.sfx(r.pass ? 'win' : 'fail');

    const result = {
      pass: r.pass, title: r.pass ? '¡CUADRA!' : 'NO CUADRA', col: r.pass ? '#3f7a2a' : '#a8382c', chiLine,
      rows: ex.labels.map((l, i) => ({ label: l, obs: obs[i], exp: this.fmt(r.exp[i], 1) })),
      expArr: r.exp, n,
      hasLaw: !!lawTitle, lawTitle, lawText, notes, hasMystery, myText, myBg
    };
    const rec = {
      n: s.expNo, txt: ex.short + ' · ' + (mys ? 'misterio (' + (s.test === 'prueba' ? 'cruce prueba' : 'autofecundación') + ')' : this.CROSSES[s.cross].short) + ' · ' + (s.mode === 'real' ? 'realista' : 'asequible'),
      obs: obs.join(' : '), ratio: this.ratioText(s.exp, obs), hyp: mine.label.toLowerCase() + (mys ? ' · dijo ' + s.guess : ''),
      verdict: r.pass ? 'cuadra' : 'no cuadra', col: r.pass ? '#3f7a2a' : '#a8382c'
    };
    const records = s.checked ? s.records.slice(1) : s.records.slice();
    records.unshift(rec);
    this.setState({ result, badges, records, nbTab: 'res', checked: true });
  };

  advice() {
    const s = this.state;
    if (s.ap <= 0) return { t: 'Ya no te quedan jornadas. Pasa a la semana siguiente.', tool: null };
    const A = s.plants.map((p, i) => ({ p, i })).filter((x) => x.p.alive);
    const f = (cond) => A.filter((x) => cond(x.p)).map((x) => 'P' + (x.i + 1));
    let l;
    if ((l = f((p) => p.water <= 1)).length) return { t: 'Tienen sed: ' + l.join(', ') + '. Riégalas.', tool: 'regar' };
    if ((l = f((p) => p.pulgon)).length) return { t: 'Pulgones en ' + l.join(', ') + '. Quítalos antes de que salten a las vecinas.', tool: 'pulgones' };
    if ((l = f((p) => p.oidio)).length) return { t: 'Oídio en ' + l.join(', ') + '. Sulfátalas con caldo bordelés.', tool: 'sulfatar' };
    if (s.week >= 2 && (l = f((p) => !p.staked)).length) return { t: 'Sin tutor: ' + l.join(', ') + '. Pónselo antes de la semana 5.', tool: 'tutor' };
    if ((l = f((p) => p.ramas)).length) return { t: 'Ramas secas en ' + l.join(', ') + '. Pódalas.', tool: 'podar' };
    if ((l = f((p) => p.water >= 6)).length) return { t: 'Casi encharcadas, no las riegues más: ' + l.join(', ') + '.', tool: null };
    return { t: 'Todo en orden. Puedes pasar la semana.', tool: null };
  }

  chart(w, h, n, cols, k, expFr) {
    const seq = this.state.seq, total = seq.length || 1;
    const left = 44, top = 10, W = w - left - 12, H = h - top - 30;
    const yOf = (fr) => top + (1 - fr) * H;
    const grid = [0, 0.25, 0.5, 0.75, 1].map((p) => ({ y: yOf(p) + 'px', ly: (yOf(p) - 10) + 'px', label: Math.round(p * 100) + '%' }));
    const pts = [[], [], [], []];
    const c = [0, 0, 0, 0];
    const step = Math.max(1, Math.floor(total / 150));
    for (let i = 0; i < Math.min(n, seq.length); i++) {
      c[seq[i]]++;
      const m = i + 1;
      if (m % step === 0 || m === n) for (let j = 0; j < k; j++) pts[j].push((left + m / total * W).toFixed(1) + ',' + yOf(c[j] / m).toFixed(1));
    }
    return {
      grid, p0: pts[0].join(' '), p1: pts[1].join(' '), p2: pts[2].join(' '), p3: pts[3].join(' '),
      c0: cols[0] || 'transparent', c1: cols[1] || 'transparent', c2: cols[2] || 'transparent', c3: cols[3] || 'transparent',
      exp: (expFr || []).map((fr, j) => ({ y: yOf(fr) + 'px', col: cols[j] }))
    };
  }

    let poll = { text: '', isSelf: false, isEasy: false, isReal: false, emascDone: s.emasc };
    if (needPoll) {
      if (!needsCross) poll = Object.assign(poll, { isSelf: true, text: 'La flor del guisante es cerrada: el polen fecunda su propia flor sin ayuda. Por eso Mendel lo eligió. Esta vez no tienes que hacer nada.' });
      else if (!real) poll = Object.assign(poll, { isEasy: true, text: 'Hay que cruzar las flores madre con el polen de las flores padre.' });
      else poll = Object.assign(poll, { isReal: true, text: s.emasc ? 'Estambres quitados. Ahora lleva el polen del padre con el pincel.' : 'Para cruzar, Mendel abría el capullo y quitaba los estambres (emasculación) antes de que soltaran polen. Luego polinizaba con un pincel.' });
    }
    const adv = real && s.screen === 'garden' ? this.advice() : null;
    const toolName = adv && adv.tool ? toolDefs.find((t) => t[0] === adv.tool)[1] : '';
    const advice = adv ? { t: adv.t, hasTool: !!adv.tool && s.tool !== adv.tool, toolName, use: () => { this.sfx('click'); this.setState({ tool: adv.tool }); } } : { t: '', hasTool: false, toolName: '', use: null };
    const log = s.log.map((e, i) => ({ t: e.t, hasSrc: !!e.src, src: e.src || '', col: e.ev ? '#f2c94c' : i === 0 ? '#f4efe1' : '#a89a80' }));

    // recuento
    const counting = s.screen === 'harvest' && s.total > 0 && s.podIdx < s.pods.length;
    const pod = counting ? s.pods[s.podIdx].map((c, j) => ({ src: ex.sprites[c], ring: j === s.peaIdx ? '#fff1a8' : 'transparent', op: j < s.peaIdx ? 0.25 : 1 })) : [];
    const bins = ex.labels.map((l, i) => ({ label: l.toUpperCase(), src: ex.sprites[i], n: s.tallies[i], pick: () => this.sortPea(i) }));
    const liveC = [0, 0, 0, 0];
    s.seq.slice(0, s.revealN).forEach((c) => liveC[c]++);
    const finals = ex.labels.map((l, i) => ({ label: l, src: ex.sprites[i], col: ex.cols[i], n: liveC[i], pct: s.revealN ? this.fmt(liveC[i] / s.revealN * 100, 1) + ' %' : '' }));
    const harvestText = s.total > 0
      ? 'Han llegado a la cosecha ' + s.alive + ' de 12 plantas y has recogido ' + s.total + ' guisantes.'
      : 'Ninguna planta ha llegado viva a la cosecha.';

    // cuaderno
    const fields = ex.labels.map((l, i) => ({
      label: l, src: ex.sprites[i], value: s.inputs[i],
      change: (e) => { const a = this.state.inputs.slice(); a[i] = e.target.value; this.setState({ inputs: a }); }
    }));
    const liveObs = s.inputs.slice(0, k).map((v) => { const x = parseInt(v, 10); return isNaN(x) ? 0 : x; });
    const liveTotal = liveObs.reduce((a, b) => a + b, 0);
    const hypButtons = this.hyps(s.exp, s.cross).map((h) => ({ label: h.label, bg: s.hyp === h.id ? '#3b2a1a' : '#e3cf9c', fg: s.hyp === h.id ? '#f2c94c' : '#3b2a1a', pick: () => { this.sfx('click'); this.setState({ hyp: h.id }); } }));
    const gopts = s.exp === 'dihib' ? ['YYRR', 'YyRR', 'YYRr', 'YyRr'] : [ex.genes[0] + ex.genes[0], ex.genes[0] + ex.genes[0].toLowerCase()];
    const guessButtons = gopts.map((g) => ({ label: g, bg: s.guess === g ? '#3b2a1a' : '#e3cf9c', fg: s.guess === g ? '#f2c94c' : '#3b2a1a', pick: () => { this.sfx('click'); this.setState({ guess: g }); } }));
    const tabs = [['res', 'RESULTADO'], ['graf', 'GRÁFICA'], ['pun', 'PUNNETT'], ['reg', 'REGISTRO']].map(([id, label]) => ({ label, bg: s.nbTab === id ? '#3b2a1a' : '#e3cf9c', fg: s.nbTab === id ? '#f2c94c' : '#3b2a1a', pick: () => { this.sfx('click'); this.setState({ nbTab: id }); } }));
    let mendelRef;
    if (mys) mendelRef = 'Mendel usaba este truco para saber si una planta dominante era pura: la cruzaba con una recesiva o la dejaba autofecundarse y miraba si aparecía algún recesivo.';
    else if (s.cross === 'F2') mendelRef = 'En la F2, Mendel contó ' + ex.mendel.join(' : ') + ' guisantes, es decir ' + this.ratioText(s.exp, ex.mendel) + '.';
    else if (s.cross === 'P') mendelRef = 'En sus siete caracteres, toda la F1 de Mendel salió con el carácter dominante. Ni un solo recesivo.';
    else mendelRef = 'Mendel usó retrocruces para demostrar que la F1 era híbrida. Esperaba ' + (s.exp === 'dihib' ? '1 : 1 : 1 : 1.' : '1 : 1.');

    // gráficas
    const chartH = this.chart(720, 210, s.revealN, ex.cols, k, null);
    const res = s.result;
    const expFr = res ? res.expArr.slice(0, k).map((e) => e / res.n) : null;
    const chartN = this.chart(540, 190, s.seq.length, ex.cols, k, expFr);
    const maxV = Math.max(1, ...s.counts.slice(0, k), ...(res ? res.expArr.slice(0, k) : [0]));
    const bars = ex.labels.map((l, i) => ({
      label: l, src: ex.sprites[i], col: ex.cols[i],
      oh: Math.round(s.counts[i] / maxV * 120) + 'px', hasExp: !!res, eh: res ? Math.round(res.expArr[i] / maxV * 120) + 'px' : '0px'
    }));

    // Punnett
    const mg = this.gametes(par.mother), fg = this.gametes(par.father);
    const punCells = [{ t: '♀ \\ ♂', bg: 'transparent', hasPea: false, src: '' }];
    fg.forEach((g) => punCells.push({ t: g, bg: '#e3cf9c', hasPea: false, src: '' }));
    mg.forEach((m) => {
      punCells.push({ t: m, bg: '#e3cf9c', hasPea: false, src: '' });
      fg.forEach((f) => {
        const pairs = [...m].map((ch, gi) => this.norm(ch, f[gi]));
        punCells.push({ t: pairs.join(''), bg: '#f7ecd0', hasPea: true, src: ex.sprites[this.cat(pairs)] });
      });
    });
    const big = fg.length > 2;
    const punHidden = mys && !s.checked;

    return {
      sp: SP, year,
      isTitle: s.screen === 'title', notTitle: s.screen !== 'title',
      isLab: s.screen === 'lab', isGarden: s.screen === 'garden', isHarvest: s.screen === 'harvest', isNotebook: s.screen === 'notebook', isHistory: s.screen === 'history',
      isReal: real, isFacil: !real,
      modeLabel: s.screen === 'friki' ? 'FRIKI' : real ? 'REALISTA' : 'ASEQUIBLE', modeBg: s.screen === 'friki' ? '#c9a3e6' : real ? '#f2c94c' : '#8cc152',
      isFriki: s.screen === 'friki', fk: this.fkVals(),
      openFriki: this.openFriki, fkStart: this.fkStart, fkPause: this.fkPause, setArena: this.setArena,
      arenaMove: this.arenaMove, arenaKeyDown: this.arenaKeyDown, arenaKeyUp: this.arenaKeyUp,
      steps, badgeList, badgeCount, badgeTotal: this.BADGES.length, goMenu: this.goMenu,
      toggleSound: this.toggleSound, toggleMusic: this.toggleMusic,
      soundLabel: s.sound ? 'SONIDO: SÍ' : 'SONIDO: NO', musicLabel: s.music ? 'MÚSICA: SÍ' : 'MÚSICA: NO',
      soundLabelLow: s.sound ? 'Sonido: sí' : 'Sonido: no', musicLabelLow: s.music ? 'Música: sí' : 'Música: no',
      openHistoryTitle: () => this.openHistory('title'), openHistoryNb: () => this.openHistory('notebook'), closeHistory: this.closeHistory,
      history: this.HISTORY,
      titlePlants: Array.from({ length: 14 }, (_, i) => ({ src: i % 3 === 0 ? SP.vainas : i % 3 === 1 ? SP.flor : SP.joven })),
      pickFacil: () => this.chooseMode('facil'), pickReal: () => this.chooseMode('real'),
      expNo: s.expNo, labTip, expCards, crossCards, isMystery: mys, testButtons,
      mother: pinfo(par.mother, motherHidden), father: pinfo(par.father, fatherHidden), crossNote, startGarden: this.startGarden,
      calendar, weather, ap: s.ap, log, plots, tools, guideRows,
      hasAdvice: !!adv, advice, openGuide: this.openGuide, closeGuide: this.closeGuide, showGuide: s.showGuide && s.screen === 'garden',
      toggleHints: this.toggleHints, hintsLabel: s.hints ? 'AVISOS: SÍ' : 'AVISOS: NO',
      facilBar: s.week >= 8 ? 'Las vainas están maduras.' : 'Semana ' + s.week + ' de 8.',
      canPass: s.week < 8, harvestReady: s.week >= 8, passWeek: this.passWeek, goHarvest: this.goHarvest,
      needPoll, poll, emasculate: this.emasculate, pollinate: this.pollinate, pollEasy: this.pollEasy, pollSelf: this.pollSelf,
      counting, pod, bins, podLabel: 'VAINA ' + Math.min(s.podIdx + 1, s.pods.length) + ' / ' + s.pods.length,
      waitingHelper: s.screen === 'harvest' && s.total > 0 && s.podIdx >= s.pods.length && !s.revealed,
      revealed: s.screen === 'harvest' && s.revealed, noSeeds: s.screen === 'harvest' && s.total === 0,
      revealN: s.revealN, animating: s.revealed && s.revealN < s.total, revealDone: s.revealed && s.revealN >= s.total, skipAnim: this.skipAnim,
      chartH, mice: s.mice,
      podsDone: s.pods.length, reveal: this.reveal, finals, total: s.total, mistakes: s.mistakes, harvestText,
      goNotebook: this.goNotebook, backHarvest: this.backHarvest, newExperiment: this.newExperiment,
      nbHeader: ex.short + ' · ' + (mys ? 'misterio, ' + (s.test === 'prueba' ? 'cruce prueba' : 'autofecundación') : cr.short) + ' · ' + s.total + ' guisantes',
      fields, liveTotal, liveRatio: this.ratioText(s.exp, liveObs), hypButtons, check: this.check,
      isMysteryNb: mys, guessButtons,
      tabs, tabRes: s.nbTab === 'res', tabGraf: s.nbTab === 'graf', tabPun: s.nbTab === 'pun', tabReg: s.nbTab === 'reg',
      noResult: !res, hasResult: !!res,
      res: res || { title: '', col: '#3b2a1a', chiLine: '', rows: [], hasLaw: false, lawTitle: '', lawText: '', notes: [], hasMystery: false, myText: '', myBg: '#f2c94c' },
      mendelRef, chartN, bars,
      barsCaption: res ? '(LLENO) Y ESPERADO (RAYADO)' : 'EN LA COSECHA',
      expLinesCaption: res ? ' (rayas: lo que espera tu hipótesis)' : '',
      punHidden, punShown: !punHidden,
      punCells, punCols: fg.length + 1, punW: big ? '540px' : '360px', punH: big ? '58px' : '86px', punFs: big ? '18px' : '24px',
      punTitle: 'Madre ' + par.mother.join('') + ' × padre ' + par.father.join('') + ':',
      records: s.records, noRecords: s.records.length === 0,
      hasFlash: !!s.flash, flash: s.flash
    };
  }
}

window.__startDC(Component);
</script>
