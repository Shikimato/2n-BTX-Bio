  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ont-weight:600}\n.dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto;box-shadow:inset -3px -3px 5px rgba(0,0,0,.35),inset 2px 2px 3px rgba(255,255,255,.45)}\n.ball{border-radius:50%;flex:0 0 auto;box-shadow:inset -8px -10px 16px rgba(0,0,0,.35),inset 6px 6px 10px rgba(255,255,255,.5),0 10px 20px rgba(0,0,0,.35)}\n.side{position:absolute;left:24px;top:24px;bottom:24px;width:min(500px,calc(100% - 48px));display:flex;flex-direction:column;overflow:hidden}\n.side-scroll{overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:24px}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:10px}\n.card{appearance:none;text-align:left;font:inherit;color:#F5F2EA;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:68px}\n.card:hover{background:rgba(255,255,255,.1)}\n.card.on{border-color:#FFD23F;background:rgba(255,210,63,.12)}\n.input{font:inherit;font-size:16px;color:#F5F2EA;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;min-height:44px;padding:0 12px;width:100%}\n.input:focus{outline:2px solid #FFD23F;border-color:transparent}\n.hud-tl{position:absolute;left:16px;top:16px;width:300px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}\n.row{appearance:none;border:0;background:transparent;color:inherit;font:inherit;display:grid;grid-template-columns:22px 16px 1fr auto;align-items:center;gap:10px;min-height:34px;padding:2px 8px;border-radius:9px;cursor:pointer;text-align:left;width:100%}\n.row:hover{background:rgba(255,255,255,.08)}\n.row.on{background:rgba(255,210,63,.16)}\n.hud-tr{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100% - 350px)}\n.bar{display:flex;flex-wrap:wrap;gap:6px;padding:6px;justify-content:flex-end}\n.seg{appearance:none;border:0;font:inherit;font-weight:600;font-size:14px;color:#F5F2EA;background:transparent;border-radius:10px;min-height:44px;min-width:44px;padding:0 12px;cursor:pointer}\n.seg:hover{background:rgba(255,255,255,.1)}\n.seg.on{background:#F5F2EA;color:#14110A}\n.dotbtn{appearance:none;border:2px solid transparent;background:transparent;border-radius:50%;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}\n.dotbtn.on{border-color:#FFD23F}\n.dotbtn.sm{width:36px;height:36px}\n.hud-bottom{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}\n.hud-bottom > *{pointer-events:auto}\n.ticker{padding:10px 18px;font-size:17px;font-weight:600;max-width:min(720px,100%);text-align:center}\n.prog{position:relative;width:min(980px,100%);height:44px;padding:0 16px}\n.prog-track{position:absolute;left:16px;right:40px;top:19px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}\n.focus{position:absolute;right:16px;bottom:130px;padding:12px 16px;min-width:240px;display:flex;flex-direction:column;gap:4px}\n.sci{position:absolute;right:16px;bottom:130px;width:340px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}\n.sci-grid{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px}\n.sci-grid span:nth-child(even){text-align:right}\n.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}\n.center > *{pointer-events:auto}\n.count{font-size:min(30vw,220px);font-weight:800;line-height:1;color:#FFD23F;text-shadow:0 10px 40px rgba(0,0,0,.5)}\n.win{padding:18px 30px;display:flex;align-items:center;gap:18px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}\n@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}\n.modal{width:min(880px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:22px}\n.tbl{min-width:600px;font-size:15px;display:flex;flex-direction:column}\n.tbl .tr{display:grid;grid-template-columns:48px minmax(120px,1fr) 92px 100px 92px 72px 64px;gap:8px;align-items:center;padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.06)}\n.tbl.lg .tr{grid-template-columns:48px minmax(120px,1fr) 72px 80px 64px minmax(110px,1fr)}\n.tbl.sm .tr{grid-template-columns:48px minmax(120px,1fr) 80px 80px;min-width:0}\n.tbl.sm{min-width:0}\n.tbl .th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#B9BEC8;font-weight:600;border-bottom-color:rgba(255,255,255,.14)}\n.tbl .num{text-align:right}\n.scroll-x{overflow-x:auto}\n.title-xl{font-size:clamp(44px,7vw,84px);line-height:.92;font-weight:800;letter-spacing:-.02em;margin:0}\n.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}\n.kbtn{appearance:none;font:inherit;font-weight:600;font-size:14px;text-align:left;color:#F5F2EA;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;min-height:44px;padding:6px 10px;cursor:pointer}\n.kbtn:hover{background:rgba(255,210,63,.16);border-color:rgba(255,210,63,.5)}\n.seq{display:flex;flex-wrap:wrap;gap:6px}\n.seqchip{appearance:none;font:inherit;font-size:13px;font-weight:600;color:#14110A;background:#F5F2EA;border:0;border-radius:999px;min-height:36px;padding:0 10px 0 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}\n.seqchip:hover{background:#FFD23F}\n.posch{width:100%;height:auto;display:block;background:rgba(255,255,255,.04);border-radius:12px}\n.lab-side{width:min(540px,calc(100% - 48px))}\n.lab-slider{display:flex;flex-direction:column;gap:6px}\n.lab-slider input[type=range]{width:100%;accent-color:#FFD23F;height:32px;cursor:pointer}\n.lab-res{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05)}\n.lab-chrono{position:absolute;right:16px;top:16px;width:270px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}\n.tbl.lab-tbl{min-width:640px;font-size:13px}\n.tbl.lab-tbl .tr{grid-template-columns:34px minmax(110px,1fr) 78px 80px 64px 60px 70px 60px;gap:6px;padding:7px 6px}\n.matchip{font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.08);white-space:nowrap}\n@media (max-width:760px){\n .hud-tl{width:auto;right:16px;padding:10px 12px}\n .hud-tl .rows{display:grid;grid-template-columns:1fr 1fr;gap:2px}\n .hud-tr{top:auto;bottom:150px;right:8px;left:8px;max-width:none;align-items:stretch}\n .focus,.sci{display:none}\n .lab-chrono{left:8px;right:8px;width:auto;top:8px;padding:10px 12px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px}\n .lab-chrono .mono{font-size:28px}\n .side{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:66vh}\n .side-scroll{padding:18px;gap:20px}\n .ticker{font-size:15px}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"gp\" data-canvas-width=\"1440\" data-canvas-height=\"900\" data-document-role=\"page\" data-label=\"Canicas GP — simulador\">\n  <canvas class=\"gp-canvas\" ref=\"{{canvasRef}}\" sc-camel-on-pointer-down=\"{{onPD}}\" sc-camel-on-pointer-move=\"{{onPM}}\" sc-camel-on-pointer-up=\"{{onPU}}\" sc-camel-on-pointer-cancel=\"{{onPU}}\" sc-camel-on-wheel=\"{{onWheel}}\" sc-camel-on-context-menu=\"{{onCtx}}\" aria-label=\"Vista 3D de la carrera de canicas\"><\u002Fcanvas>\n\n  <sc-if value=\"{{showLoading}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"center\">\n      <div class=\"panel\" style=\"padding: 20px 26px; display: flex; flex-direction: column; gap: 6px; align-items: center\">\n        <div style=\"font-size: 20px; font-weight: 800\">{{loadingText}}<\u002Fdiv>\n        <div style=\"font-size: 14px; color: #B9BEC8\">Montando curvas, bifurcaciones, embudos y saltos…<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isHome}}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"side panel\">\n      <div class=\"side-scroll\">\n        <div style=\"display: flex; flex-direction: column; gap: 14px\">\n          <div class=\"eyebrow\">Gran Premio de mundos en miniatura<\u002Fdiv>\n          <h1 class=\"title-xl\">Canicas<br><span style=\"color: #FFD23F\">GP<\u002Fspan><\u002Fh1>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #D6D9DF; text-wrap: pretty\">Seis canicas y la gravedad. Circuitos en miniatura con una gran bifurcación, camas elásticas, tubos de vacío, martillos, pinball, embudos, norias, imanes y cintas transportadoras. Y un laboratorio para medir la física de verdad.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; align-items: center\">\n          <sc-for list=\"{{colorList}}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div class=\"ball\" style=\"width: 34px; height: 34px; background: {{c.color}}\" title=\"{{c.label}}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <button class=\"btn primary big\" sc-camel-on-click=\"{{goQuick}}\">Carrera rápida<\u002Fbutton>\n          <button class=\"btn big\" sc-camel-on-click=\"{{goLeagueSetup}}\">Nueva liga<\u002Fbutton>\n          <sc-if value=\"{{hasSavedLeague}}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"btn big\" sc-camel-on-click=\"{{continueLeague}}\">Continuar liga · carrera {{savedLeagueNext}}<\u002Fbutton>\n          <\u002Fsc-if>\n          <button class=\"btn big\" sc-camel-on-click=\"{{goEditor}}\">Crear un circuito<\u002Fbutton>\n          <button class=\"btn big\" sc-camel-on-click=\"{{goLab}}\">Laboratorio de física<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #B9BEC8; line-height: 1.5\">\n          <div>Arrastra con el botón izquierdo para girar la cámara, con el derecho para desplazarla y usa la rueda para acercarte.<\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n            <button class=\"chip {{qualityClass}}\" sc-camel-on-click=\"{{toggleQuality}}\">Gráficos: {{qualityLabel}}<\u002Fbutton>\n            <button class=\"chip {{soundClass}}\" sc-camel-on-click=\"{{toggleSound}}\">Sonido: {{soundLabel}}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isSetup}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"side panel\">\n      <div class=\"side-scroll\">\n        <div style=\"display: flex; align-items: center; gap: 12px\">\n          <button class=\"btn icon\" sc-camel-on-click=\"{{goHome}}\" aria-label=\"Volver al inicio\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <div>\n            <div class=\"eyebrow\">{{setupEyebrow}}<\u002Fdiv>\n            <div style=\"font-size: 26px; font-weight: 800\">{{setupTitle}}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{isLeagueMode}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px\">\n            <div class=\"eyebrow\">Carreras de la liga<\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n              <sc-for list=\"{{leagueCounts}}\" as=\"o\" hint-placeholder-count=\"3\">\n                <button class=\"chip {{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\">{{o.label}}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div class=\"eyebrow\">Circuitos<\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n              <sc-for list=\"{{leagueSources}}\" as=\"o\" hint-placeholder-count=\"3\">\n                <button class=\"chip {{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\">{{o.label}}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{isQuickMode}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; gap: 8px\">\n              <button class=\"chip {{tabFixedCls}}\" sc-camel-on-click=\"{{tabFixed}}\">Circuitos fijos<\u002Fbutton>\n              <button class=\"chip {{tabRandomCls}}\" sc-camel-on-click=\"{{tabRandom}}\">Aleatorio<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{isTabFixed}}\" hint-placeholder-val=\"{{ true }}\">\n              <div class=\"cards\">\n                <sc-for list=\"{{fixedCards}}\" as=\"f\" hint-placeholder-count=\"8\">\n                  <button class=\"card {{f.cls}}\" sc-camel-on-click=\"{{f.pick}}\">\n                    <span style=\"font-weight: 700; font-size: 16px\">{{f.name}}<\u002Fspan>\n                    <span style=\"font-size: 13px; color: #B9BEC8\">{{f.env}} · {{f.dur}}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{isTabRandom}}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 14px\">\n                <div class=\"eyebrow\">Colores<\u002Fdiv>\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n                  <sc-for list=\"{{envChips}}\" as=\"o\" hint-placeholder-count=\"5\">\n                    <button class=\"chip {{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\">{{o.label}}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div class=\"eyebrow\">Duración aproximada<\u002Fdiv>\n                <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n                  <sc-for list=\"{{durChips}}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <button class=\"chip {{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\">{{o.label}}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display: flex; gap: 10px; align-items: end\">\n                  <div style=\"display: flex; flex-direction: column; gap: 6px; flex: 1\">\n                    <label class=\"eyebrow\" for=\"gp-seed\">Semilla del circuito<\u002Flabel>\n                    <input id=\"gp-seed\" class=\"input mono\" inputmode=\"numeric\" value=\"{{seedText}}\" sc-camel-on-input=\"{{onSeed}}\">\n                  <\u002Fdiv>\n                  <button class=\"btn\" sc-camel-on-click=\"{{applySeed}}\">Cargar<\u002Fbutton>\n                  <button class=\"btn primary\" sc-camel-on-click=\"{{newRandom}}\">Nuevo<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{hasInfo}}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; color: #D6D9DF\">\n                <sc-for list=\"{{infoTags}}\" as=\"t\" hint-placeholder-count=\"4\">\n                  <span style=\"padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.07)\">{{t}}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n            <div class=\"eyebrow\">Canicas<\u002Fdiv>\n            <div style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n              <button class=\"chip sm {{namesCls}}\" sc-camel-on-click=\"{{toggleNames}}\">Nombres<\u002Fbutton>\n              <button class=\"chip sm {{traitsCls}}\" sc-camel-on-click=\"{{toggleTraits}}\">Personalidades<\u002Fbutton>\n              <button class=\"chip sm {{teamsCls}}\" sc-camel-on-click=\"{{toggleTeams}}\">Por equipos<\u002Fbutton>\n              <button class=\"chip sm {{matsCls}}\" sc-camel-on-click=\"{{toggleMats}}\">Materiales<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n            <sc-for list=\"{{marbleRows}}\" as=\"n\" hint-placeholder-count=\"6\">\n              <div style=\"display: flex; align-items: center; gap: 10px\">\n                <div class=\"ball\" style=\"width: 28px; height: 28px; background: {{n.color}}\"><\u002Fdiv>\n                <sc-if value=\"{{n.editable}}\" hint-placeholder-val=\"{{ false }}\">\n                  <input id=\"{{n.id}}\" class=\"input\" maxlength=\"14\" placeholder=\"{{n.label}}\" value=\"{{n.value}}\" sc-camel-on-input=\"{{n.onInput}}\" aria-label=\"{{n.aria}}\">\n                <\u002Fsc-if>\n                <sc-if value=\"{{n.fixed}}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"flex: 1; font-weight: 600\">{{n.label}}<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{n.showTrait}}\" hint-placeholder-val=\"{{ false }}\">\n                  <button class=\"chip sm\" sc-camel-on-click=\"{{n.cycleTrait}}\" title=\"{{n.traitDesc}}\" style=\"white-space: nowrap\">{{n.trait}}<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{n.showMat}}\" hint-placeholder-val=\"{{ false }}\">\n                  <button class=\"chip sm\" sc-camel-on-click=\"{{n.cycleMat}}\" title=\"{{n.matDesc}}\" style=\"white-space: nowrap\">{{n.mat}}<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{n.showTeam}}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,.08); white-space: nowrap\">{{n.team}}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{useNames}}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"btn\" sc-camel-on-click=\"{{randomNames}}\">Nombres al azar<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{useMats}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 13px; color: #B9BEC8; line-height: 1.5\">Materiales: el acero pesa 3 veces más que el vidrio y gana los choques (y los imanes lo atraen); la madera es ligera y rueda con más rozamiento; la hueca gasta más energía en girar.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{useTraits}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 13px; color: #B9BEC8; line-height: 1.5\">Pulsa una personalidad para cambiarla. Pesada: gana los choques. Ligera: rebota más. Agarrona: no patina. Saltarina: imprevisible. Escurridiza: rápida pero se va en las curvas.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <div class=\"eyebrow\">Apuestas de la clase<\u002Fdiv>\n          <div style=\"display: flex; gap: 8px\">\n            <input class=\"input\" maxlength=\"16\" placeholder=\"Nombre del jugador\" value=\"{{playerDraft}}\" sc-camel-on-input=\"{{onPlayerDraft}}\" aria-label=\"Nombre del jugador\">\n            <button class=\"btn\" sc-camel-on-click=\"{{addPlayer}}\">Añadir<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n            <sc-for list=\"{{playerChips}}\" as=\"p\" hint-placeholder-count=\"0\">\n              <button class=\"chip sm\" sc-camel-on-click=\"{{p.remove}}\" aria-label=\"{{p.aria}}\">{{p.name}} ✕<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size: 13px; color: #B9BEC8\">Antes de cada salida, cada jugador elige su canica. Acertar la ganadora da 3 puntos y el podio, 1.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <button class=\"btn primary big\" sc-camel-on-click=\"{{setupContinue}}\">{{setupCta}}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isEditor}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"side panel\" style=\"width: min(560px, calc(100% - 48px))\">\n      <div class=\"side-scroll\">\n        <div style=\"display: flex; align-items: center; gap: 12px\">\n          <button class=\"btn icon\" sc-camel-on-click=\"{{goHome}}\" aria-label=\"Volver al inicio\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <div>\n            <div class=\"eyebrow\">Editor<\u002Fdiv>\n            <div style=\"font-size: 26px; font-weight: 800\">Crea tu circuito<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <div class=\"eyebrow\">Colores<\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n            <sc-for list=\"{{edEnvChips}}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button class=\"chip {{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\">{{o.label}}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <div class=\"eyebrow\">Piezas · pulsa para añadir al final<\u002Fdiv>\n          <div class=\"kgrid\">\n            <sc-for list=\"{{kindBtns}}\" as=\"k\" hint-placeholder-count=\"20\">\n              <button class=\"kbtn\" sc-camel-on-click=\"{{k.add}}\">{{k.label}}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px\">\n            <div class=\"eyebrow\">Tu circuito ({{edCount}} piezas) · pulsa una para quitarla<\u002Fdiv>\n            <button class=\"chip sm\" sc-camel-on-click=\"{{edClear}}\">Vaciar<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"seq\">\n            <span style=\"font-size: 13px; color: #B9BEC8; align-self: center\">Salida →<\u002Fspan>\n            <sc-for list=\"{{edSeq}}\" as=\"q\" hint-placeholder-count=\"4\">\n              <button class=\"seqchip\" sc-camel-on-click=\"{{q.remove}}\" aria-label=\"{{q.aria}}\">{{q.label}} ✕<\u002Fbutton>\n            <\u002Fsc-for>\n            <span style=\"font-size: 13px; color: #B9BEC8; align-self: center\">→ Meta<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{edHasSkipped}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 14px; color: #FCA5A5\">No han cabido en la maqueta: {{edSkipped}}. Prueba a reordenar las piezas o con otra variante.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n          <button class=\"btn primary\" sc-camel-on-click=\"{{edBuild}}\">Construir y ver<\u002Fbutton>\n          <button class=\"btn\" sc-camel-on-click=\"{{edVariant}}\">Otra variante<\u002Fbutton>\n          <button class=\"btn\" sc-camel-on-click=\"{{edRandom}}\">Piezas al azar<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <label class=\"eyebrow\" for=\"gp-code\">Código para compartir<\u002Flabel>\n          <div style=\"display: flex; gap: 8px\">\n            <input id=\"gp-code\" class=\"input mono\" value=\"{{edCodeText}}\" sc-camel-on-input=\"{{onCode}}\" style=\"font-size: 14px\">\n            <button class=\"btn\" sc-camel-on-click=\"{{edCopy}}\">{{edCopyLabel}}<\u002Fbutton>\n            <button class=\"btn\" sc-camel-on-click=\"{{edLoadCode}}\">Cargar<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size: 13px; color: #B9BEC8\">Copia el código para que otra persona cargue exactamente tu circuito.<\u002Fdiv>\n        <\u002Fdiv>\n        <button class=\"btn primary big\" sc-camel-on-click=\"{{edRace}}\">Correr en este circuito<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isLab}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"side panel lab-side\">\n      <div class=\"side-scroll\">\n        <div style=\"display: flex; align-items: center; gap: 12px\">\n          <button class=\"btn icon\" sc-camel-on-click=\"{{goHome}}\" aria-label=\"Volver al inicio\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <div>\n            <div class=\"eyebrow\">Laboratorio de física<\u002Fdiv>\n            <div style=\"font-size: 26px; font-weight: 800\">La rampa<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.5; color: #D6D9DF; text-wrap: pretty\">Suelta hasta tres canicas a la vez por la misma rampa. Cronometramos cuánto tardan en bajar, a qué velocidad llegan abajo y hasta qué altura suben por la rampa del otro lado.<\u002Fp>\n\n        <div style=\"display: flex; flex-direction: column; gap: 14px\">\n          <div class=\"lab-slider\">\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline\"><label class=\"eyebrow\" for=\"lab-angle\">Inclinación<\u002Flabel><span class=\"mono\" style=\"font-size: 20px; font-weight: 700\">{{labAngleText}}<\u002Fspan><\u002Fdiv>\n            <input id=\"lab-angle\" type=\"range\" min=\"2\" max=\"30\" step=\"1\" value=\"{{labAngle}}\" sc-camel-on-input=\"{{onLabAngle}}\">\n          <\u002Fdiv>\n          <div class=\"lab-slider\">\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline\"><label class=\"eyebrow\" for=\"lab-len\">Longitud de la rampa<\u002Flabel><span class=\"mono\" style=\"font-size: 20px; font-weight: 700\">{{labLenText}}<\u002Fspan><\u002Fdiv>\n            <input id=\"lab-len\" type=\"range\" min=\"0.5\" max=\"3\" step=\"0.1\" value=\"{{labLen}}\" sc-camel-on-input=\"{{onLabLen}}\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n            <div class=\"eyebrow\">Superficie<\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n              <sc-for list=\"{{labSurfChips}}\" as=\"o\" hint-placeholder-count=\"4\">\n                <button class=\"chip sm {{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\">{{o.label}}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n            <div class=\"eyebrow\">Canicas · pulsa para cambiar<\u002Fdiv>\n            <sc-for list=\"{{labLaneRows}}\" as=\"l\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\">\n                <button class=\"chip sm {{l.onCls}}\" sc-camel-on-click=\"{{l.toggle}}\" aria-pressed=\"{{l.pressed}}\" style=\"gap: 8px\"><span class=\"dot\" style=\"background: {{l.color}}\"><\u002Fspan>Carril {{l.n}}<\u002Fbutton>\n                <button class=\"chip sm\" sc-camel-on-click=\"{{l.cycleMat}}\" disabled=\"{{l.off}}\" style=\"opacity: {{l.op}}\">{{l.mat}}<\u002Fbutton>\n                <button class=\"chip sm\" sc-camel-on-click=\"{{l.cycleSize}}\" disabled=\"{{l.off}}\" style=\"opacity: {{l.op}}\">{{l.size}}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap; align-items: center\">\n            <button class=\"btn primary big\" sc-camel-on-click=\"{{labRun}}\" style=\"flex: 1 1 200px\">{{labRunLabel}}<\u002Fbutton>\n            <button class=\"btn\" sc-camel-on-click=\"{{labReset}}\">Recolocar<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\">\n            <span class=\"eyebrow\">Velocidad de reproducción<\u002Fspan>\n            <sc-for list=\"{{labSpeedBtns}}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button class=\"chip sm {{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\">{{o.label}}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <div class=\"eyebrow\">Resultados de esta tirada<\u002Fdiv>\n          <sc-for list=\"{{labLive}}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div class=\"lab-res\">\n              <span class=\"dot\" style=\"background: {{r.color}}\"><\u002Fspan>\n              <div style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n                <span style=\"font-weight: 700\">{{r.title}}<\u002Fspan>\n                <span style=\"font-size: 13px; color: #B9BEC8\">{{r.theory}}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"text-align: right; display: flex; flex-direction: column; gap: 2px\">\n                <span class=\"mono\" style=\"font-weight: 700\">{{r.main}}<\u002Fspan>\n                <span class=\"mono\" style=\"font-size: 13px; color: #B9BEC8\">{{r.sub}}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{labHasNote}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 14px; line-height: 1.5; color: #FFE7A3; padding: 10px 12px; border-radius: 10px; background: rgba(255,210,63,.1)\">{{labNote}}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap\">\n            <div class=\"eyebrow\">Tabla de datos · {{labDataCount}}<\u002Fdiv>\n            <div style=\"display: flex; gap: 6px\">\n              <a class=\"btn\" href=\"{{labCsvHref}}\" download=\"laboratorio-canicas.csv\" style=\"text-decoration: none; min-height: 40px\">Descargar CSV<\u002Fa>\n              <button class=\"btn\" sc-camel-on-click=\"{{labClear}}\" style=\"min-height: 40px\">Borrar<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{labHasData}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"scroll-x\">\n              <div class=\"tbl lab-tbl\">\n                <div class=\"tr th\"><span>N.º<\u002Fspan><span>Canica<\u002Fspan><span>Rampa<\u002Fspan><span>Superficie<\u002Fspan><span class=\"num\">Tiempo<\u002Fspan><span class=\"num\">Teoría<\u002Fspan><span class=\"num\">Velocidad<\u002Fspan><span class=\"num\">Altura<\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{labData}}\" as=\"d\" hint-placeholder-count=\"3\">\n                  <div class=\"tr\"><span class=\"mono\">{{d.n}}<\u002Fspan><span style=\"display: flex; align-items: center; gap: 6px\"><span class=\"dot\" style=\"background: {{d.color}}; width: 12px; height: 12px\"><\u002Fspan>{{d.marble}}<\u002Fspan><span>{{d.ramp}}<\u002Fspan><span>{{d.surf}}<\u002Fspan><span class=\"num mono\">{{d.t}}<\u002Fspan><span class=\"num mono\">{{d.tTh}}<\u002Fspan><span class=\"num mono\">{{d.v}}<\u002Fspan><span class=\"num mono\">{{d.h}}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{labNoData}}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size: 14px; color: #B9BEC8\">Cada tirada añade una fila por canica. Luego puedes descargar la tabla y abrirla en una hoja de cálculo.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.55; color: #D6D9DF\">\n          <div class=\"eyebrow\">Qué dice la teoría<\u002Fdiv>\n          <div>Una canica que <b>rueda<\u002Fb> sin perder energía tarda <span class=\"mono\">t = √(2·L / (k·g·sen θ))<\u002Fspan> en bajar una rampa de longitud L e inclinación θ. El factor k vale <b>5/7<\u002Fb> en una canica maciza y <b>3/5<\u002Fb> en una hueca: parte de la energía se va en hacerla girar.<\u002Fdiv>\n          <div>La <b>masa<\u002Fb> y el <b>tamaño<\u002Fb> no aparecen en la fórmula: una canica de acero y una de madera del mismo tipo deberían llegar casi a la vez. Las diferencias reales vienen del rozamiento de rodadura y del aire.<\u002Fdiv>\n          <div>En el <b>hielo<\u002Fb> con mucha pendiente la canica no puede agarrarse y <b>resbala<\u002Fb> sin girar: entonces baja más rápido que rodando. En la <b>moqueta<\u002Fb>, si la rampa es suave, ni siquiera arranca.<\u002Fdiv>\n          <div>La línea azul marca la altura de salida. Sin rozamiento, la canica volvería a subir justo hasta ahí (conservación de la energía).<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel lab-chrono\">\n      <div class=\"eyebrow\">Cronómetro<\u002Fdiv>\n      <div class=\"mono\" style=\"font-size: 44px; font-weight: 700; line-height: 1\">{{labClock}}<\u002Fdiv>\n      <sc-for list=\"{{labLive}}\" as=\"r\" hint-placeholder-count=\"3\">\n        <div style=\"display: flex; align-items: center; gap: 8px; font-size: 14px\">\n          <span class=\"dot\" style=\"background: {{r.color}}; width: 12px; height: 12px\"><\u002Fspan>\n          <span style=\"flex: 1\">{{r.short}}<\u002Fspan>\n          <span class=\"mono\" style=\"font-weight: 700\">{{r.main}}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size: 12px; color: #B9BEC8\">{{labConfigLine}}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isPrerace}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"side panel\">\n      <div class=\"side-scroll\">\n        <div style=\"display: flex; align-items: center; gap: 12px\">\n          <button class=\"btn icon\" sc-camel-on-click=\"{{preBack}}\" aria-label=\"Volver\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <div>\n            <div class=\"eyebrow\">{{preEyebrow}}<\u002Fdiv>\n            <div style=\"font-size: 28px; font-weight: 800; line-height: 1.1\">{{infoName}}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; color: #D6D9DF\">\n          <sc-for list=\"{{infoTags}}\" as=\"t\" hint-placeholder-count=\"4\">\n            <span style=\"padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.07)\">{{t}}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <div class=\"eyebrow\">Tiempo<\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n            <sc-for list=\"{{weatherChips}}\" as=\"o\" hint-placeholder-count=\"5\">\n              <button class=\"chip sm {{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\">{{o.label}}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size: 13px; color: #B9BEC8\">{{weatherNote}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <div class=\"eyebrow\">Salida en línea · carriles sorteados<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.05)\">\n            <sc-for list=\"{{gridSlots}}\" as=\"g\" hint-placeholder-count=\"6\">\n              <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0\">\n                <div class=\"ball\" style=\"width: 30px; height: 30px; background: {{g.color}}\"><\u002Fdiv>\n                <span style=\"font-size: 12px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{g.name}}<\u002Fspan>\n                <span style=\"font-size: 11px; color: #B9BEC8; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{g.trait}}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{hasPlayers}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <div class=\"eyebrow\">Apuestas de la clase<\u002Fdiv>\n            <sc-for list=\"{{betRows}}\" as=\"b\" hint-placeholder-count=\"2\">\n              <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\">\n                <span style=\"width: 110px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{b.name}}<\u002Fspan>\n                <sc-for list=\"{{b.opts}}\" as=\"o\" hint-placeholder-count=\"6\">\n                  <button class=\"dotbtn sm {{o.cls}}\" sc-camel-on-click=\"{{o.pick}}\" aria-label=\"{{o.aria}}\" aria-pressed=\"{{o.pressed}}\">\n                    <span class=\"ball\" style=\"width: 22px; height: 22px; background: {{o.color}}\"><\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{noPlayers}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <div class=\"eyebrow\">¿Quién crees que ganará?<\u002Fdiv>\n            <div style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n              <sc-for list=\"{{favBtns}}\" as=\"f\" hint-placeholder-count=\"6\">\n                <button class=\"dotbtn {{f.cls}}\" sc-camel-on-click=\"{{f.pick}}\" aria-label=\"{{f.aria}}\" aria-pressed=\"{{f.pressed}}\">\n                  <span class=\"ball\" style=\"width: 30px; height: 30px; background: {{f.color}}\"><\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size: 14px; color: #B9BEC8\">{{favText}}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap\">\n          <button class=\"btn primary big\" style=\"flex: 1\" sc-camel-on-click=\"{{startRace}}\">¡Salida!<\u002Fbutton>\n          <button class=\"btn big\" sc-camel-on-click=\"{{reshuffle}}\">Nuevo sorteo<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isRace}}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div class=\"hud-tl panel\">\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 10px\">\n          <div style=\"min-width: 0\">\n            <div class=\"eyebrow\" style=\"white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{infoName}}<\u002Fdiv>\n            <div class=\"mono\" style=\"font-size: 28px; font-weight: 700\">{{timeText}}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{isReplay}}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"background: #E5383B; color: #fff; font-weight: 800; font-size: 12px; letter-spacing: .12em; padding: 5px 8px; border-radius: 6px\">REPETICIÓN<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div class=\"rows\" style=\"display: flex; flex-direction: column; gap: 2px\">\n          <sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"6\">\n            <button class=\"row {{r.cls}}\" sc-camel-on-click=\"{{r.pick}}\" aria-label=\"{{r.aria}}\">\n              <span class=\"mono\" style=\"font-weight: 700; color: #B9BEC8\">{{r.pos}}<\u002Fspan>\n              <span class=\"dot\" style=\"background: {{r.color}}\"><\u002Fspan>\n              <span style=\"font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{r.name}}<\u002Fspan>\n              <span class=\"mono\" style=\"font-size: 13px; color: {{r.gapColor}}\">{{r.gap}}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"hud-tr\">\n        <div class=\"panel bar\" role=\"group\" aria-label=\"Cámara\">\n          <sc-for list=\"{{camBtns}}\" as=\"b\" hint-placeholder-count=\"3\">\n            <button class=\"seg {{b.cls}}\" sc-camel-on-click=\"{{b.pick}}\">{{b.label}}<\u002Fbutton>\n          <\u002Fsc-for>\n          <sc-if value=\"{{isOverview}}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"display: inline-flex; gap: 4px; padding-left: 6px; border-left: 1px solid rgba(255,255,255,.15)\" role=\"group\" aria-label=\"Plano de la vista general\">\n              <sc-for list=\"{{zoomBtns}}\" as=\"z\" hint-placeholder-count=\"3\">\n                <button class=\"seg {{z.cls}}\" sc-camel-on-click=\"{{z.pick}}\">{{z.label}}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fspan>\n          <\u002Fsc-if>\n          <sc-for list=\"{{followBtns}}\" as=\"b\" hint-placeholder-count=\"6\">\n            <button class=\"dotbtn {{b.cls}}\" sc-camel-on-click=\"{{b.pick}}\" aria-label=\"{{b.aria}}\">\n              <span class=\"ball\" style=\"width: 24px; height: 24px; background: {{b.color}}\"><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"panel bar\" role=\"group\" aria-label=\"Velocidad y opciones\">\n          <sc-for list=\"{{speedBtns}}\" as=\"b\" hint-placeholder-count=\"4\">\n            <button class=\"seg mono {{b.cls}}\" sc-camel-on-click=\"{{b.pick}}\">{{b.label}}<\u002Fbutton>\n          <\u002Fsc-for>\n          <button class=\"seg\" sc-camel-on-click=\"{{togglePause}}\" aria-label=\"{{pauseAria}}\">\n            <sc-if value=\"{{paused}}\" hint-placeholder-val=\"{{ false }}\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M7 5l12 7-12 7z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fsc-if>\n            <sc-if value=\"{{notPaused}}\" hint-placeholder-val=\"{{ true }}\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\u002Frect><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\u002Frect><\u002Fsvg>\n            <\u002Fsc-if>\n          <\u002Fbutton>\n          <button class=\"seg {{sciCls}}\" sc-camel-on-click=\"{{toggleScience}}\">Ciencia<\u002Fbutton>\n          <button class=\"seg\" sc-camel-on-click=\"{{toggleSound}}\" aria-label=\"{{soundAria}}\">\n            <sc-if value=\"{{sound}}\" hint-placeholder-val=\"{{ true }}\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9v6h4l5 4V5L8 9z\"><\u002Fpath><path d=\"M16.5 8.5a5 5 0 0 1 0 7\"><\u002Fpath><\u002Fsvg>\n            <\u002Fsc-if>\n            <sc-if value=\"{{noSound}}\" hint-placeholder-val=\"{{ false }}\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9v6h4l5 4V5L8 9z\"><\u002Fpath><path d=\"M17 9l5 5M22 9l-5 5\"><\u002Fpath><\u002Fsvg>\n            <\u002Fsc-if>\n          <\u002Fbutton>\n          <button class=\"seg\" sc-camel-on-click=\"{{zoomIn}}\" aria-label=\"Acercar\">+<\u002Fbutton>\n          <button class=\"seg\" sc-camel-on-click=\"{{zoomOut}}\" aria-label=\"Alejar\">−<\u002Fbutton>\n          <sc-if value=\"{{isReplay}}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"seg\" sc-camel-on-click=\"{{exitReplay}}\">{{exitReplayLabel}}<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{notReplay}}\" hint-placeholder-val=\"{{ true }}\">\n            <button class=\"seg\" sc-camel-on-click=\"{{abandon}}\">Abandonar<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{showFocus}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"focus panel\">\n          <div class=\"eyebrow\">{{focusLabel}}<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 10px\">\n            <span class=\"ball\" style=\"width: 26px; height: 26px; background: {{focusColor}}\"><\u002Fspan>\n            <span style=\"font-size: 20px; font-weight: 800\">{{focusName}}<\u002Fspan>\n            <span class=\"mono\" style=\"margin-left: auto; font-size: 18px; color: #FFD23F\">{{focusPos}}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: #D6D9DF\">\n            <span class=\"mono\">{{focusSpeed}}<\u002Fspan>\n            <span>{{focusSection}}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{hasFocusTrait}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 13px; color: #B9BEC8\">{{focusTrait}}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{showSci}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"sci panel\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n            <div class=\"eyebrow\">Modo ciencia · {{focusName}}<\u002Fdiv>\n            <span style=\"font-size: 12px; color: #B9BEC8\">{{sciMode}}<\u002Fspan>\n          <\u002Fdiv>\n          <canvas ref=\"{{sciRef}}\" width=\"600\" height=\"200\" style=\"width: 100%; height: 100px; border-radius: 8px; display: block\"><\u002Fcanvas>\n          <div style=\"display: flex; gap: 14px; font-size: 12px; color: #D6D9DF\">\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 3px; background: #FFD23F\"><\u002Fspan>Velocidad (0–4 m/s)<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 3px; background: #7DD3FC\"><\u002Fspan>Altura (0–2,2 m)<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"sci-grid mono\">\n            <span>Velocidad<\u002Fspan><span>{{sciV}}<\u002Fspan>\n            <span>Altura sobre la mesa<\u002Fspan><span>{{sciH}}<\u002Fspan>\n            <span>Pendiente<\u002Fspan><span>{{sciSlope}}<\u002Fspan>\n            <span style=\"color: #7DD3FC\">Energía potencial (m·g·h)<\u002Fspan><span>{{sciEp}}<\u002Fspan>\n            <span style=\"color: #FFD23F\">Energía cinética (rodando)<\u002Fspan><span>{{sciEk}}<\u002Fspan>\n            <span>Energía mecánica<\u002Fspan><span>{{sciEm}}<\u002Fspan>\n            <span style=\"color: #F87171\">Peso<\u002Fspan><span>{{sciW}}<\u002Fspan>\n            <span style=\"color: #60A5FA\">Fuerza normal<\u002Fspan><span>{{sciN}}<\u002Fspan>\n            <span style=\"color: #FBBF24\">Rozamiento + aire<\u002Fspan><span>{{sciF}}<\u002Fspan>\n            <span>Fuerza centrípeta<\u002Fspan><span>{{sciC}}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size: 12px; color: #B9BEC8; line-height: 1.45\">Masa de la canica: {{sciMass}}. Al bajar, la energía potencial se convierte en cinética; el rozamiento la gasta en calor. Los ascensores y la noria le devuelven energía. Flechas: verde velocidad, rojo peso, azul normal, naranja rozamiento.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{showCount}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"center\"><div class=\"count\">{{countText}}<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{showWin}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"center\" style=\"align-items: flex-start; padding-top: 18vh\">\n          <div class=\"panel win\">\n            <div class=\"ball\" style=\"width: 56px; height: 56px; background: {{winColor}}\"><\u002Fdiv>\n            <div>\n              <div class=\"eyebrow\" style=\"color: #FFD23F\">¡Ganadora!<\u002Fdiv>\n              <div style=\"font-size: 34px; font-weight: 800\">{{winName}}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{showKeyLabel}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"center\" style=\"align-items: flex-start; padding-top: 90px\">\n          <div class=\"panel\" style=\"padding: 10px 18px; font-size: 18px; font-weight: 800\">Repetición a cámara lenta · {{keyLabel}}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div class=\"hud-bottom\">\n        <sc-if value=\"{{hasMsg}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"ticker panel\" aria-live=\"polite\">{{lastMsg}}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div class=\"prog panel\" aria-hidden=\"true\">\n          <div class=\"prog-track\"><\u002Fdiv>\n          <sc-for list=\"{{progSections}}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div style=\"position: absolute; top: 19px; height: 6px; border-radius: 3px; left: {{p.left}}; width: {{p.width}}; background: {{p.color}}\"><\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"position: absolute; right: 14px; top: 11px; width: 20px; height: 20px; border-radius: 4px; background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0/10px 10px\"><\u002Fdiv>\n          <sc-for list=\"{{progDots}}\" as=\"d\" hint-placeholder-count=\"6\">\n            <div class=\"dot\" style=\"position: absolute; top: 14px; width: 16px; height: 16px; margin-left: -8px; border: 2px solid rgba(14,16,20,.9); left: {{d.left}}; background: {{d.color}}; z-index: {{d.z}}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: #D6D9DF; text-shadow: 0 1px 3px rgba(0,0,0,.8)\">\n          <sc-for list=\"{{legend}}\" as=\"l\" hint-placeholder-count=\"5\">\n            <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 6px; border-radius: 3px; background: {{l.color}}\"><\u002Fspan>{{l.label}}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isResults}}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"center\" style=\"background: rgba(8,9,12,.45)\">\n      <div class=\"panel modal\">\n        <div style=\"display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap\">\n          <div>\n            <div class=\"eyebrow\">{{resEyebrow}}<\u002Fdiv>\n            <div style=\"font-size: 30px; font-weight: 800\">{{infoName}}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 15px; color: #D6D9DF\">{{favResult}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end\">\n          <sc-for list=\"{{podium}}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 10px; order: {{p.order}}\">\n              <div class=\"ball\" style=\"width: {{p.size}}; height: {{p.size}}; background: {{p.color}}\"><\u002Fdiv>\n              <div style=\"font-weight: 800; font-size: 18px; text-align: center\">{{p.name}}<\u002Fdiv>\n              <div style=\"width: 100%; height: {{p.h}}; border-radius: 12px 12px 4px 4px; background: rgba(255,255,255,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px\">\n                <span style=\"font-size: 30px; font-weight: 800; color: {{p.medal}}\">{{p.pos}}<\u002Fspan>\n                <span class=\"mono\" style=\"font-size: 13px; color: #D6D9DF\">{{p.time}}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <div class=\"eyebrow\">Posiciones durante la carrera<\u002Fdiv>\n          <svg class=\"posch\" sc-camel-view-box=\"0 0 640 230\" role=\"img\" aria-label=\"Gráfica de la posición de cada canica a lo largo de la carrera\">\n            <line x1=\"40\" y1=\"20\" x2=\"630\" y2=\"20\" stroke=\"rgba(255,255,255,.08)\"><\u002Fline>\n            <line x1=\"40\" y1=\"58\" x2=\"630\" y2=\"58\" stroke=\"rgba(255,255,255,.08)\"><\u002Fline>\n            <line x1=\"40\" y1=\"96\" x2=\"630\" y2=\"96\" stroke=\"rgba(255,255,255,.08)\"><\u002Fline>\n            <line x1=\"40\" y1=\"134\" x2=\"630\" y2=\"134\" stroke=\"rgba(255,255,255,.08)\"><\u002Fline>\n            <line x1=\"40\" y1=\"172\" x2=\"630\" y2=\"172\" stroke=\"rgba(255,255,255,.08)\"><\u002Fline>\n            <line x1=\"40\" y1=\"210\" x2=\"630\" y2=\"210\" stroke=\"rgba(255,255,255,.08)\"><\u002Fline>\n            <text x=\"22\" y=\"24\" fill=\"#B9BEC8\" font-size=\"13\" font-family=\"JetBrains Mono, monospace\">1º<\u002Ftext>\n            <text x=\"22\" y=\"214\" fill=\"#B9BEC8\" font-size=\"13\" font-family=\"JetBrains Mono, monospace\">6º<\u002Ftext>\n            <text x=\"630\" y=\"228\" fill=\"#B9BEC8\" font-size=\"12\" text-an
